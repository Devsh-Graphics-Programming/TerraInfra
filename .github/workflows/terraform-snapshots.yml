name: terraform-snapshots

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: terraform-snapshots-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  snapshots:
    if: github.ref_name == 'env/prod'
    runs-on: ubuntu-latest
    environment: prod
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

      SCW_ACCESS_KEY: ${{ secrets.SNAPSHOTS_SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SNAPSHOTS_SCW_SECRET_KEY }}

      AWS_ACCESS_KEY_ID: ${{ secrets.SNAPSHOTS_SCW_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SNAPSHOTS_SCW_SECRET_KEY }}

      SNAPSHOTS_TFSTATE_BUCKET: ${{ vars.SNAPSHOTS_TFSTATE_BUCKET }}
      SNAPSHOTS_TFSTATE_ENDPOINT: ${{ vars.SNAPSHOTS_TFSTATE_ENDPOINT }}
      SNAPSHOTS_TFSTATE_KEY: ${{ vars.SNAPSHOTS_TFSTATE_KEY }}
      SNAPSHOTS_TFSTATE_REGION: ${{ vars.SNAPSHOTS_TFSTATE_REGION }}

      TF_VAR_project_id: ${{ vars.SNAPSHOTS_PROJECT_ID }}
      TF_VAR_volume_name: ${{ vars.SNAPSHOTS_VOLUME_NAME }}
      TF_VAR_env_name: prod

    defaults:
      run:
        shell: bash
        working-directory: terraform/snapshots

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform init (remote state)
        run: |
          terraform init -input=false \
            -backend-config="bucket=${SNAPSHOTS_TFSTATE_BUCKET}" \
            -backend-config="key=${SNAPSHOTS_TFSTATE_KEY}" \
            -backend-config="region=${SNAPSHOTS_TFSTATE_REGION}" \
            -backend-config="endpoint=${SNAPSHOTS_TFSTATE_ENDPOINT}" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="force_path_style=true"

      - name: Terraform apply (scheduled)
        if: github.event_name == 'schedule'
        run: terraform apply -auto-approve -no-color

      - name: Terraform apply (manual)
        if: github.event_name == 'workflow_dispatch'
        run: terraform apply -auto-approve -no-color -replace=time_static.snapshot_trigger

      - name: Show snapshot ID
        run: terraform output -raw latest_snapshot_id
