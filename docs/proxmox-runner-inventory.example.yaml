version: 2
defaults:
  backend: proxmox
  clone_mode: linked
  lease_ttl_minutes: 120
  release_on_failure: true
  destroy_after_job: true
templates:
  - id: windows-base-stable
    channel: windows-base/stable
    builder: proxmox-iso
    guest_os: windows11
    communicator:
      type: winrm
    backend:
      type: proxmox
      node: example-gpu-node
      pool: example-ci-images
      storage: example-fast-lvm
      template_vmid: 9001
  - id: windows-gpu-nvidia-stable
    channel: windows-gpu-nvidia/stable
    builder: proxmox-clone
    parent: windows-base-stable
    guest_os: windows11
    communicator:
      type: winrm
    backend:
      type: proxmox
      node: example-gpu-node
      pool: example-ci-images
      storage: example-fast-lvm
      template_vmid: 9002
runner_classes:
  - id: win-gpu-nvidia
    labels:
      - windows
      - gpu
      - nvidia
      - vulkan
      - gpu-class-rtx-2070
    template: windows-gpu-nvidia-stable
    connection:
      type: winrm
    backend:
      type: proxmox
      target_node: example-gpu-node
      pool: example-ci-runners
      storage: example-fast-lvm
      vmid_range:
        start: 2000
        end: 2099
    warm_pool:
      min_ready: 1
      max_ready: 1
    policy:
      lease_ttl_minutes: 120
      boot_timeout_minutes: 10
      health_timeout_minutes: 15
      gpu_exclusive: true
      release_on_failure: true
      destroy_after_job: true
    health_checks:
      - guest-agent
      - winrm
      - nvidia-smi
      - vulkaninfo
      - workspace-ready
janitor:
  backend: proxmox
  pool: example-ci-runners
  vmid_range:
    start: 2000
    end: 2099
  require_tags:
    - managed-by=runnerctl
    - lifecycle=ephemeral
  stale_lease_after_minutes: 240
