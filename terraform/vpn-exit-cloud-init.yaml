#cloud-config
hostname: ${node_name}
package_update: true
packages:
  - curl
  - ca-certificates
write_files:
  - path: /etc/sysctl.d/90-vpn-exit.conf
    content: |
      net.ipv4.ip_forward=1
      net.ipv6.conf.all.forwarding=1
runcmd:
  - sysctl --system
  - curl -fsSL https://tailscale.com/install.sh | sh
  - systemctl enable --now tailscaled
