#cloud-config
package_update: true
package_upgrade: true

packages:
  - curl
  - htop
  - git
  - gettext-base
  - ca-certificates

write_files:
  - path: /root/bootstrap.sh
    permissions: "0755"
    owner: root:root
    content: |
      #!/bin/bash
      set -eu

      export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

      wait_for_k8s() {
        for i in $(seq 1 60); do
          if kubectl get nodes >/dev/null 2>&1; then
            return 0
          fi
          sleep 5
        done
        exit 1
      }

      wait_for_deploy() {
        ns="$1"
        name="$2"
        kubectl -n "$ns" rollout status deploy/"$name" --timeout=300s
      }

      wait_for_crd() {
        crd="$1"
        for i in $(seq 1 60); do
          if kubectl get crd "$crd" >/dev/null 2>&1; then
            return 0
          fi
          sleep 5
        done
        exit 1
      }

      wait_for_k8s

      if ! command -v helm >/dev/null 2>&1; then
        curl -fsSL https://get.helm.sh/helm-v3.15.3-linux-amd64.tar.gz -o /tmp/helm.tar.gz
        tar -xzf /tmp/helm.tar.gz -C /tmp
        mv /tmp/linux-amd64/helm /usr/local/bin/helm
        chmod +x /usr/local/bin/helm
      fi

      helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx || true
      helm repo add jetstack https://charts.jetstack.io || true
      helm repo add prometheus-community https://prometheus-community.github.io/helm-charts || true
      helm repo update

      helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
        --namespace infra \
        --create-namespace \
        --set controller.publishService.enabled=true

      helm upgrade --install cert-manager jetstack/cert-manager \
        --namespace cert-manager \
        --create-namespace \
        --set installCRDs=true

      wait_for_deploy infra ingress-nginx-controller
      wait_for_deploy cert-manager cert-manager
      wait_for_deploy cert-manager cert-manager-webhook

      wait_for_crd "certificates.cert-manager.io"
      wait_for_crd "clusterissuers.cert-manager.io"

      cat >/root/cluster-issuer.yaml <<'EOF'
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: letsencrypt-http
      spec:
        acme:
          email: ${acme_email}
          server: https://acme-v02.api.letsencrypt.org/directory
          privateKeySecretRef:
            name: letsencrypt-http-private-key
          solvers:
          - http01:
              ingress:
                class: nginx
      EOF

      kubectl apply -f /root/cluster-issuer.yaml

      helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
        --namespace monitoring \
        --create-namespace

      wait_for_deploy monitoring monitoring-grafana
      wait_for_deploy monitoring monitoring-kube-prometheus-operator

      if ! command -v flux >/dev/null 2>&1; then
        curl -s https://fluxcd.io/install.sh | bash
      fi

      flux install --components-extra=image-reflector-controller,image-automation-controller

      kubectl -n flux-system delete secret git-credentials || true
      kubectl -n flux-system create secret generic git-credentials \
        --from-literal=username=git \
        --from-literal=password='${github_persistent_terra_infra_ro_pat}'

      # Generate webhook secret (random per bootstrap)
      webhook_secret="$(head -c 32 /dev/urandom | base64 | tr -d '=')"

      kubectl -n flux-system delete secret github-webhook-token || true
      kubectl -n flux-system create secret generic github-webhook-token \
        --from-literal=token="$${webhook_secret}"

      cat >/root/flux-source.yaml <<'EOF'
      apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      metadata:
        name: terralinfra
        namespace: flux-system
      spec:
        interval: 2m
        url: ${config_repo_url}
        ref:
          branch: ${config_repo_branch}
        secretRef:
          name: git-credentials
      EOF

      cat >/root/flux-kustomization.yaml <<EOF
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: apps
        namespace: flux-system
      spec:
        interval: 2m
        prune: true
        path: ./${config_repo_path}
        sourceRef:
          kind: GitRepository
          name: terralinfra
          namespace: flux-system
        timeout: 2m
        postBuild:
          substitute:
            KIMAI_DOMAIN: ${kimai_domain}
            MONITORING_DOMAIN: ${monitoring_domain}
            FLUX_HOOK_DOMAIN: ${flux_hook_domain}
            GITHUB_WEBHOOK_SECRET: $${webhook_secret}
      EOF

      cat >/root/flux-receiver.yaml <<EOF
      apiVersion: notification.toolkit.fluxcd.io/v1
      kind: Receiver
      metadata:
        name: github-receiver
        namespace: flux-system
      spec:
        type: github
        events:
          - ping
          - push
        secretRef:
          name: github-webhook-token
        resources:
          - apiVersion: source.toolkit.fluxcd.io/v1
            kind: GitRepository
            name: terralinfra
            namespace: flux-system
        suspend: false
      ---
      apiVersion: v1
      kind: Secret
      metadata:
        name: github-webhook-token
        namespace: flux-system
      type: Opaque
      stringData:
        token: "$${webhook_secret}"
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: flux-receiver
        namespace: flux-system
      spec:
        type: ClusterIP
        ports:
          - port: 80
            targetPort: 9292
            protocol: TCP
            name: http
        selector:
          app: notification-controller
      ---
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: flux-hook-cert
        namespace: flux-system
      spec:
        secretName: flux-hook-tls
        dnsNames:
          - ${flux_hook_domain}
        issuerRef:
          name: letsencrypt-http
          kind: ClusterIssuer
      ---
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: flux-receiver
        namespace: flux-system
        annotations:
          kubernetes.io/ingress.class: nginx
      spec:
        ingressClassName: nginx
        tls:
          - hosts:
              - ${flux_hook_domain}
            secretName: flux-hook-tls
        rules:
          - host: ${flux_hook_domain}
            http:
              paths:
                - path: /hook
                  pathType: Prefix
                  backend:
                    service:
                      name: flux-receiver
                      port:
                        number: 80
      EOF

      # Create or patch GitHub webhook automatically if bootstrap PAT is provided
      if [ -n "${github_bootstrap_terra_infra_webhook_pat}" ]; then
        repo_url="${config_repo_url}"
        repo_url_stripped="$${repo_url%.git}"
        repo_name="$${repo_url_stripped##*/}"
        repo_owner="$(printf "%s" "$${repo_url_stripped}" | sed -E 's#https?://[^/]+/([^/]+)/.*#\\1#')"
        webhook_path=""
        for i in $(seq 1 30); do
          webhook_path="$(kubectl -n flux-system get receiver github-receiver -o jsonpath='{.status.webhookPath}' 2>/dev/null || true)"
          [ -n "$webhook_path" ] && break
          sleep 5
        done
        if [ -n "$repo_owner" ] && [ -n "$repo_name" ] && [ -n "$webhook_path" ]; then
          webhook_url="https://${flux_hook_domain}$${webhook_path}"
          api_base="https://api.github.com/repos/$${repo_owner}/$${repo_name}/hooks"
          hooks_json="$(curl -sf -H \"Authorization: Bearer ${github_bootstrap_terra_infra_webhook_pat}\" -H \"Accept: application/vnd.github+json\" \"$${api_base}\" 2>/dev/null || echo \"[]\")"
          hook_id="$(python3 - <<'PY'\nimport json, os, sys\nhooks=json.loads(os.environ.get('HOOKS','[]'))\nurl=os.environ.get('HOOK_URL')\nfor h in hooks:\n    cfg=h.get('config') or {}\n    if cfg.get('url')==url:\n        print(h.get('id',''))\n        sys.exit(0)\nprint('')\nPY\n)"
          export HOOKS="$${hooks_json}"
          export HOOK_URL="$${webhook_url}"
          payload="$(cat <<JSON\n{\n  \"name\": \"web\",\n  \"active\": true,\n  \"events\": [\"push\",\"ping\"],\n  \"config\": {\n    \"url\": \"$${webhook_url}\",\n    \"content_type\": \"json\",\n    \"insecure_ssl\": \"0\",\n    \"secret\": \"$${webhook_secret}\"\n  }\n}\nJSON\n)"
          if [ -n "$hook_id" ]; then
            curl -sf -X PATCH \"$${api_base}/$${hook_id}\" \\\n              -H \"Authorization: Bearer ${github_bootstrap_terra_infra_webhook_pat}\" \\\n              -H \"Accept: application/vnd.github+json\" \\\n              -d \"$${payload}\" || true\n          else
            curl -sf -X POST \"$${api_base}\" \\\n              -H \"Authorization: Bearer ${github_bootstrap_terra_infra_webhook_pat}\" \\\n              -H \"Accept: application/vnd.github+json\" \\\n              -d \"$${payload}\" || true\n          fi
          unset HOOKS HOOK_URL
        fi
        unset github_bootstrap_terra_infra_webhook_pat
      fi

      kubectl apply -f /root/flux-source.yaml
      kubectl apply -f /root/flux-kustomization.yaml
      kubectl apply -f /root/flux-receiver.yaml

runcmd:
  - curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--disable traefik" sh -
  - echo 'alias k=kubectl' >> /root/.bashrc
  - echo 'export KUBECONFIG=/etc/rancher/k3s/k3s.yaml' >> /root/.bashrc
  - bash /root/bootstrap.sh
