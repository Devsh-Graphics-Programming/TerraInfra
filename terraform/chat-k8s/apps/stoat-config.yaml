apiVersion: v1
kind: ConfigMap
metadata:
  name: stoat-config
  namespace: chat
data:
  Revolt.toml: |
    [hosts]
    app = "https://stoatchat.devsh.eu"
    api = "https://stoatchat.devsh.eu/api"
    events = "wss://stoatchat.devsh.eu/ws"
    autumn = "https://stoatchat.devsh.eu/autumn"
    january = "https://stoatchat.devsh.eu/january"

    [hosts.livekit]
    worldwide = "wss://stoatchat.devsh.eu/livekit"

    [api.registration]
    invite_only = true

    [api.livekit.nodes.worldwide]
    url = "http://livekit:7880"
    lat = 0.0
    lon = 0.0

    [features.limits.new_user]
    video_resolution = [1920, 1080]
    video_aspect_ratio = [0.3, 10]

    [features.limits.default]
    video_resolution = [1920, 1080]
    video_aspect_ratio = [0.3, 10]

