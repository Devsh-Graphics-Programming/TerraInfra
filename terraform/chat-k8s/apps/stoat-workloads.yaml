apiVersion: v1
kind: Service
metadata:
  name: database
  namespace: chat
spec:
  selector:
    app.kubernetes.io/name: database
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: database
  namespace: chat
spec:
  serviceName: database
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: database
    spec:
      enableServiceLinks: false
      containers:
        - name: database
          image: docker.io/mongo
          ports:
            - name: mongodb
              containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          readinessProbe:
            exec:
              command:
                - mongosh
                - localhost:27017/test
                - --quiet
                - --eval
                - db.runCommand("ping").ok
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          hostPath:
            path: /mnt/data/stoat/self-hosted/data/db
            type: DirectoryOrCreate
---
