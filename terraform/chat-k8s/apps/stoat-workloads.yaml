apiVersion: v1
kind: Service
metadata:
  name: livekit
  namespace: chat
spec:
  selector:
    app.kubernetes.io/name: livekit
  ports:
    - name: http
      port: 7880
      targetPort: 7880
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: chat
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app.kubernetes.io/name: livekit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: livekit
    spec:
      enableServiceLinks: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: livekit
          image: ghcr.io/stoatchat/livekit-server:v1.9.13
          args:
            - --config
            - /etc/livekit.yml
          ports:
            - name: http
              containerPort: 7880
            - name: rtc-tcp
              containerPort: 7881
              hostPort: 7881
          volumeMounts:
            - name: livekit-config
              mountPath: /etc/livekit.yml
              subPath: livekit.yml
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: livekit-config
          secret:
            secretName: stoat-secrets
            items:
              - key: livekit.yml
                path: livekit.yml
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: chat
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: chat
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      enableServiceLinks: false
      containers:
        - name: web
          image: ghcr.io/stoatchat/for-web:3a83b8c
          env:
            - name: HOSTNAME
              value: stoatchat.devsh.eu
            - name: REVOLT_PUBLIC_URL
              value: https://stoatchat.devsh.eu
            - name: VITE_API_URL
              value: https://stoatchat.devsh.eu/api
            - name: VITE_WS_URL
              value: wss://stoatchat.devsh.eu/ws
            - name: VITE_MEDIA_URL
              value: https://stoatchat.devsh.eu/autumn
            - name: VITE_PROXY_URL
              value: https://stoatchat.devsh.eu/january
            - name: VITE_CFG_ENABLE_VIDEO
              value: "true"
          ports:
            - name: http
              containerPort: 5000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
