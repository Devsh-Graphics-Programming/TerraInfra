apiVersion: v1
kind: Service
metadata:
  name: rabbit
  namespace: chat
spec:
  selector:
    app.kubernetes.io/name: rabbit
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbit
  namespace: chat
spec:
  serviceName: rabbit
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbit
    spec:
      enableServiceLinks: false
      containers:
        - name: rabbit
          image: docker.io/rabbitmq:4
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: rabbituser
            - name: RABBITMQ_DEFAULT_PASS
              value: rabbitpass
          ports:
            - name: amqp
              containerPort: 5672
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
          readinessProbe:
            tcpSocket:
              port: amqp
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
      volumes:
        - name: data
          hostPath:
            path: /mnt/data/stoat/self-hosted/data/rabbit
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: chat
spec:
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: chat
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
    spec:
      enableServiceLinks: false
      containers:
        - name: minio
          image: docker.io/minio/minio
          args:
            - server
            - /data
          env:
            - name: MINIO_ROOT_USER
              value: minioautumn
            - name: MINIO_ROOT_PASSWORD
              value: minioautumn
            - name: MINIO_DOMAIN
              value: minio
          ports:
            - name: s3
              containerPort: 9000
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: data
          hostPath:
            path: /mnt/data/stoat/self-hosted/data/minio
            type: DirectoryOrCreate
---
apiVersion: batch/v1
kind: Job
metadata:
  name: createbuckets
  namespace: chat
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: createbuckets
          image: docker.io/minio/mc
          command:
            - /bin/sh
            - -c
            - |
              until /usr/bin/mc alias set minio http://minio:9000 minioautumn minioautumn; do
                echo 'Waiting for minio...'
                sleep 2
              done
              /usr/bin/mc mb --ignore-existing minio/revolt-uploads
---
