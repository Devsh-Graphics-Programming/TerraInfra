apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: stoat-cert
  namespace: chat
spec:
  secretName: stoat-tls
  dnsNames:
    - stoatchat.devsh.eu
  issuerRef:
    name: letsencrypt-http
    kind: ClusterIssuer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stoat-routes
  namespace: chat
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - secretName: stoat-tls
      hosts:
        - stoatchat.devsh.eu
  rules:
    - host: stoatchat.devsh.eu
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: stoat-media-gateway
                port:
                  name: http
          - path: /ws(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: events
                port:
                  name: http
          - path: /autumn(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: autumn
                port:
                  name: http
          - path: /january(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: january
                port:
                  name: http
          - path: /gifbox(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: gifbox
                port:
                  name: http
          - path: /livekit(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: livekit
                port:
                  name: http
          - path: /ingress(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: voice-ingress
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stoat-attachments-gateway
  namespace: chat
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /attachments$1$2
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - secretName: stoat-tls
      hosts:
        - stoatchat.devsh.eu
  rules:
    - host: stoatchat.devsh.eu
      http:
        paths:
          - path: /autumn/attachments(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: stoat-media-gateway
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stoat-web
  namespace: chat
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
spec:
  ingressClassName: nginx
  tls:
    - secretName: stoat-tls
      hosts:
        - stoatchat.devsh.eu
  rules:
    - host: stoatchat.devsh.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
