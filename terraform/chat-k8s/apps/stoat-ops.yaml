apiVersion: apps/v1
kind: Deployment
metadata:
  name: stoat-ops
  namespace: chat
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stoat-ops
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stoat-ops
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: ops
          image: docker.io/mongo
          command:
            - /bin/bash
            - -lc
            - sleep infinity
          envFrom:
            - secretRef:
                name: notification-smtp
          env:
            - name: PATH
              value: /opt/stoat-ops:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: MONGO_URL
              value: mongodb://database:27017/revolt
            - name: STOAT_APP_URL
              value: https://stoatchat.devsh.eu
            - name: STOAT_INVITE_TEMPLATE
              value: /opt/stoat-ops/invite-email.txt
            - name: STOAT_INVITE_SUBJECT
              value: StoatChat invite
          volumeMounts:
            - name: stoat-ops-scripts
              mountPath: /opt/stoat-ops
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: stoat-ops-scripts
          configMap:
            name: stoat-ops-scripts
            defaultMode: 0555
