apiVersion: v1
kind: ConfigMap
metadata:
  name: stoat-media-gateway
  namespace: chat
data:
  requirements.txt: |
    pymongo==4.17.0 --hash=sha256:8e97e03fa13327c87e3fdc5656acd01e71817f0c1dc3221cd8f30de136bf4ec3
  media-gateway.py: |
    import http.client
    import os
    import secrets
    import threading
    import time
    import urllib.parse
    from http import cookies
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    from pymongo import MongoClient


    API_UPSTREAM_HOST = os.environ.get("API_UPSTREAM_HOST", "api")
    API_UPSTREAM_PORT = int(os.environ.get("API_UPSTREAM_PORT", "14702"))
    AUTUMN_UPSTREAM_HOST = os.environ.get("AUTUMN_UPSTREAM_HOST", "autumn")
    AUTUMN_UPSTREAM_PORT = int(os.environ.get("AUTUMN_UPSTREAM_PORT", "14704"))
    COOKIE_NAME = os.environ.get("MEDIA_COOKIE_NAME", "stoat_media_session")
    COOKIE_PATHS = [
        path.strip()
        for path in os.environ.get(
            "MEDIA_COOKIE_PATHS",
            f"{os.environ.get('MEDIA_COOKIE_PATH', '/autumn/attachments')},/attachments",
        ).split(",")
        if path.strip()
    ]
    SESSION_TTL_SECONDS = int(os.environ.get("MEDIA_SESSION_TTL_SECONDS", "900"))
    API_SESSION_CACHE_TTL_SECONDS = int(os.environ.get("MEDIA_API_SESSION_CACHE_TTL_SECONDS", "60"))
    SERVER_ADDRESS = os.environ.get("SERVER_ADDRESS", "0.0.0.0")
    SERVER_PORT = int(os.environ.get("SERVER_PORT", "8080"))

    VIEW_CHANNEL = 1 << 20
    READ_MESSAGE_HISTORY = 1 << 21
    DEFAULT_PERMISSION_VIEW_ONLY = VIEW_CHANNEL | READ_MESSAGE_HISTORY
    DEFAULT_PERMISSION = DEFAULT_PERMISSION_VIEW_ONLY | (1 << 22) | (1 << 25) | (1 << 26) | (1 << 27) | (1 << 30) | (1 << 31) | (1 << 36) | (1 << 32)
    DEFAULT_PERMISSION_DIRECT_MESSAGE = DEFAULT_PERMISSION | (1 << 0) | (1 << 29) | (1 << 28)
    DEFAULT_PERMISSION_SAVED_MESSAGES = 0x000F_FFFF_FFFF_FFFF
    GRANT_ALL_SAFE = 0x000F_FFFF_FFFF_FFFF

    HOP_BY_HOP_HEADERS = {
        "connection",
        "keep-alive",
        "proxy-authenticate",
        "proxy-authorization",
        "te",
        "trailers",
        "transfer-encoding",
        "upgrade",
    }

    client = MongoClient(
        os.environ.get("MONGO_URL", "mongodb://database:27017/revolt"),
        serverSelectionTimeoutMS=2000,
        connectTimeoutMS=2000,
    )
    db = client.get_database()
    api_session_cache = {}
    api_session_cache_lock = threading.Lock()
    media_sessions = {}
    media_sessions_lock = threading.Lock()


    def now() -> int:
        return int(time.time())


    def cleanup_sessions() -> None:
        cutoff = now()
        with api_session_cache_lock:
            expired_api_sessions = [
                token for token, session in api_session_cache.items() if session["expires"] <= cutoff
            ]
            for token in expired_api_sessions:
                api_session_cache.pop(token, None)
        with media_sessions_lock:
            expired = [token for token, session in media_sessions.items() if session["expires"] <= cutoff]
            for token in expired:
                media_sessions.pop(token, None)


    def request_token(headers) -> str | None:
        return headers.get("X-Session-Token") or headers.get("x-session-token")


    def validate_api_session(token: str | None) -> dict | None:
        if not token:
            return None
        cutoff = now()
        with api_session_cache_lock:
            cached = api_session_cache.get(token)
            if cached and cached["expires"] > cutoff:
                return cached["session"]
            if cached:
                api_session_cache.pop(token, None)
        try:
            session = db.sessions.find_one({"token": token}, {"_id": 1, "user_id": 1})
        except Exception:
            return None
        if session:
            with api_session_cache_lock:
                api_session_cache[token] = {
                    "session": session,
                    "expires": cutoff + API_SESSION_CACHE_TTL_SECONDS,
                }
        return session


    def mint_media_cookies(headers) -> list[str]:
        session = validate_api_session(request_token(headers))
        if not session:
            return []

        cleanup_sessions()
        media_token = secrets.token_urlsafe(32)
        with media_sessions_lock:
            media_sessions[media_token] = {
                "session_id": session["_id"],
                "user_id": session["user_id"],
                "expires": now() + SESSION_TTL_SECONDS,
            }

        cookie_headers = []
        for cookie_path in COOKIE_PATHS:
            morsel = cookies.SimpleCookie()
            morsel[COOKIE_NAME] = media_token
            morsel[COOKIE_NAME]["httponly"] = True
            morsel[COOKIE_NAME]["secure"] = True
            morsel[COOKIE_NAME]["samesite"] = "Lax"
            morsel[COOKIE_NAME]["path"] = cookie_path
            morsel[COOKIE_NAME]["max-age"] = str(SESSION_TTL_SECONDS)
            cookie_headers.append(morsel.output(header="").strip())
        return cookie_headers


    def session_from_cookie(cookie_header: str | None) -> dict | None:
        if not cookie_header:
            return None
        jar = cookies.SimpleCookie()
        try:
            jar.load(cookie_header)
        except cookies.CookieError:
            return None

        if COOKIE_NAME not in jar:
            return None

        media_token = jar[COOKIE_NAME].value
        with media_sessions_lock:
            session = media_sessions.get(media_token)
        if not session or session["expires"] <= now():
            with media_sessions_lock:
                media_sessions.pop(media_token, None)
            return None

        try:
            exists = db.sessions.find_one(
                {"_id": session["session_id"], "user_id": session["user_id"]},
                {"_id": 1},
            )
        except Exception:
            return None

        if not exists:
            with media_sessions_lock:
                media_sessions.pop(media_token, None)
            return None
        return session


    def as_int(value, default=0) -> int:
        try:
            return int(value)
        except (TypeError, ValueError):
            return default


    def override_to_pair(value) -> tuple[int, int]:
        if isinstance(value, dict):
            return as_int(value.get("a")), as_int(value.get("d"))
        return 0, 0


    def apply_override(permissions: int, value) -> int:
        allow, deny = override_to_pair(value)
        permissions |= allow
        permissions &= ~deny
        return permissions


    def is_timed_out(member: dict) -> bool:
        timeout = member.get("timeout")
        if not timeout:
            return False
        if isinstance(timeout, str):
            return timeout > time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
        return False


    def ordered_role_ids(server: dict, member: dict) -> list[str]:
        member_roles = set(member.get("roles") or [])
        roles = server.get("roles") or {}
        ranked = []
        for role_id in member_roles:
            role = roles.get(role_id)
            if role:
                ranked.append((as_int(role.get("rank")), role_id))
        ranked.sort(key=lambda entry: entry[0], reverse=True)
        return [role_id for _, role_id in ranked]


    def server_permissions(user: dict, server: dict, member: dict) -> int:
        if user.get("privileged") or server.get("owner") == user.get("_id"):
            return GRANT_ALL_SAFE

        permissions = as_int(server.get("default_permissions"))
        roles = server.get("roles") or {}
        for role_id in ordered_role_ids(server, member):
            permissions = apply_override(permissions, (roles.get(role_id) or {}).get("permissions"))

        if is_timed_out(member):
            permissions &= DEFAULT_PERMISSION_VIEW_ONLY
        return permissions


    def channel_permissions(user: dict, channel: dict, server: dict | None, member: dict | None) -> int:
        channel_type = channel.get("channel_type")
        user_id = user.get("_id")

        if user.get("privileged"):
            return GRANT_ALL_SAFE

        if channel_type == "SavedMessages":
            return DEFAULT_PERMISSION_SAVED_MESSAGES if channel.get("user") == user_id else 0

        if channel_type == "DirectMessage":
            return DEFAULT_PERMISSION_DIRECT_MESSAGE if user_id in (channel.get("recipients") or []) else 0

        if channel_type == "Group":
            if channel.get("owner") == user_id:
                return GRANT_ALL_SAFE
            if user_id in (channel.get("recipients") or []):
                return DEFAULT_PERMISSION_VIEW_ONLY | as_int(channel.get("permissions"), DEFAULT_PERMISSION_DIRECT_MESSAGE)
            return 0

        if channel_type != "TextChannel" or not server or not member:
            return 0

        if server.get("owner") == user_id:
            return GRANT_ALL_SAFE

        permissions = server_permissions(user, server, member)
        permissions = apply_override(permissions, channel.get("default_permissions"))

        roles = server.get("roles") or {}
        role_permissions = channel.get("role_permissions") or {}
        for role_id in ordered_role_ids(server, member):
            if role_id in roles and role_id in role_permissions:
                permissions = apply_override(permissions, role_permissions.get(role_id))

        if is_timed_out(member):
            permissions &= DEFAULT_PERMISSION_VIEW_ONLY

        if (permissions & VIEW_CHANNEL) != VIEW_CHANNEL:
            return 0
        return permissions


    def can_access_attachment(user_id: str, file_id: str) -> bool:
        try:
            user = db.users.find_one({"_id": user_id}, {"_id": 1, "privileged": 1})
            attachment = db.attachments.find_one(
                {"_id": file_id, "tag": "attachments"},
                {"_id": 1, "used_for": 1, "deleted": 1},
            )
            if not user or not attachment or attachment.get("deleted"):
                return False

            used_for = attachment.get("used_for") or {}
            if used_for.get("type") != "Message" or not used_for.get("id"):
                return False

            message = db.messages.find_one({"_id": used_for["id"]}, {"_id": 1, "channel": 1})
            if not message or not message.get("channel"):
                return False

            channel = db.channels.find_one({"_id": message["channel"]})
            if not channel:
                return False

            server = None
            member = None
            if channel.get("channel_type") == "TextChannel":
                server_id = channel.get("server")
                if not server_id:
                    return False
                server = db.servers.find_one({"_id": server_id})
                member = db.server_members.find_one({"_id.server": server_id, "_id.user": user_id})
                if not server or not member:
                    return False

            permissions = channel_permissions(user, channel, server, member)
            return (permissions & DEFAULT_PERMISSION_VIEW_ONLY) == DEFAULT_PERMISSION_VIEW_ONLY
        except Exception:
            return False


    def attachment_id_from_path(path: str) -> str | None:
        parsed = urllib.parse.urlsplit(path)
        parts = [part for part in parsed.path.split("/") if part]
        if len(parts) < 2 or parts[0] != "attachments":
            return None
        return parts[1]


    def filtered_request_headers(headers) -> dict:
        result = {}
        for key, value in headers.items():
            lowered = key.lower()
            if lowered in HOP_BY_HOP_HEADERS or lowered == "host":
                continue
            result[key] = value
        return result


    def filtered_response_headers(headers, attachment=False):
        for key, value in headers:
            lowered = key.lower()
            if lowered in HOP_BY_HOP_HEADERS:
                continue
            if attachment and lowered == "set-cookie":
                continue
            if attachment and lowered == "cache-control":
                continue
            yield key, value


    class Handler(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"

        def log_message(self, fmt, *args):
            path = urllib.parse.urlsplit(self.path).path
            if path == "/healthz":
                return
            if path.startswith("/attachments"):
                path = "/attachments"
            else:
                path = "/api"
            print("%s %s" % (self.command, path), flush=True)

        def do_GET(self):
            self.route()

        def do_HEAD(self):
            self.route()

        def do_POST(self):
            self.route()

        def do_PUT(self):
            self.route()

        def do_PATCH(self):
            self.route()

        def do_DELETE(self):
            self.route()

        def do_OPTIONS(self):
            self.route()

        def route(self):
            if urllib.parse.urlsplit(self.path).path == "/healthz":
                self.respond_text(200, "ok\n")
                return

            if urllib.parse.urlsplit(self.path).path.startswith("/attachments/"):
                self.handle_attachment()
                return

            if urllib.parse.urlsplit(self.path).path == "/attachments":
                self.proxy(
                    AUTUMN_UPSTREAM_HOST,
                    AUTUMN_UPSTREAM_PORT,
                    media_cookies=mint_media_cookies(self.headers),
                    attachment=True,
                )
                return

            self.proxy(API_UPSTREAM_HOST, API_UPSTREAM_PORT, media_cookies=mint_media_cookies(self.headers))

        def handle_attachment(self):
            if self.command not in {"GET", "HEAD"}:
                self.proxy(
                    AUTUMN_UPSTREAM_HOST,
                    AUTUMN_UPSTREAM_PORT,
                    media_cookies=mint_media_cookies(self.headers),
                    attachment=True,
                )
                return

            session = session_from_cookie(self.headers.get("Cookie"))
            file_id = attachment_id_from_path(self.path)
            if not session or not file_id or not can_access_attachment(session["user_id"], file_id):
                self.respond_text(404, "not found\n")
                return

            self.proxy(AUTUMN_UPSTREAM_HOST, AUTUMN_UPSTREAM_PORT, attachment=True)

        def proxy(self, host: str, port: int, media_cookies: list[str] | None = None, attachment: bool = False):
            body = None
            content_length = self.headers.get("Content-Length")
            if content_length:
                body = self.rfile.read(int(content_length))

            conn = http.client.HTTPConnection(host, port, timeout=30)
            try:
                conn.request(self.command, self.path, body=body, headers=filtered_request_headers(self.headers))
                response = conn.getresponse()
                self.send_response(response.status)
                for key, value in filtered_response_headers(response.getheaders(), attachment=attachment):
                    self.send_header(key, value)
                for media_cookie in media_cookies or []:
                    self.send_header("Set-Cookie", media_cookie)
                self.send_header("Connection", "close")
                self.close_connection = True
                if attachment:
                    self.send_header("Cache-Control", "private, no-store")
                    self.send_header("X-Content-Type-Options", "nosniff")
                self.end_headers()

                if self.command != "HEAD":
                    while True:
                        chunk = response.read(64 * 1024)
                        if not chunk:
                            break
                        self.wfile.write(chunk)
            except (BrokenPipeError, ConnectionResetError):
                return
            except Exception:
                try:
                    self.respond_text(502, "bad gateway\n")
                except (BrokenPipeError, ConnectionResetError):
                    return
            finally:
                conn.close()

        def respond_text(self, status: int, body: str):
            payload = body.encode("utf-8")
            self.send_response(status)
            self.send_header("Content-Type", "text/plain; charset=utf-8")
            self.send_header("Content-Length", str(len(payload)))
            self.send_header("Cache-Control", "no-store")
            self.send_header("Connection", "close")
            self.close_connection = True
            self.end_headers()
            if self.command != "HEAD":
                self.wfile.write(payload)


    if __name__ == "__main__":
        client.admin.command("ping")
        ThreadingHTTPServer((SERVER_ADDRESS, SERVER_PORT), Handler).serve_forever()
---
apiVersion: v1
kind: Service
metadata:
  name: stoat-media-gateway
  namespace: chat
spec:
  selector:
    app.kubernetes.io/name: stoat-media-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stoat-media-gateway
  namespace: chat
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stoat-media-gateway
  template:
    metadata:
      annotations:
        devsh.eu/config-revision: stoat-media-gateway-20260514-01
      labels:
        app.kubernetes.io/name: stoat-media-gateway
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: install-deps
          image: docker.io/python:3.12-slim
          command:
            - /bin/sh
            - -ec
            - |
              python -m pip install --no-deps --require-hashes --disable-pip-version-check --no-cache-dir --target /deps -r /opt/stoat-media/requirements.txt
              chown -R 65532:65532 /deps
          volumeMounts:
            - name: config
              mountPath: /opt/stoat-media
              readOnly: true
            - name: deps
              mountPath: /deps
          securityContext:
            allowPrivilegeEscalation: false
      containers:
        - name: gateway
          image: docker.io/python:3.12-slim
          command:
            - python
            - /opt/stoat-media/media-gateway.py
          env:
            - name: PYTHONPATH
              value: /deps
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: MONGO_URL
              value: mongodb://database:27017/revolt
            - name: MEDIA_SESSION_TTL_SECONDS
              value: "900"
            - name: MEDIA_API_SESSION_CACHE_TTL_SECONDS
              value: "60"
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /opt/stoat-media
              readOnly: true
            - name: deps
              mountPath: /deps
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
      volumes:
        - name: config
          configMap:
            name: stoat-media-gateway
            defaultMode: 0444
        - name: deps
          emptyDir: {}
        - name: tmp
          emptyDir: {}
