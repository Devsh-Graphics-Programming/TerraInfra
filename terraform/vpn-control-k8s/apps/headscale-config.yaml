apiVersion: v1
kind: ConfigMap
metadata:
  name: headscale-config
  namespace: vpn-system
data:
  config.yaml: |
    server_url: https://headscale.devsh.eu
    listen_addr: 0.0.0.0:8080
    metrics_listen_addr: 0.0.0.0:9090
    grpc_listen_addr: 127.0.0.1:50443
    grpc_allow_insecure: false

    noise:
      private_key_path: /var/lib/headscale/noise_private.key

    prefixes:
      v4: 100.64.0.0/10
      v6: fd7a:115c:a1e0::/48
      allocation: sequential

    derp:
      server:
        enabled: true
        region_id: 901
        region_code: devsh
        region_name: DevSH VPN
        verify_clients: true
        stun_listen_addr: "0.0.0.0:3478"
        private_key_path: /var/lib/headscale/derp_server_private.key
        automatically_add_embedded_derp_region: true
      urls: []
      paths: []
      auto_update_enabled: false
      update_frequency: 3h

    disable_check_updates: true
    ephemeral_node_inactivity_timeout: 30m

    database:
      type: sqlite
      debug: false
      gorm:
        prepare_stmt: true
        parameterized_queries: true
        skip_err_record_not_found: true
        slow_threshold: 1000
      sqlite:
        path: /var/lib/headscale/db.sqlite
        write_ahead_log: true
        wal_autocheckpoint: 1000

    policy:
      mode: file
      path: /etc/headscale/acl.hujson

    dns:
      magic_dns: true
      base_domain: vpn.devsh.eu
      override_local_dns: true
      nameservers:
        global:
          - 1.1.1.1
          - 1.0.0.1
      search_domains: []
      extra_records: []

    unix_socket: /var/run/headscale/headscale.sock
    unix_socket_permission: "0770"

    oidc:
      only_start_if_oidc_is_available: true
      issuer: https://auth.devsh.eu/application/o/headscale/
      client_id: headscale
      client_secret_path: /run/secrets/headscale-oidc/client_secret
      expiry: 180d
      use_expiry_from_token: false
      scope: ["openid", "profile", "email", "groups"]
      email_verified_required: false
      allowed_groups:
        - /vpn-users
      pkce:
        enabled: true
        method: S256

    logtail:
      enabled: false

    randomize_client_port: false

    taildrop:
      enabled: true
  acl.hujson: |
    {
      "acls": [
        {
          "action": "accept",
          "src": ["*"],
          "dst": ["*:*"]
        }
      ]
    }

