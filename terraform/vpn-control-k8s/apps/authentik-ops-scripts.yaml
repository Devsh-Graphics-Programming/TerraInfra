  vpn_invite.py: |
    import json
    import os
    import re
    import sys
    from datetime import timedelta
    from pathlib import Path

    from django.conf import settings
    from django.core.mail import EmailMultiAlternatives
    from django.db import transaction
    from django.utils.timezone import now

    from authentik.core.models import Group, User
    from authentik.flows.models import Flow
    from authentik.stages.invitation.models import Invitation


    EMAIL = os.environ.get("VPN_INVITE_EMAIL", "").strip().lower()
    PROFILE = os.environ.get("VPN_INVITE_PROFILE", "member").strip()
    TTL_RAW = os.environ.get("VPN_INVITE_TTL", "24h").strip()
    DRY_RUN = os.environ.get("VPN_INVITE_DRY_RUN", "false").strip().lower() in {"1", "true", "yes"}
    PUBLIC_URL = os.environ.get("AUTHENTIK_PUBLIC_URL", "https://auth.devsh.eu").rstrip("/")
    SUBJECT = os.environ.get("VPN_INVITE_SUBJECT", "DevSH VPN access invite")
    TEXT_TEMPLATE = Path(os.environ.get("VPN_INVITE_TEXT_TEMPLATE", "/opt/authentik-ops/invite-email.txt"))
    HTML_TEMPLATE = Path(os.environ.get("VPN_INVITE_HTML_TEMPLATE", "/opt/authentik-ops/invite-email.html"))

    DEFAULT_PROFILES = {
        "member": {
            "flow": "devsh-vpn-enrollment",
            "groups": ["vpn-users"],
        },
        "admin": {
            "flow": "devsh-vpn-admin-enrollment",
            "groups": ["vpn-users", "authentik Admins"],
        },
    }
    PROFILES = json.loads(os.environ.get("VPN_INVITE_PROFILES", json.dumps(DEFAULT_PROFILES)))


    def die(message: str, code: int = 1) -> None:
        print(f"error: {message}", file=sys.stderr)
        raise SystemExit(code)


    def parse_ttl(value: str) -> tuple[timedelta, str]:
        match = re.fullmatch(r"([1-9][0-9]*)([mhd])", value)
        if not match:
            die("ttl must use m, h, or d suffix, for example 30m, 24h, or 7d")
        amount = int(match.group(1))
        unit = match.group(2)
        if unit == "m":
            delta = timedelta(minutes=amount)
            label = f"{amount} minute{'s' if amount != 1 else ''}"
        elif unit == "h":
            delta = timedelta(hours=amount)
            label = f"{amount} hour{'s' if amount != 1 else ''}"
        else:
            delta = timedelta(days=amount)
            label = f"{amount} day{'s' if amount != 1 else ''}"
        if delta < timedelta(minutes=5) or delta > timedelta(days=14):
            die("ttl must be between 5 minutes and 14 days")
        return delta, label


    def render_template(path: Path, values: dict[str, str]) -> str:
        text = path.read_text(encoding="utf-8")
        for key, value in values.items():
            text = text.replace("{{" + key + "}}", value)
        return text


    def username_from_email(email: str) -> str:
        local, domain = email.split("@", 1)
        candidate = re.sub(r"[^a-z0-9._-]+", "-", local.lower()).strip(".-_")
        if candidate:
            return candidate[:150]
        fallback = re.sub(r"[^a-z0-9._-]+", "-", f"{local}-{domain}".lower()).strip(".-_")
        return (fallback or "user")[:150]


    def ensure_group(name: str) -> Group:
        defaults = {}
        if name == "authentik Admins":
            defaults["is_superuser"] = True
        group, _ = Group.objects.update_or_create(name=name, defaults=defaults)
        return group


    if not re.fullmatch(r"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}", EMAIL):
        die("invalid email address")

    if PROFILE not in PROFILES:
        die(f"unknown profile '{PROFILE}', allowed profiles: {', '.join(sorted(PROFILES))}")

    profile_config = PROFILES[PROFILE]
    if not isinstance(profile_config, dict):
        die(f"profile '{PROFILE}' has invalid mapping")

    groups = profile_config.get("groups", [])
    if not isinstance(groups, list) or not all(isinstance(group, str) and group for group in groups):
        die(f"profile '{PROFILE}' has invalid group mapping")

    flow_slug = profile_config.get("flow")
    if not isinstance(flow_slug, str) or not flow_slug:
        die(f"profile '{PROFILE}' has invalid enrollment flow mapping")

    ttl_delta, ttl_label = parse_ttl(TTL_RAW)
    expiry = now() + ttl_delta
    username = username_from_email(EMAIL)
    display_name = EMAIL.split("@", 1)[0].replace(".", " ").replace("_", " ").title()
    if DRY_RUN:
        print(f"Dry run OK for {EMAIL} with profile {PROFILE}; no invitation or email was created.")
        raise SystemExit(0)

    with transaction.atomic():
        if User.objects.filter(email__iexact=EMAIL).exists():
            die("a user with this email already exists; reset or remove that user before sending a new enrollment invite")

        base_username = username
        suffix = 2
        while User.objects.filter(username=username).exists():
            username = f"{base_username}-{suffix}"[:150]
            suffix += 1

        flow = Flow.objects.filter(slug=flow_slug).first()
        if flow is None:
            die(f"enrollment flow '{flow_slug}' is not installed")

        creator = (
            User.objects.filter(groups__name="authentik Admins")
            .order_by("date_joined")
            .first()
            or User.objects.order_by("date_joined").first()
        )
        if creator is None:
            die("no Authentik user exists to own the invitation")

        for group_name in groups:
            ensure_group(group_name)

        invitation = Invitation.objects.create(
            name=f"vpn-{PROFILE}-{username}-{now().strftime('%Y%m%d%H%M%S')}",
            flow=flow,
            single_use=True,
            created_by=creator,
            expiring=True,
            expires=expiry,
            fixed_data={
                "username": username,
                "email": EMAIL,
                "name": display_name,
            },
        )
        invite_url = f"{PUBLIC_URL}/if/flow/{flow.slug}/?{'i' + 'token'}={invitation.invite_uuid}"
        values = {
            "email": EMAIL,
            "invite_url": invite_url,
            "ttl": ttl_label,
            "profile": PROFILE,
            "username": username,
        }
        text_body = render_template(TEXT_TEMPLATE, values)
        html_body = render_template(HTML_TEMPLATE, values) if HTML_TEMPLATE.exists() else None

        from_email = getattr(settings, "DEFAULT_FROM_EMAIL", None) or os.environ.get("AUTHENTIK_EMAIL__FROM")
        if not from_email:
            die("mail sender is not configured")

        message = EmailMultiAlternatives(
            subject=SUBJECT,
            body=text_body,
            from_email=from_email,
            to=[EMAIL],
        )
        if html_body:
            message.attach_alternative(html_body, "text/html")

        sent = message.send(fail_silently=False)
        if sent != 1:
            die("email backend did not accept the invite message")

    print(f"Invite email sent to {EMAIL} with profile {PROFILE}; expires in {ttl_label}.")
  vpn_password_reset.py: |
