    from authentik.stages.email.flow import pickle_flow_token_for_email


    EMAIL = os.environ.get("VPN_PASSWORD_RESET_EMAIL", "").strip().lower()
    TTL_RAW = os.environ.get("VPN_PASSWORD_RESET_TTL", "1h").strip()
    DRY_RUN = os.environ.get("VPN_PASSWORD_RESET_DRY_RUN", "false").strip().lower() in {"1", "true", "yes"}
    PUBLIC_URL = os.environ.get("AUTHENTIK_PUBLIC_URL", "https://auth.devsh.eu").rstrip("/")
    SUBJECT = os.environ.get("VPN_PASSWORD_RESET_SUBJECT", "DevSH VPN password reset")
    TEXT_TEMPLATE = Path(os.environ.get("VPN_PASSWORD_RESET_TEXT_TEMPLATE", "/opt/authentik-ops/password-reset-email.txt"))
    HTML_TEMPLATE = Path(os.environ.get("VPN_PASSWORD_RESET_HTML_TEMPLATE", "/opt/authentik-ops/password-reset-email.html"))
    FLOW_SLUG = os.environ.get("VPN_PASSWORD_RESET_FLOW", "devsh-vpn-password-reset")
    REQUIRED_STAGE_NAMES = [
        "devsh-vpn-password-reset-identification",
        "devsh-vpn-password-reset-email",
        "devsh-vpn-password-reset-prompt",
        "devsh-vpn-password-reset-write",
        "devsh-vpn-user-login",
    ]


    def die(message: str, code: int = 1) -> None:
        print(f"error: {message}", file=sys.stderr)
        raise SystemExit(code)


    def parse_ttl(value: str) -> tuple[timedelta, str]:
        match = re.fullmatch(r"([1-9][0-9]*)([mh])", value)
        if not match:
            die("ttl must use m or h suffix, for example 30m or 1h")
        amount = int(match.group(1))
        unit = match.group(2)
        if unit == "m":
            delta = timedelta(minutes=amount)
            label = f"{amount} minute{'s' if amount != 1 else ''}"
        else:
            delta = timedelta(hours=amount)
            label = f"{amount} hour{'s' if amount != 1 else ''}"
        if delta < timedelta(minutes=5) or delta > timedelta(hours=24):
            die("ttl must be between 5 minutes and 24 hours")
        return delta, label


    def render_template(path: Path, values: dict[str, str]) -> str:
        text = path.read_text(encoding="utf-8")
        for key, value in values.items():
            text = text.replace("{{" + key + "}}", value)
        return text


    if not re.fullmatch(r"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}", EMAIL):
        die("invalid email address")

    ttl_delta, ttl_label = parse_ttl(TTL_RAW)
    user = User.objects.filter(email__iexact=EMAIL).first()
    if user is None:
        die("no Authentik user exists with this email")
    if not user.is_active:
        die("user exists but is inactive")

    flow = Flow.objects.filter(slug=FLOW_SLUG).first()
    if flow is None:
        die(f"password reset flow '{FLOW_SLUG}' is not installed")

    request = RequestFactory().get("/")
    request.user = AnonymousUser()
    planner = FlowPlanner(flow)
    planner.allow_empty_flows = True
    plan = planner.plan(request, {PLAN_CONTEXT_PENDING_USER: user})

    planned_stage_names = [str(binding.stage.name) for binding in plan.bindings]
    missing_stage_names = [name for name in REQUIRED_STAGE_NAMES if name not in planned_stage_names]
    if missing_stage_names:
        die(f"password reset flow is missing stages: {', '.join(missing_stage_names)}")

    if DRY_RUN:
        print(f"Dry run OK for {EMAIL}; password reset flow is installed and no email was created.")
        raise SystemExit(0)

    reset_flow_entry = FlowToken.objects.create(
        expires=now() + ttl_delta,
        user=user,
        identifier=slugify(f"ak-vpn-password-reset-{user.username}-{uuid4()}"),
        flow=flow,
        _plan=pickle_flow_token_for_email(plan),
        revoke_on_execution=False,
    )
    query_key = "flow" + "_" + "token"
    reset_url = f"{PUBLIC_URL}/if/flow/{flow.slug}/?{query_key}={reset_flow_entry.key}"
    values = {
        "email": EMAIL,
        "username": user.username,
        "reset_url": reset_url,
        "ttl": ttl_label,
    }
    text_body = render_template(TEXT_TEMPLATE, values)
    html_body = render_template(HTML_TEMPLATE, values) if HTML_TEMPLATE.exists() else None

    from_email = getattr(settings, "DEFAULT_FROM_EMAIL", None) or os.environ.get("AUTHENTIK_EMAIL__FROM")
    if not from_email:
        reset_flow_entry.delete()
        die("mail sender is not configured")

    message = EmailMultiAlternatives(
        subject=SUBJECT,
        body=text_body,
        from_email=from_email,
        to=[EMAIL],
    )
    if html_body:
        message.attach_alternative(html_body, "text/html")

    try:
        sent = message.send(fail_silently=False)
    except Exception:
        reset_flow_entry.delete()
        raise

    if sent != 1:
        reset_flow_entry.delete()
        die("email backend did not accept the password reset message")

    print(f"Password reset email sent to {EMAIL}; expires in {ttl_label}.")
