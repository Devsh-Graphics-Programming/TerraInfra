apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-headscale-blueprint
  namespace: authentik
data:
  headscale.yaml: |
    version: 1
    metadata:
      name: devsh-headscale
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_core.group
        identifiers:
          name: vpn-users
        state: present
        attrs:
          name: vpn-users

      - model: authentik_providers_oauth2.scopemapping
        id: headscale-groups-scope
        identifiers:
          scope_name: groups
        state: present
        attrs:
          name: Headscale groups
          scope_name: groups
          description: Groups allowed to authenticate to Headscale
          expression: |
            return {
                "groups": ["/" + group.name for group in request.user.groups.all()]
            }

      - model: authentik_providers_oauth2.oauth2provider
        id: headscale-provider
        identifiers:
          name: headscale
        state: present
        attrs:
          name: headscale
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: headscale
          client_secret: !Env HEADSCALE_OIDC_CLIENT_SECRET
          access_code_validity: minutes=10
          access_token_validity: minutes=5
          refresh_token_validity: days=30
          include_claims_in_id_token: true
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !KeyOf headscale-groups-scope
          redirect_uris:
            - url: https://headscale.devsh.eu/oidc/callback
              matching_mode: strict

      - model: authentik_core.application
        identifiers:
          slug: headscale
        state: present
        attrs:
          name: Headscale
          slug: headscale
          provider: !KeyOf headscale-provider
          policy_engine_mode: any

