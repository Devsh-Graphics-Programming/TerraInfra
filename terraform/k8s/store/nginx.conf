worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  proxy_temp_path /tmp/proxy_temp;
  client_body_temp_path /tmp/client_temp;

  server {
    listen 8080;
    server_name _;
    absolute_redirect off;

    add_header X-Store-Cache $upstream_cache_status always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-store always;

    location = /healthz {
      access_log off;
      return 200 "ok\n";
    }

    location = /ditt/public {
      return 302 /ditt/public/;
    }

    location = /ditt/dummy {
      return 302 /ditt/dummy/;
    }

    location = /ditt/private {
      return 302 /ditt/private/;
    }

    location /ditt/public/ {
      rewrite ^(.*/)$ $1index.html break;
      proxy_pass https://devsh-store-prod.s3.fr-par.scw.cloud;
      proxy_set_header Host devsh-store-prod.s3.fr-par.scw.cloud;
      proxy_set_header Authorization "";
      proxy_ssl_server_name on;
      proxy_http_version 1.1;
    }

    location /ditt/dummy/ {
      rewrite ^(.*/)$ $1index.html break;
      proxy_pass https://devsh-store-prod.s3.fr-par.scw.cloud;
      proxy_set_header Host devsh-store-prod.s3.fr-par.scw.cloud;
      proxy_set_header Authorization "";
      proxy_ssl_server_name on;
      proxy_http_version 1.1;
    }

    location /ditt/private/ {
      auth_basic "DevSH private store";
      auth_basic_user_file /etc/nginx/auth/htpasswd;
      rewrite ^(.*/)$ $1index.html break;
      proxy_pass https://devsh-store-prod.s3.fr-par.scw.cloud;
      proxy_set_header Host devsh-store-prod.s3.fr-par.scw.cloud;
      proxy_set_header Authorization "";
      proxy_ssl_server_name on;
      proxy_http_version 1.1;
    }
  }
}
