apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: oncall-cert
  namespace: monitoring-oncall
spec:
  secretName: oncall-tls
  dnsNames:
    - ${ENV_PREFIX}oncall.${BASE_DOMAIN}
  issuerRef:
    name: letsencrypt-http
    kind: ClusterIssuer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: oncall-grafana-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: oncall-grafana-local
  local:
    path: /mnt/data/oncall-grafana
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - devsh-k3s-prod-node-1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oncall-grafana-pvc
  namespace: monitoring-oncall
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: oncall-grafana-local
  volumeName: oncall-grafana-pv
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: oncall
  namespace: monitoring-oncall
spec:
  interval: 10m
  chart:
    spec:
      chart: oncall
      version: 1.16.5
      sourceRef:
        kind: HelmRepository
        name: grafana-charts
        namespace: flux-system
      interval: 1h
  releaseName: oncall
  targetNamespace: monitoring-oncall
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
    force: true
  values:
    image:
      tag: v1.16.5
    env:
      DANGEROUS_WEBHOOKS_ENABLED: '"true"'
      MIRAGE_CIPHER_MODE: ECB
      MIRAGE_CIPHER_IV: 1234567890abcdef
    base_url: ${ENV_PREFIX}oncall.${BASE_DOMAIN}
    base_url_protocol: https
    ingress:
      enabled: true
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-http
      tls:
        - hosts:
            - ${ENV_PREFIX}oncall.${BASE_DOMAIN}
          secretName: oncall-tls
    service:
      enabled: false
    ingress-nginx:
      enabled: false
    cert-manager:
      enabled: false
    mariadb:
      enabled: false
    database:
      type: postgresql
    broker:
      type: redis
    migrate:
      ttlSecondsAfterFinished: ""
    postgresql:
      enabled: true
      image:
        tag: latest
      auth:
        existingSecret: oncall-postgresql
        secretKeys:
          adminPasswordKey: postgres-password
          userPasswordKey: password
          replicationPasswordKey: replication-password
        username: oncall
        database: oncall
      primary:
        persistence:
          enabled: true
          size: 10Gi
    redis:
      enabled: true
      architecture: standalone
      image:
        tag: latest
      auth:
        existingSecret: oncall-redis
        existingSecretPasswordKey: redis-password
    rabbitmq:
      enabled: false
    grafana:
      enabled: true
      admin:
        existingSecret: monitoring-oncall-grafana
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: true
        existingClaim: oncall-grafana-pvc
      grafana.ini:
        server:
          domain: ${ENV_PREFIX}oncall.${BASE_DOMAIN}
          root_url: "%(protocol)s://%(domain)s/grafana/"
          serve_from_sub_path: true
        feature_toggles:
          enable: externalServiceAccounts
          accessControlOnCall: false
      rbac:
        pspEnabled: false
    oncall:
      secrets:
        existingSecret: oncall-secrets
        secretKey: SECRET_KEY
        mirageSecretKey: MIRAGE_SECRET_KEY
      smtp:
        enabled: false
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: oncall-engine
              namespace: monitoring-oncall
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: oncall-engine
              spec:
                template:
                  spec:
                    containers:
                      - name: oncall
                        startupProbe:
                          httpGet:
                            path: /startupprobe/
                            port: http
                          initialDelaySeconds: 5
                          periodSeconds: 10
                          timeoutSeconds: 10
                          failureThreshold: 18
                        readinessProbe:
                          httpGet:
                            path: /ready/
                            port: http
                          timeoutSeconds: 10
                        livenessProbe:
                          httpGet:
                            path: /health/
                            port: http
                          timeoutSeconds: 10
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oncall-bootstrap
  namespace: monitoring-oncall
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oncall-bootstrap-read-secrets
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - alertmanager-discord
      - alertmanager-oncall
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oncall-bootstrap-read-secrets
  namespace: monitoring
subjects:
  - kind: ServiceAccount
    name: oncall-bootstrap
    namespace: monitoring-oncall
roleRef:
  kind: Role
  name: oncall-bootstrap-read-secrets
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: oncall-bootstrap
  namespace: monitoring-oncall
spec:
  backoffLimit: 3
  template:
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: oncall-bootstrap
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: grafana/oncall:v1.16.5
          imagePullPolicy: IfNotPresent
          env:
            - name: BASE_URL
              value: https://${ENV_PREFIX}oncall.${BASE_DOMAIN}
            - name: DATABASE_TYPE
              value: postgresql
            - name: DATABASE_HOST
              value: oncall-postgresql.monitoring-oncall.svc
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_NAME
              value: oncall
            - name: DATABASE_USER
              value: oncall
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oncall-postgresql
                  key: password
            - name: REDIS_HOST
              value: oncall-redis-master.monitoring-oncall.svc
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_DATABASE
              value: "0"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oncall-redis
                  key: redis-password
            - name: BROKER_TYPE
              value: redis
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: oncall-secrets
                  key: SECRET_KEY
            - name: MIRAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: oncall-secrets
                  key: MIRAGE_SECRET_KEY
            - name: DANGEROUS_WEBHOOKS_ENABLED
              value: "true"
            - name: MIRAGE_CIPHER_MODE
              value: ECB
            - name: MIRAGE_CIPHER_IV
              value: "1234567890abcdef"
            - name: DJANGO_SETTINGS_MODULE
              value: settings.helm
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: ENVIRONMENT_LABEL
              value: prod
          command:
            - python
            - -c
            - |
              import base64
              import json
              import os
              import secrets
              import sys
              import textwrap
              import time
              import requests

              def read_secret(namespace, name):
                  host = os.environ.get("KUBERNETES_SERVICE_HOST")
                  port = os.environ.get("KUBERNETES_SERVICE_PORT", "443")
                  token_path = "/var/run/secrets/kubernetes.io/serviceaccount/token"
                  ca_path = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
                  with open(token_path, "r", encoding="utf-8") as fh:
                      token = fh.read().strip()
                  url = f"https://{host}:{port}/api/v1/namespaces/{namespace}/secrets/{name}"
                  resp = requests.get(url, headers={"Authorization": f"Bearer {token}"}, verify=ca_path, timeout=10)
                  resp.raise_for_status()
                  data = resp.json().get("data", {})
                  return {k: base64.b64decode(v).decode().strip() for k, v in data.items()}

              discord_secret = read_secret("monitoring", "alertmanager-discord")
              oncall_urls_secret = read_secret("monitoring", "alertmanager-oncall")

              critical_url = oncall_urls_secret.get("critical_url")
              warning_url = oncall_urls_secret.get("warning_url")
              if not critical_url or not warning_url:
                  print("Missing OnCall integration URLs in alertmanager-oncall secret", file=sys.stderr)
                  sys.exit(1)
              
              def extract_token(url):
                  parts = url.rstrip("/").split("/")
                  return parts[-1] if parts else ""
              
              critical_token = extract_token(critical_url)
              warning_token = extract_token(warning_url)
              
              discord_critical = discord_secret.get("discord_critical_url")
              discord_warning = discord_secret.get("discord_warning_url")
              discord_oncall_role = discord_secret.get("discord_oncall_role_id", "").strip()
              if not discord_critical or not discord_warning:
                  print("Missing Discord webhook URLs", file=sys.stderr)
                  sys.exit(1)
              proxy_url = "http://oncall-discord-proxy.monitoring-oncall.svc:8080/webhook"

              os.environ.setdefault("DJANGO_SETTINGS_MODULE", os.environ.get("DJANGO_SETTINGS_MODULE", "settings.helm"))
              for attempt in range(15):
                  try:
                      import django
                      django.setup()
                      break
                  except Exception as exc:
                      print(f"Django setup failed (attempt {attempt+1}/15): {exc}", file=sys.stderr)
                      time.sleep(10)
              else:
                  sys.exit(1)

              from django.db import transaction
              from apps.alerts.models import AlertReceiveChannel, ChannelFilter
              from apps.user_management.models import Organization, User
              from apps.webhooks.models import Webhook

              base_url = os.environ.get("BASE_URL", "https://oncall.devsh.eu").rstrip("/")
              grafana_url = f"{base_url}/grafana"

              org = Organization.objects.order_by("id").first()
              if not org:
                  org = Organization.objects.create(
                      stack_id=1,
                      org_id=1,
                      stack_slug="devsh",
                      org_slug="devsh",
                      org_title="Devsh",
                      grafana_url=grafana_url,
                      api_token=secrets.token_urlsafe(32),
                      api_token_status=Organization.API_TOKEN_STATUS_OK,
                  )

              user = User.objects.filter(organization=org).order_by("id").first()
              if not user:
                  user = User.objects.create(
                      organization=org,
                      user_id=1,
                      email="admin@oncall.local",
                      name="OnCall Admin",
                      username="oncall-admin",
                      role=0,
                      avatar_url=f"{base_url}/static/img/avatars/avatar.png",
                      is_active=True,
                  )

              allowed_mentions = {"parse": ["roles"]}
              if discord_oncall_role:
                  allowed_mentions["roles"] = [discord_oncall_role]

              environment_label = os.environ.get("ENVIRONMENT_LABEL", "prod").strip() or "prod"
              mention_prefix = f"<@&{discord_oncall_role}>" if discord_oncall_role else "@OnCall"
              discord_template = textwrap.dedent(
                  """
                  {
                    "content": "# %s",
                    "embeds": [
                      {
                        "title": "{{ alert_payload.commonAnnotations.summary | default(alert_group.title) }}",
                        "url": "{{ alert_group.permalinks.web or '' }}",
                        "color": {{ {
                          'CRITICAL': 16731427,
                          'WARNING': 16763904,
                          'INFO': 3447003,
                          'NONE': 10070709
                        }.get((alert_payload.commonLabels.severity | upper if alert_payload.commonLabels and alert_payload.commonLabels.severity else 'NONE'), 10070709) }},
                        "fields": [
                          {"name": "Event", "value": "{{ event.type | upper }}", "inline": true},
                          {"name": "Status", "value": "{{ '✅ RESOLVED' if event.type == 'resolve' else '🚨 FIRING' if event.type == 'alert group created' else event.type | upper }}", "inline": true},
                          {"name": "Severity", "value": "{{ ('🟥 ' if (alert_payload.commonLabels.severity | upper if alert_payload.commonLabels and alert_payload.commonLabels.severity else 'UNKNOWN') == 'CRITICAL' else '🟠 ' if (alert_payload.commonLabels.severity | upper if alert_payload.commonLabels and alert_payload.commonLabels.severity else 'UNKNOWN') == 'WARNING' else '🟦 ' if (alert_payload.commonLabels.severity | upper if alert_payload.commonLabels and alert_payload.commonLabels.severity else 'UNKNOWN') == 'INFO' else '⚪ ') }}{{ alert_payload.commonLabels.severity | upper if alert_payload.commonLabels and alert_payload.commonLabels.severity else 'UNKNOWN' }}", "inline": true},
                          {"name": "Cluster", "value": "{{ alert_payload.commonLabels.cluster | default('%s') }}", "inline": true},
                          {"name": "Namespace", "value": "{{ alert_payload.commonLabels.namespace | default('n/a') }}", "inline": true},
                          {"name": "Resource", "value": "{{ alert_payload.commonLabels.alertname | default('Alert') }}", "inline": true},
                          {"name": "Instance", "value": "{{ alert_payload.commonLabels.instance | default('n/a') }}", "inline": true}
                        ]
                      }
                    ],
                    "allowed_mentions": %s
                  }
                  """
              ) % (mention_prefix, environment_label, json.dumps(allowed_mentions))
              discord_template = "\n".join(line.rstrip() for line in discord_template.splitlines()).strip()

              def ensure_integration(name, token):
                  with transaction.atomic():
                      channel, _ = AlertReceiveChannel.objects.get_or_create(
                          organization=org,
                          verbal_name=name,
                          defaults={
                              "integration": AlertReceiveChannel.INTEGRATION_ALERTMANAGER,
                              "author": user,
                          },
                      )
                      changed = False
                      if channel.integration != AlertReceiveChannel.INTEGRATION_ALERTMANAGER:
                          channel.integration = AlertReceiveChannel.INTEGRATION_ALERTMANAGER
                          changed = True
                      if channel.token != token:
                          channel.token = token
                          changed = True
                      if changed:
                          channel.save()
                      if not channel.channel_filters.filter(is_default=True).exists():
                          ChannelFilter.objects.create(alert_receive_channel=channel, is_default=True, order=0)
                      return channel
              
              def ensure_webhook(name, url, channel, trigger_type):
                  with transaction.atomic():
                      clean_url = (url or "").rstrip("/")
                      if clean_url.endswith("/slack"):
                          clean_url = clean_url[: -len("/slack")]
                      webhook, _ = Webhook.objects.get_or_create(
                          organization=org,
                          name=name,
                          defaults={
                              "url": clean_url,
                              "http_method": "POST",
                              "trigger_type": trigger_type,
                              "forward_all": True,
                              "data": "",
                              "is_webhook_enabled": True,
                          },
                      )
                      desired = {
                          "url": clean_url,
                          "http_method": "POST",
                          "trigger_type": trigger_type,
                          "forward_all": True,
                          "data": "",
                          "is_webhook_enabled": True,
                      }
                      dirty = False
                      for key, val in desired.items():
                          if getattr(webhook, key) != val:
                              setattr(webhook, key, val)
                              dirty = True
                      if dirty:
                          webhook.save()
                      webhook.filtered_integrations.set([channel])
                      return webhook
              
              critical_channel = ensure_integration("alertmanager-critical", critical_token)
              warning_channel = ensure_integration("alertmanager-warning", warning_token)
              
              ensure_webhook("discord-critical", proxy_url, critical_channel, Webhook.TRIGGER_ALERT_GROUP_CREATED)
              ensure_webhook("discord-critical-resolve", proxy_url, critical_channel, Webhook.TRIGGER_RESOLVE)
              ensure_webhook("discord-warning", proxy_url, warning_channel, Webhook.TRIGGER_ALERT_GROUP_CREATED)
              ensure_webhook("discord-warning-resolve", proxy_url, warning_channel, Webhook.TRIGGER_RESOLVE)

              print("OnCall integrations and webhooks configured")
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: oncall-discord-proxy
  namespace: monitoring-oncall
data:
  app.py: |
    import json
    import os
    import time
    from typing import Tuple

    import redis
    import requests
    from flask import Flask, jsonify, request

    app = Flask(__name__)

    def clean_webhook(url: str) -> str:
        clean = (url or "").rstrip("/")
        if clean.endswith("/slack"):
            clean = clean[: -len("/slack")]
        return clean

    DISCORD_CRITICAL = clean_webhook(os.environ.get("DISCORD_CRITICAL_URL", ""))
    DISCORD_WARNING = clean_webhook(os.environ.get("DISCORD_WARNING_URL", ""))
    ONCALL_ROLE_ID = os.environ.get("DISCORD_ONCALL_ROLE_ID", "").strip()

    REDIS_HOST = os.environ.get("REDIS_HOST", "oncall-redis-master.monitoring-oncall.svc")
    REDIS_PORT = int(os.environ.get("REDIS_PORT", "6379"))
    REDIS_PASSWORD = os.environ.get("REDIS_PASSWORD", "")
    redis_client = redis.Redis(host=REDIS_HOST, port=REDIS_PORT, password=REDIS_PASSWORD, decode_responses=True)

    def choose_webhook(severity: str) -> str:
        sev = (severity or "").upper()
        if sev == "CRITICAL":
            return DISCORD_CRITICAL
        return DISCORD_WARNING

    def normalize(data: dict):
        if "alert_group_id" in data:
            common_labels = json.loads(data.get("common_labels") or "{}")
            common_annotations = json.loads(data.get("common_annotations") or "{}")
            alert_group_id = str(data.get("alert_group_id") or "")
            alert_group_title = data.get("alert_group_title") or ""
            alert_group_link = data.get("alert_group_permalink") or ""
            event_type = data.get("event") or ""
        else:
            alert_payload = data.get("alert_payload", {})
            alert_group = data.get("alert_group", {}) or {}
            common_labels = alert_payload.get("commonLabels") or {}
            common_annotations = alert_payload.get("commonAnnotations") or {}
            alert_group_id = str(alert_group.get("id") or "")
            alert_group_title = alert_group.get("title") or ""
            alert_group_link = (alert_group.get("permalinks") or {}).get("web") or ""
            event_type = (data.get("event") or {}).get("type") or ""
        return event_type, alert_group_id, alert_group_title, alert_group_link, common_labels, common_annotations

    def build_payload(data: dict) -> Tuple[str, str, dict]:
        event_type, alert_group_id, alert_group_title, alert_group_link, common_labels, common_annotations = normalize(data)

        severity = (common_labels.get("severity") or "UNKNOWN").upper()
        cluster = common_labels.get("cluster") or "prod"
        namespace = common_labels.get("namespace") or "n/a"
        resource = common_labels.get("alertname") or "Alert"
        instance = common_labels.get("instance") or "n/a"
        summary = common_annotations.get("summary") or alert_group_title or "Alert"
        status_label = "✅ RESOLVED" if str(event_type).lower() == "resolve" else "🚨 FIRING"

        severity_emoji = {
            "CRITICAL": "🟥 ",
            "WARNING": "🟠 ",
            "INFO": "🟦 ",
        }.get(severity, "⚪ ")

        embed = {
            "title": summary,
            "url": (data.get("alert_group") or {}).get("permalinks", {}).get("web") or "",
            "color": {
                "CRITICAL": 16731427,
                "WARNING": 16763904,
                "INFO": 3447003,
                "NONE": 10070709,
            }.get(severity, 10070709),
            "fields": [
                {"name": "Event", "value": str(event_type).upper(), "inline": True},
                {"name": "Status", "value": status_label, "inline": True},
                {"name": "Severity", "value": f"{severity_emoji}{severity}", "inline": True},
                {"name": "Cluster", "value": cluster, "inline": True},
                {"name": "Namespace", "value": namespace, "inline": True},
                {"name": "Resource", "value": resource, "inline": True},
                {"name": "Instance", "value": instance, "inline": True},
            ],
        }

        mention = f"<@&{ONCALL_ROLE_ID}>" if ONCALL_ROLE_ID else "@OnCall"
        mentions = {"parse": [], "roles": [ONCALL_ROLE_ID]} if ONCALL_ROLE_ID else {"parse": []}
        return alert_group_id, {
            "content": f"# {mention}",
            "embeds": [embed],
            "allowed_mentions": mentions,
        }

    def log(msg: str):
        print(msg, flush=True)

    def send_discord(webhook: str, payload: dict, message_id: str = None) -> Tuple[int, dict]:
        if not webhook:
            return 400, {}
        headers = {"Content-Type": "application/json"}
        target = webhook
        method = requests.post
        if message_id:
            target = f"{webhook}/messages/{message_id}"
            method = requests.patch
        resp = method(target, headers=headers, data=json.dumps(payload), timeout=10)
        try:
            body = resp.json()
        except Exception:
            body = {}
        log(f"discord status={resp.status_code} message_id={body.get('id') if isinstance(body, dict) else ''}")
        return resp.status_code, body

    def record_message(alert_group_id: str, message_id: str, ttl: int = 7 * 24 * 3600):
        if alert_group_id and message_id:
            redis_client.setex(f"oncall:discord:{alert_group_id}", ttl, message_id)

    def read_message(alert_group_id: str) -> str:
        if not alert_group_id:
            return ""
        return redis_client.get(f"oncall:discord:{alert_group_id}") or ""

    @app.route("/healthz")
    def healthz():
        return "ok"

    @app.route("/webhook", methods=["POST"])
    def webhook():
        data = request.get_json(force=True, silent=True) or {}
        alert_group = data.get("alert_group") or {}
        alert_group_id = str(alert_group.get("id") or "")
        alert_payload = data.get("alert_payload") or {}
        severity = (alert_payload.get("commonLabels") or {}).get("severity") or "warning"

        target_webhook = choose_webhook(severity)
        alert_group_id, payload = build_payload(data)

        event_type = data.get("event") or ""
        if isinstance(event_type, dict):
            event_type = event_type.get("type") or ""
        event_type = str(event_type).lower()
        log(f"recv event={event_type} group={alert_group_id} severity={severity}")
        if event_type == "resolve":
            msg_id = read_message(alert_group_id)
            if msg_id:
                status, body = send_discord(target_webhook, payload, message_id=msg_id)
                if status in (200, 204):
                    return jsonify({"status": "patched", "message_id": msg_id}), 200
            status, body = send_discord(target_webhook, payload)
            if status == 200 and "id" in body:
                record_message(alert_group_id, body["id"])
            return jsonify({"status": "posted_resolve", "discord_status": status}), status

        status, body = send_discord(target_webhook, payload)
        if status == 200 and "id" in body:
            record_message(alert_group_id, body["id"])
            return jsonify({"status": "posted_create", "message_id": body["id"]}), 200
        return jsonify({"status": "error", "discord_status": status, "body": body}), status


    if __name__ == "__main__":
        port = int(os.environ.get("PORT", "8080"))
        app.run(host="0.0.0.0", port=port)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oncall-discord-proxy
  namespace: monitoring-oncall
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oncall-discord-proxy
  template:
    metadata:
      labels:
        app: oncall-discord-proxy
    spec:
      serviceAccountName: oncall-bootstrap
      containers:
        - name: proxy
          image: python:3.12-slim
          command: ["sh", "-c"]
          args: ["pip install --no-cache-dir flask redis requests && python /opt/app/app.py"]
          env:
            - name: DISCORD_CRITICAL_URL
              valueFrom:
                secretKeyRef:
                  name: alertmanager-discord-proxy
                  key: discord_critical_url
            - name: DISCORD_WARNING_URL
              valueFrom:
                secretKeyRef:
                  name: alertmanager-discord-proxy
                  key: discord_warning_url
            - name: DISCORD_ONCALL_ROLE_ID
              valueFrom:
                secretKeyRef:
                  name: alertmanager-discord-proxy
                  key: discord_oncall_role_id
            - name: REDIS_HOST
              value: oncall-redis-master.monitoring-oncall.svc
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oncall-redis
                  key: redis-password
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: app-code
              mountPath: /opt/app
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: app-code
          configMap:
            name: oncall-discord-proxy
            items:
              - key: app.py
                path: app.py
---
apiVersion: v1
kind: Service
metadata:
  name: oncall-discord-proxy
  namespace: monitoring-oncall
spec:
  selector:
    app: oncall-discord-proxy
  ports:
    - name: http
      port: 8080
      targetPort: 8080
