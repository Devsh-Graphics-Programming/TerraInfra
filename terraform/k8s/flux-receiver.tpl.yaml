apiVersion: notification.toolkit.fluxcd.io/v1
kind: Receiver
metadata:
  name: github-receiver
  namespace: flux-system
spec:
  type: github
  events:
    - ping
    - push
  secretRef:
    name: github-webhook-token
  resources:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      name: terralinfra
      namespace: flux-system
  suspend: false
---
apiVersion: v1
kind: Secret
metadata:
  name: github-webhook-token
  namespace: flux-system
type: Opaque
stringData:
  token: "${GITHUB_WEBHOOK_SECRET}"
---
apiVersion: v1
kind: Service
metadata:
  name: flux-receiver
  namespace: flux-system
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 9292
      protocol: TCP
      name: http
  selector:
    app: notification-controller
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: flux-hook-cert
  namespace: flux-system
spec:
  secretName: flux-hook-tls
  dnsNames:
    - ${ENV_PREFIX}flux-hook.${BASE_DOMAIN}
  issuerRef:
    name: letsencrypt-http
    kind: ClusterIssuer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flux-receiver
  namespace: flux-system
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ${ENV_PREFIX}flux-hook.${BASE_DOMAIN}
      secretName: flux-hook-tls
  rules:
    - host: ${ENV_PREFIX}flux-hook.${BASE_DOMAIN}
      http:
        paths:
          - path: /hook
            pathType: Prefix
            backend:
              service:
                name: flux-receiver
                port:
                  number: 80
