apiVersion: v1
kind: Namespace
metadata:
  name: apps-tools
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kimai-mariadb
  namespace: apps-tools
  labels:
    app: kimai-mariadb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kimai-mariadb
  template:
    metadata:
      labels:
        app: kimai-mariadb
    spec:
      containers:
        - name: mariadb
          image: mariadb:11
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kimai-db-credentials
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              value: "kimai"
            - name: MYSQL_USER
              value: "kimai"
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kimai-db-credentials
                  key: mysql-user-password
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mariadb-data
          hostPath:
            path: /mnt/data/mariadb
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: kimai-mariadb
  namespace: apps-tools
spec:
  selector:
    app: kimai-mariadb
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kimai
  namespace: apps-tools
  labels:
    app: kimai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kimai
  template:
    metadata:
      labels:
        app: kimai
    spec:
      containers:
        - name: kimai
          image: kimai/kimai2:apache
          ports:
            - containerPort: 8001
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kimai-db-credentials
                  key: database-url
          volumeMounts:
            - name: kimai-var
              mountPath: /opt/kimai/var
      volumes:
        - name: kimai-var
          hostPath:
            path: /mnt/data/kimai-var
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: kimai-service
  namespace: apps-tools
spec:
  selector:
    app: kimai
  ports:
    - port: 80
      targetPort: 8001
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kimai-cert
  namespace: apps-tools
spec:
  secretName: kimai-tls
  dnsNames:
    - ${KIMAI_DOMAIN}
  issuerRef:
    name: letsencrypt-http
    kind: ClusterIssuer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kimai-ingress
  namespace: apps-tools
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ${KIMAI_DOMAIN}
      secretName: kimai-tls
  rules:
    - host: ${KIMAI_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kimai-service
                port:
                  number: 80
