apiVersion: v1
kind: Namespace
metadata:
  name: apps-tools
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kimai-mariadb-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: kimai-local
  local:
    path: /mnt/data/mariadb
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - devsh-k3s-prod-node-1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kimai-mariadb-pvc
  namespace: apps-tools
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: kimai-local
  volumeName: kimai-mariadb-pv
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kimai-var-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: kimai-local
  local:
    path: /mnt/data/kimai-var
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - devsh-k3s-prod-node-1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kimai-var-pvc
  namespace: apps-tools
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: kimai-local
  volumeName: kimai-var-pv
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kimai
  namespace: apps-tools
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kimai-mariadb
  namespace: apps-tools
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kimai-mariadb
  namespace: apps-tools
  labels:
    app: kimai-mariadb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kimai-mariadb
  template:
    metadata:
      labels:
        app: kimai-mariadb
    spec:
      securityContext:
        fsGroup: 999
      serviceAccountName: kimai-mariadb
      priorityClassName: prod-app-critical
      terminationGracePeriodSeconds: 60
      containers:
        - name: mariadb
          image: mariadb:11
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kimai-db-credentials
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              value: kimai
            - name: MYSQL_USER
              value: kimai
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kimai-db-credentials
                  key: mysql-user-password
          ports:
            - containerPort: 3306
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - mariadb-admin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mariadb-admin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - mariadb-admin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mariadb-data
          persistentVolumeClaim:
            claimName: kimai-mariadb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: kimai-mariadb
  namespace: apps-tools
spec:
  selector:
    app: kimai-mariadb
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kimai
  namespace: apps-tools
  labels:
    app: kimai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kimai
  template:
    metadata:
      labels:
        app: kimai
    spec:
      securityContext:
        fsGroup: 33
      serviceAccountName: kimai
      priorityClassName: prod-app-critical
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: ensure-db
          image: mariadb:11
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kimai-db-credentials
                  key: mysql-root-password
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kimai-db-credentials
                  key: mysql-user-password
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          command:
            - bash
            - -c
            - |
              set -e
              for i in $(seq 1 30); do
                mariadb -h kimai-mariadb -uroot -p"$MYSQL_ROOT_PASSWORD" -e "\
                CREATE DATABASE IF NOT EXISTS kimai; \
                CREATE USER IF NOT EXISTS 'kimai'@'%' IDENTIFIED BY '$MYSQL_PASSWORD'; \
                ALTER USER 'kimai'@'%' IDENTIFIED BY '$MYSQL_PASSWORD'; \
                GRANT ALL PRIVILEGES ON kimai.* TO 'kimai'@'%'; \
                FLUSH PRIVILEGES;" && exit 0
                sleep 5
              done
              echo "Failed to prepare database" >&2
              exit 1
      containers:
        - name: kimai
          image: kimai/kimai2:apache
          securityContext:
            runAsNonRoot: true
            runAsUser: 33
            runAsGroup: 33
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 8001
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /
              port: 8001
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8001
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8001
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          env:
            - name: MAILER_URL
              valueFrom:
                secretKeyRef:
                  name: notification-smtp
                  key: MAILER_DSN
            - name: MAILER_DSN
              valueFrom:
                secretKeyRef:
                  name: notification-smtp
                  key: MAILER_DSN
            - name: MAILER_FROM
              valueFrom:
                secretKeyRef:
                  name: notification-smtp
                  key: MAILER_FROM
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kimai-db-credentials
                  key: database-url
          volumeMounts:
            - name: kimai-var
              mountPath: /opt/kimai/var
      volumes:
        - name: kimai-var
          persistentVolumeClaim:
            claimName: kimai-var-pvc
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kimai-bootstrap-admin-v4
  namespace: apps-tools
  annotations:
    kustomize.toolkit.fluxcd.io/force: "enabled"
spec:
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      securityContext:
        fsGroup: 33
      serviceAccountName: kimai
      restartPolicy: Never
      containers:
        - name: create-admin
          image: kimai/kimai2:apache
          securityContext:
            runAsNonRoot: true
            runAsUser: 33
            runAsGroup: 33
            allowPrivilegeEscalation: false
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kimai-db-credentials
                  key: database-url
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kimai-db-credentials
                  key: mysql-user-password
            - name: KIMAI_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kimai-admin-credentials
                  key: username
            - name: KIMAI_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kimai-admin-credentials
                  key: password
            - name: KIMAI_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: kimai-admin-credentials
                  key: username
          volumeMounts:
            - name: kimai-var
              mountPath: /opt/kimai/var
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              ADMIN_EMAIL="${KIMAI_ADMIN_EMAIL:-admin@devsh.eu}"
              if ! printf "%s" "$ADMIN_EMAIL" | grep -Eq '.+@.+\\..+'; then
                ADMIN_EMAIL="admin@devsh.eu"
              fi
              export KIMAI_ADMIN_EMAIL="$ADMIN_EMAIL"
              for i in $(seq 1 30); do
                php -r 'new PDO("mysql:host=kimai-mariadb;dbname=kimai","kimai",getenv("MYSQL_PASSWORD"));' && break
                sleep 5
              done
              php -r 'try {$pdo=new PDO("mysql:host=kimai-mariadb;dbname=kimai","kimai",getenv("MYSQL_PASSWORD")); $pdo->query("SELECT 1 FROM kimai2_configuration LIMIT 1"); exit(0);} catch (Throwable $e) {exit(1);}' || /opt/kimai/bin/console kimai:install -n
              if php -r '$pdo=new PDO("mysql:host=kimai-mariadb;dbname=kimai","kimai",getenv("MYSQL_PASSWORD")); $stmt=$pdo->prepare("SELECT 1 FROM kimai2_users WHERE username=? OR email=?"); $stmt->execute([getenv("KIMAI_ADMIN_USERNAME"), getenv("KIMAI_ADMIN_EMAIL")]); exit($stmt->fetch() ? 0 : 1);'; then
                exit 0
              fi
              /opt/kimai/bin/console kimai:user:create "$KIMAI_ADMIN_USERNAME" "$ADMIN_EMAIL" ROLE_SUPER_ADMIN "$KIMAI_ADMIN_PASSWORD"
      volumes:
        - name: kimai-var
          persistentVolumeClaim:
            claimName: kimai-var-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: kimai-service
  namespace: apps-tools
spec:
  selector:
    app: kimai
  ports:
    - port: 80
      targetPort: 8001
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kimai-cert
  namespace: apps-tools
spec:
  secretName: kimai-tls
  dnsNames:
    - ${ENV_PREFIX}kimai2.${BASE_DOMAIN}
  issuerRef:
    name: letsencrypt-http
    kind: ClusterIssuer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kimai-ingress
  namespace: apps-tools
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ${ENV_PREFIX}kimai2.${BASE_DOMAIN}
      secretName: kimai-tls
  rules:
    - host: ${ENV_PREFIX}kimai2.${BASE_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kimai-service
                port:
                  number: 80
