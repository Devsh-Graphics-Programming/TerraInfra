apiVersion: v1
kind: Namespace
metadata:
  name: website
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: website
  namespace: website
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: blog
  namespace: website
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: linkedin-feed-sync
  namespace: website
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: linkedin-feed
  namespace: website
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsh-website
  namespace: website
  labels:
    app: devsh-website
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: devsh-website
  template:
    metadata:
      labels:
        app: devsh-website
    spec:
      serviceAccountName: website
      priorityClassName: prod-app-critical
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: website
          image: ghcr.io/devsh-graphics-programming/www-website:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmpfs-tmp
              mountPath: /tmp
            - name: tmpfs-config
              mountPath: /config
            - name: tmpfs-data
              mountPath: /data
            - name: linkedin-feed
              mountPath: /srv/social
              readOnly: true
      volumes:
        - name: tmpfs-tmp
          emptyDir:
            medium: Memory
        - name: tmpfs-config
          emptyDir:
            medium: Memory
        - name: tmpfs-data
          emptyDir:
            medium: Memory
        - name: linkedin-feed
          persistentVolumeClaim:
            claimName: linkedin-feed
            readOnly: true
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: linkedin-feed-sync
  namespace: website
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 900
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: linkedin-feed-sync
        spec:
          priorityClassName: prod-batch-low
          serviceAccountName: linkedin-feed-sync
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              image: ghcr.io/devsh-graphics-programming/www-website-linkedin-sync:latest
              imagePullPolicy: Always
              env:
                - name: LINKEDIN_FEED_OUTPUT
                  value: /srv/social/linkedin-posts.json
                - name: LINKEDIN_MEDIA_OUTPUT_DIR
                  value: /srv/social/linkedin-media
                - name: LINKEDIN_MEDIA_URL_PREFIX
                  value: /social/linkedin-media
                - name: LINKEDIN_POST_LIMIT
                  value: "3"
                - name: LINKEDIN_PUBLIC_FALLBACK_URL
                  value: https://www.linkedin.com/company/devsh-graphics-programming/
                - name: LINKEDIN_ORGANIZATION_URN
                  valueFrom:
                    secretKeyRef:
                      name: linkedin-feed
                      key: LINKEDIN_ORGANIZATION_URN
                      optional: true
                - name: LINKEDIN_ACCESS_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: linkedin-feed
                      key: LINKEDIN_ACCESS_TOKEN
                      optional: true
              resources:
                requests:
                  cpu: 25m
                  memory: 96Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: linkedin-feed
                  mountPath: /srv/social
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: linkedin-feed
              persistentVolumeClaim:
                claimName: linkedin-feed
            - name: tmp
              emptyDir:
                medium: Memory
---
apiVersion: v1
kind: Service
metadata:
  name: devsh-website
  namespace: website
spec:
  selector:
    app: devsh-website
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devsh-website
  namespace: website
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-http
    nginx.ingress.kubernetes.io/proxy-intercept-errors: "true"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_intercept_errors on;
      error_page 404 = /;
      rewrite ^/(about|nabla|services)/?$ /$1.html break;
      set $static_cache "";
      if ($request_uri ~* "^/_next/static/") { set $static_cache "public, max-age=31536000, immutable"; }
      if ($request_uri ~* "^/(clients|vulkanised_photos|list)/") { set $static_cache "public, max-age=31536000, immutable"; }
      if ($request_uri ~* "\\.(?:gif|png|jpe?g|webp|svg|mp4|webm|woff2?|ttf|otf)$") { set $static_cache "public, max-age=31536000, immutable"; }
      if ($static_cache != "") { add_header Cache-Control $static_cache; }
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ${ENV_PREFIX}www.${BASE_DOMAIN}
      secretName: devsh-website-tls
  rules:
    - host: ${ENV_PREFIX}www.${BASE_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devsh-website
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devsh-website-root-redirect
  namespace: website
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-http
    nginx.ingress.kubernetes.io/permanent-redirect: https://${ENV_PREFIX}www.${BASE_DOMAIN}
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ${ENV_PREFIX}${BASE_DOMAIN}
      secretName: devsh-website-tls
  rules:
    - host: ${ENV_PREFIX}${BASE_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devsh-website
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devsh-website-blog-redirect
  namespace: website
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-http
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/permanent-redirect: https://${ENV_PREFIX}blog.${BASE_DOMAIN}
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ${ENV_PREFIX}www.${BASE_DOMAIN}
      secretName: devsh-website-tls
  rules:
    - host: ${ENV_PREFIX}www.${BASE_DOMAIN}
      http:
        paths:
          - path: /blog(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: devsh-blog
                port:
                  number: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsh-blog
  namespace: website
  labels:
    app: devsh-blog
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: devsh-blog
  template:
    metadata:
      labels:
        app: devsh-blog
    spec:
      serviceAccountName: blog
      priorityClassName: prod-app-critical
      initContainers:
        - name: prepare-caddy
          image: ghcr.io/devsh-graphics-programming/www-blog:latest
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
            - cp /usr/bin/caddy /caddy-bin/caddy && chmod 0755 /caddy-bin/caddy
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: caddy-bin
              mountPath: /caddy-bin
      containers:
        - name: blog
          image: ghcr.io/devsh-graphics-programming/www-blog:latest
          imagePullPolicy: Always
          command:
            - /caddy-bin/caddy
            - run
            - --config=/etc/caddy/Caddyfile
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: caddy-bin
              mountPath: /caddy-bin
            - name: tmpfs-tmp
              mountPath: /tmp
            - name: tmpfs-config
              mountPath: /config
            - name: tmpfs-data
              mountPath: /data
      volumes:
        - name: tmpfs-tmp
          emptyDir:
            medium: Memory
        - name: tmpfs-config
          emptyDir:
            medium: Memory
        - name: tmpfs-data
          emptyDir:
            medium: Memory
        - name: caddy-bin
          emptyDir:
            medium: Memory
---
apiVersion: v1
kind: Service
metadata:
  name: devsh-blog
  namespace: website
spec:
  selector:
    app: devsh-blog
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devsh-blog
  namespace: website
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-http
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ${ENV_PREFIX}blog.${BASE_DOMAIN}
      secretName: devsh-blog-tls
  rules:
    - host: ${ENV_PREFIX}blog.${BASE_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devsh-blog
                port:
                  number: 80
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: devsh-website-tls
  namespace: website
spec:
  secretName: devsh-website-tls
  dnsNames:
    - ${ENV_PREFIX}${BASE_DOMAIN}
    - ${ENV_PREFIX}www.${BASE_DOMAIN}
  issuerRef:
    name: letsencrypt-http
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: devsh-blog-tls
  namespace: website
spec:
  secretName: devsh-blog-tls
  dnsNames:
    - ${ENV_PREFIX}blog.${BASE_DOMAIN}
  issuerRef:
    name: letsencrypt-http
    kind: ClusterIssuer
