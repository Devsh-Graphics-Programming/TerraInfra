apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-cert
  namespace: monitoring
spec:
  secretName: grafana-tls
  dnsNames:
    - ${ENV_PREFIX}monitoring.${BASE_DOMAIN}
  issuerRef:
    name: letsencrypt-http
    kind: ClusterIssuer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: monitoring
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ${ENV_PREFIX}monitoring.${BASE_DOMAIN}
      secretName: grafana-tls
  rules:
    - host: ${ENV_PREFIX}monitoring.${BASE_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monitoring-grafana
                port:
                  number: 80
