apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-cert
  namespace: monitoring-grafana
spec:
  secretName: grafana-tls
  dnsNames:
    - ${ENV_PREFIX}monitoring.${BASE_DOMAIN}
  issuerRef:
    name: letsencrypt-http
    kind: ClusterIssuer
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana-charts
  namespace: flux-system
spec:
  interval: 1h
  url: https://grafana.github.io/helm-charts
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: grafana-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: grafana-local
  local:
    path: /mnt/data/grafana
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - devsh-k3s-prod-node-1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: monitoring-grafana
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: grafana-local
  volumeName: grafana-pv
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring-grafana
spec:
  interval: 10m
  chart:
    spec:
      chart: grafana
      version: 8.5.7
      sourceRef:
        kind: HelmRepository
        name: grafana-charts
        namespace: flux-system
      interval: 1h
  releaseName: grafana
  targetNamespace: monitoring-grafana
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    serviceAccount:
      create: true
      name: monitoring-grafana
    admin:
      existingSecret: monitoring-grafana
      userKey: admin-user
      passwordKey: admin-password
    persistence:
      enabled: true
      existingClaim: grafana-pvc
    initChownData:
      enabled: false
    envFromSecret: notification-smtp
    securityContext:
      runAsUser: 472
      runAsGroup: 472
      fsGroup: 472
    containerSecurityContext:
      runAsUser: 472
      runAsGroup: 472
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
    ingress:
      enabled: true
      ingressClassName: nginx
      hosts:
        - ${ENV_PREFIX}monitoring.${BASE_DOMAIN}
      tls:
        - secretName: grafana-tls
          hosts:
            - ${ENV_PREFIX}monitoring.${BASE_DOMAIN}
    sidecar:
      datasources:
        enabled: false
      dashboards:
        enabled: false
