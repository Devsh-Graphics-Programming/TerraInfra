apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: flux-system
spec:
  interval: 1h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitoring
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 80.2.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 1h
  releaseName: monitoring
  targetNamespace: monitoring
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    grafana:
      enabled: false
    prometheus:
      prometheusSpec:
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
        retention: 7d
        retentionSize: 2GB
        walCompression: true
        scrapeInterval: 30s
        evaluationInterval: 30s
    alertmanager:
      alertmanagerSpec:
        secrets:
          - alertmanager-discord
          - alertmanager-oncall
      config:
        global:
          resolve_timeout: 5m
        inhibit_rules:
          - source_matchers: ['severity="critical"']
            target_matchers: ['severity="warning"']
            equal: ['alertname', 'namespace', 'cluster', 'resource']
        route:
          receiver: oncall-warning
          group_by: ['alertname', 'namespace', 'cluster', 'resource']
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 2h
          routes:
            - matchers:
                - severity="critical"
              receiver: oncall-critical
            - matchers:
                - severity="warning"
              receiver: oncall-warning
        receivers:
          - name: oncall-critical
            webhook_configs:
              - url: http://oncall-engine.monitoring-oncall.svc:8080/integrations/v1/alertmanager/6EF3MGHHAAexGibfe6zchVEI/
                send_resolved: true
          - name: oncall-warning
            webhook_configs:
              - url: http://oncall-engine.monitoring-oncall.svc:8080/integrations/v1/alertmanager/qp8pwFDnoYG25D5UI778wzBG/
                send_resolved: true
