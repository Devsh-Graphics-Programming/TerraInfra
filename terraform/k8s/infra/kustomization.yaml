apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - jetstack-repo.yaml
  - cert-manager-helmrelease.yaml
  - ingress-repo.yaml
  - ingress-helmrelease.yaml
patches:
  - target:
      kind: HelmRelease
      name: ingress-nginx
    patch: |-
      - op: add
        path: /spec/values/controller/service
        value: {externalTrafficPolicy: Local}
