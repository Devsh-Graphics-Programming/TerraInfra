---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kimai-ingress-from-ingress
  namespace: apps-tools
spec:
  podSelector:
    matchLabels:
      app: kimai
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra
      ports:
        - port: 8001
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mariadb-ingress-from-kimai
  namespace: apps-tools
spec:
  podSelector:
    matchLabels:
      app: kimai-mariadb
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apps-tools
          podSelector:
            matchLabels:
              app: kimai
      ports:
        - port: 3306
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apps-tools-egress
  namespace: apps-tools
spec:
  podSelector: {}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apps-tools
          podSelector:
            matchLabels:
              app: kimai-mariadb
      ports:
        - port: 3306
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 587
          protocol: TCP
  policyTypes:
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
