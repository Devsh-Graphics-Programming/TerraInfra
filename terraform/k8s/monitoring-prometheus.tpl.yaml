apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: flux-system
spec:
  interval: 1h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitoring
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 80.2.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 1h
  releaseName: monitoring
  targetNamespace: monitoring
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    grafana:
      enabled: false
    alertmanager:
      alertmanagerSpec:
        secrets:
          - alertmanager-discord
      config:
        global:
          resolve_timeout: 5m
        inhibit_rules:
          - source_matchers: ['severity="critical"']
            target_matchers: ['severity="warning"']
            equal: ['alertname', 'namespace', 'cluster', 'resource']
        route:
          receiver: discord-warning
          group_by: ['alertname', 'namespace', 'cluster', 'resource']
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 2h
          routes:
            - matchers:
                - severity="critical"
              receiver: discord-critical
            - matchers:
                - severity="warning"
              receiver: discord-warning
        receivers:
          - name: discord-critical
            slack_configs:
              - api_url_file: /etc/alertmanager/secrets/discord_critical_url
                send_resolved: true
                title: '{{ template "devsh.title" . }}'
                text: '{{ template "devsh.body" . }}'
          - name: discord-warning
            slack_configs:
              - api_url_file: /etc/alertmanager/secrets/discord_warning_url
                send_resolved: true
                title: '{{ template "devsh.title" . }}'
                text: '{{ template "devsh.body" . }}'
        templates:
          - /etc/alertmanager/config/*.tmpl
      templateFiles:
        devsh.tmpl: |
          {{ define "devsh.title" -}}
          [{{ .Status | toUpper }}][{{ if .CommonLabels.severity }}{{ .CommonLabels.severity | toUpper }}{{ else }}UNKNOWN{{ end }}] {{ .CommonLabels.alertname }}
          {{- end }}
          {{ define "devsh.body" -}}
          *Cluster:* {{ if .CommonLabels.cluster }}{{ .CommonLabels.cluster }}{{ else }}prod{{ end }}
          *Namespace:* {{ if .CommonLabels.namespace }}{{ .CommonLabels.namespace }}{{ else }}n/a{{ end }}
          *Name:* {{ if .CommonLabels.pod }}{{ .CommonLabels.pod }}{{ else if .CommonLabels.deployment }}{{ .CommonLabels.deployment }}{{ else if .CommonLabels.job }}{{ .CommonLabels.job }}{{ else }}n/a{{ end }}
          *Summary:* {{ if .CommonAnnotations.summary }}{{ .CommonAnnotations.summary }}{{ else }}n/a{{ end }}
          *Description:* {{ if .CommonAnnotations.description }}{{ .CommonAnnotations.description }}{{ else }}n/a{{ end }}
          {{- if .Alerts.Firing }}
          *Firing:*
          {{- range .Alerts.Firing }}
          - {{ .Labels.alertname }} ({{ if .Labels.severity }}{{ .Labels.severity }}{{ else }}n/a{{ end }}) {{ if .Annotations.summary }}{{ .Annotations.summary }}{{ end }}
          {{- end }}
          {{- end }}
          {{- if .Alerts.Resolved }}
          *Resolved:*
          {{- range .Alerts.Resolved }}
          - {{ .Labels.alertname }}
          {{- end }}
          {{- end }}
          {{- end }}
