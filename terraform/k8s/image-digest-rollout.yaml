apiVersion: v1
kind: ServiceAccount
metadata:
  name: digest-rollout
  namespace: website
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: digest-rollout
  namespace: website
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["devsh-website", "devsh-blog"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: digest-rollout
  namespace: website
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: digest-rollout
subjects:
  - kind: ServiceAccount
    name: digest-rollout
    namespace: website
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: digest-rollout
  namespace: website
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 600
      activeDeadlineSeconds: 300
      template:
        spec:
          priorityClassName: prod-batch-low
          serviceAccountName: digest-rollout
          restartPolicy: Never
          containers:
            - name: digest-rollout
              image: alpine:3.20
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  apk add --no-cache curl jq skopeo kubectl >/dev/null

                  check() {
                    name="$1"
                    image="$2"
                    deploy="$3"
                    desired="$(skopeo inspect --override-os linux "docker://$image" | jq -r '.Digest')"
                    current="$(kubectl -n website get deployment "$deploy" -o json | jq -r --arg k "rollout.devsh.eu/$name" '.spec.template.metadata.annotations[$k] // ""')"
                    if [ "$desired" != "$current" ]; then
                      kubectl -n website patch deployment "$deploy" --type merge -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"rollout.devsh.eu/$name\":\"$desired\"}}}}}"
                      echo "patched $deploy to digest $desired"
                    else
                      echo "no change for $deploy (digest $desired)"
                    fi
                  }

                  check "devsh-website" "ghcr.io/devsh-graphics-programming/www-website:latest" "devsh-website"
                  check "devsh-blog" "ghcr.io/devsh-graphics-programming/www-blog:latest" "devsh-blog"
