apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: custom-alerts
  namespace: monitoring
spec:
  groups:
    - name: devsh-critical
      rules:
        - alert: NodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 5m
          labels:
            severity: critical
            team: devops
          annotations:
            summary: Node not ready
            description: Node {{ $labels.node }} is NotReady for more than 5 minutes.
        - alert: NodeDiskPressure
          expr: (100 - (node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs",mountpoint="/"} * 100 / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs",mountpoint="/"})) >= 90
          for: 5m
          labels:
            severity: critical
            team: devops
          annotations:
            summary: Node disk usage >= 90%
            description: Disk usage on {{ $labels.instance }} is above 90% for 5 minutes.
        - alert: CoreDNSDown
          expr: sum(up{job="kube-dns"} == 0) > 0
          for: 2m
          labels:
            severity: critical
            team: devops
          annotations:
            summary: CoreDNS down
            description: CoreDNS endpoints are not responding.
        - alert: ControlPlaneDown
          expr: sum(up{job=~"apiserver|kube-controller-manager|kube-scheduler"} == 0) > 0
          for: 5m
          labels:
            severity: critical
            team: devops
          annotations:
            summary: Control plane component down
            description: One of the control plane components is down for over 5 minutes.
        - alert: PersistentVolumeFull
          expr: (kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes) * 100 < 10
          for: 10m
          labels:
            severity: critical
            team: devops
          annotations:
            summary: Volume capacity below 10%
            description: Volume {{ $labels.persistentvolumeclaim }} usage above 90% for 10 minutes.
        - alert: FluxKustomizationFailed
          expr: gotk_reconcile_condition{type="Ready",status="False",exported_namespace="flux-system"} == 1
          for: 10m
          labels:
            severity: critical
            team: devops
          annotations:
            summary: Flux reconciliation failed
            description: Flux resource {{ $labels.name }} in namespace {{ $labels.exported_namespace }} is not Ready.
        - alert: RocketWorkspaceReadOnlyRisk
          expr: rocket_workspace_airgapped_remaining_days{node="prod-rocket-01"} >= 0 and rocket_workspace_airgapped_remaining_days{node="prod-rocket-01"} <= 7
          for: 5m
          labels:
            severity: critical
            team: devops
          annotations:
            summary: Rocket.Chat read-only risk
            description: Rocket.Chat reports air-gapped read-only risk. Remaining days is {{ $value }}.
        - alert: RocketStatsTokenMissing
          expr: rocket_workspace_stats_token_present{node="prod-rocket-01"} == 0
          for: 10m
          labels:
            severity: critical
            team: devops
          annotations:
            summary: Rocket.Chat stats token missing
            description: Rocket.Chat does not have a stats token in MongoDB. The supported self-managed path may regress to read-only mode.
        - alert: RocketAttachmentProtectionFailed
          expr: rocket_synthetic_attachment_unauth_denied{node="prod-rocket-01"} == 0
          for: 10m
          labels:
            severity: critical
            team: devops
          annotations:
            summary: Rocket.Chat attachment protection failed
            description: Rocket.Chat synthetic check could read an attachment without an authenticated session or could not verify the denial.
    - name: devsh-warning
      rules:
        - alert: CrashLoopBackOff
          expr: rate(kube_pod_container_status_restarts_total[10m]) > 3
          for: 10m
          labels:
            severity: warning
            team: devops
          annotations:
            summary: Container crash looping
            description: Container {{ $labels.container }} in pod {{ $labels.pod }} is restarting frequently.
        - alert: DeploymentUnavailable
          expr: (kube_deployment_status_replicas_available < kube_deployment_spec_replicas) and (kube_deployment_spec_replicas > 0)
          for: 10m
          labels:
            severity: warning
            team: devops
          annotations:
            summary: Deployment unavailable
            description: Deployment {{ $labels.deployment }} has unavailable replicas.
        - alert: FluxStalled
          expr: gotk_reconcile_condition{type="Stalled",status="True",exported_namespace="flux-system"} == 1
          for: 15m
          labels:
            severity: warning
            team: devops
          annotations:
            summary: Flux reconciliation stalled
            description: Flux resource {{ $labels.name }} is stalled for more than 15 minutes.
        - alert: JenkinsMetricsDown
          expr: up{job="devsh-jenkins-app"} == 0
          for: 5m
          labels:
            severity: warning
            team: devops
          annotations:
            summary: Jenkins metrics scrape down
            description: Central Prometheus cannot scrape Jenkins application metrics for more than 5 minutes.
        - alert: RocketWorkspaceHealthcheckFailed
          expr: rocket_workspace_health_success{node="prod-rocket-01"} == 0
          for: 10m
          labels:
            severity: warning
            team: devops
          annotations:
            summary: Rocket.Chat workspace healthcheck failed
            description: Rocket.Chat workspace policy healthcheck is failing on prod-rocket-01.
        - alert: RocketWorkspaceHealthcheckStale
          expr: absent(rocket_workspace_health_last_run_timestamp_seconds{node="prod-rocket-01"}) or time() - rocket_workspace_health_last_run_timestamp_seconds{node="prod-rocket-01"} > 900
          for: 5m
          labels:
            severity: warning
            team: devops
          annotations:
            summary: Rocket.Chat workspace healthcheck stale
            description: Rocket.Chat workspace health metrics have not refreshed for more than 15 minutes.
        - alert: RocketSyntheticCheckFailed
          expr: rocket_synthetic_success{node="prod-rocket-01"} == 0
          for: 10m
          labels:
            severity: warning
            team: devops
          annotations:
            summary: Rocket.Chat synthetic check failed
            description: Rocket.Chat API synthetic login, message, or attachment check is failing.
        - alert: RocketSyntheticCheckStale
          expr: absent(rocket_synthetic_last_run_timestamp_seconds{node="prod-rocket-01"}) or time() - rocket_synthetic_last_run_timestamp_seconds{node="prod-rocket-01"} > 1200
          for: 5m
          labels:
            severity: warning
            team: devops
          annotations:
            summary: Rocket.Chat synthetic check stale
            description: Rocket.Chat synthetic metrics have not refreshed for more than 20 minutes.
        - alert: JenkinsDataVolumeUsageHigh
          expr: (1 - (node_filesystem_avail_bytes{job="node-exporter",mountpoint="/mnt/data",fstype!~"tmpfs|ramfs"} / node_filesystem_size_bytes{job="node-exporter",mountpoint="/mnt/data",fstype!~"tmpfs|ramfs"})) * 100 >= 80
          for: 15m
          labels:
            severity: warning
            team: devops
          annotations:
            summary: Jenkins data volume usage >= 80%
            description: Jenkins data volume on {{ $labels.instance }} is above 80% for 15 minutes.
        - alert: JenkinsDataVolumeUsageCritical
          expr: (1 - (node_filesystem_avail_bytes{job="node-exporter",mountpoint="/mnt/data",fstype!~"tmpfs|ramfs"} / node_filesystem_size_bytes{job="node-exporter",mountpoint="/mnt/data",fstype!~"tmpfs|ramfs"})) * 100 >= 90
          for: 5m
          labels:
            severity: critical
            team: devops
          annotations:
            summary: Jenkins data volume usage >= 90%
            description: Jenkins data volume on {{ $labels.instance }} is above 90% for 5 minutes.
        - alert: RestartStorm
          expr: rate(kube_pod_container_status_restarts_total[10m]) > 5
          for: 10m
          labels:
            severity: warning
            team: devops
          annotations:
            summary: High restart rate
            description: Pod {{ $labels.pod }} is restarting excessively.
        - alert: HpaMaxedOut
          expr: (kube_hpa_status_current_replicas == kube_hpa_spec_max_replicas) and (kube_hpa_spec_max_replicas > 1)
          for: 15m
          labels:
            severity: warning
            team: devops
          annotations:
            summary: HPA at maximum replicas
            description: HPA {{ $labels.hpa }} reached its max replicas for more than 15 minutes.
