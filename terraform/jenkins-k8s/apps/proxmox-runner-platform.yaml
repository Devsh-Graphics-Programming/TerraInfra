apiVersion: v1
kind: ConfigMap
metadata:
  name: proxmox-runner-platform
  namespace: jenkins
data:
  inventory.json: |
    {
      "version": 3,
      "defaults": {
        "backend": "proxmox",
        "clone_mode": "linked",
        "lease_ttl_minutes": 120,
        "release_on_failure": true,
        "destroy_after_job": true,
        "api_credentials": {
          "token_id_env": "PROXMOX_RUNNER_API_TOKEN_ID",
          "token_secret_env": "PROXMOX_RUNNER_API_TOKEN_SECRET"
        }
      },
      "proxmox": {
        "hosts": [
          {
            "id": "rtx-node3",
            "node": "node3",
            "enabled": true,
            "priority": 10,
            "labels": [
              "windows",
              "gpu",
              "nvidia",
              "vulkan",
              "runtime-only",
              "gpu-class-rtx-2070"
            ],
            "api": {
              "url": "https://127.0.0.1:18006/api2/json",
              "token_id_env": "PROXMOX_RUNNER_API_TOKEN_ID",
              "token_secret_env": "PROXMOX_RUNNER_API_TOKEN_SECRET",
              "tunnel": {
                "type": "reverse-ssh",
                "server_host": "jenkins.devsh.eu",
                "server_port": 30222,
                "remote_bind_host": "127.0.0.1",
                "remote_bind_port": 18006
              }
            },
            "pools": {
              "templates": "ci-images",
              "runners": "ci-runners"
            },
            "storage": {
              "runtime": "local-lvm",
              "iso": "local"
            },
            "network": {
              "bridge": "vmbr0",
              "vlan_tag": 69,
              "jenkins_host_alias_ip": "10.254.254.254"
            },
            "git_object_cache": {
              "api_url": "http://10.254.254.254:18082",
              "git_base_url": "git://10.254.254.254:9418",
              "git_client_url": "http://10.254.254.254:18081/MinGit.zip",
              "git_client_sha256": "04f937e1f0918b17b9be6f2294cb2bb66e96e1d9832d1c298e2de088a1d0e668",
              "stores": [
                {
                  "id": "nabla-media-public",
                  "repo": "nabla-media-public.git",
                  "scope": "public",
                  "description": "Shared Nabla examples media object store"
                },
                {
                  "id": "nabla-ci-public",
                  "repo": "nabla-ci-public.git",
                  "scope": "public",
                  "description": "Nabla CI public reference data"
                },
                {
                  "id": "ditt-reference-scenes",
                  "repo": "ditt-reference-scenes.git",
                  "scope": "private",
                  "description": "DITT private scene data"
                },
                {
                  "id": "ditt-reference-renders",
                  "repo": "ditt-reference-renders.git",
                  "scope": "private",
                  "description": "DITT private reference renders"
                }
              ]
            },
            "vmid_ranges": {
              "runner": {
                "start": 2000,
                "end": 2099
              }
            },
            "smoke": {
              "source_vmid": 9910,
              "clone_vmid": 2910
            },
            "runtime_profile": {
              "os": "windows-server",
              "mode": "runtime-only",
              "components": [
                "nvidia-driver",
                "vc-redist-x64",
                "java-runtime",
                "git-client",
                "vulkan-runtime"
              ]
            },
            "gpu_devices": [
              {
                "id": "rtx-2070-0",
                "vendor": "nvidia",
                "pci_host": "0000:01:00.0",
                "exclusive": true,
                "labels": [
                  "gpu",
                  "nvidia",
                  "gpu-class-rtx-2070"
                ]
              }
            ]
          }
        ]
      },
      "templates": [
        {
          "id": "windows-base-stable",
          "channel": "windows-base/stable",
          "builder": "proxmox-iso",
          "guest_os": "windows-server",
          "communicator": {
            "type": "winrm"
          },
          "placements": [
            {
              "host": "rtx-node3",
              "vmid": 9001
            }
          ]
        },
        {
          "id": "windows-gpu-nvidia-stable",
          "channel": "windows-gpu-nvidia/stable",
          "builder": "proxmox-clone",
          "parent": "windows-base-stable",
          "guest_os": "windows-server",
          "communicator": {
            "type": "winrm"
          },
          "placements": [
            {
              "host": "rtx-node3",
              "vmid": 9004,
              "gpu_device": "rtx-2070-0"
            }
          ]
        }
      ],
      "runner_classes": [
        {
          "id": "win-gpu-nvidia",
          "labels": [
            "windows",
            "gpu",
            "nvidia",
            "vulkan",
            "runtime-only",
            "gpu-class-rtx-2070"
          ],
          "template": "windows-gpu-nvidia-stable",
          "connection": {
            "type": "winrm"
          },
          "host_selector": {
            "labels": [
              "windows",
              "gpu",
              "nvidia",
              "vulkan",
              "gpu-class-rtx-2070"
            ]
          },
          "runtime": {
            "pool": "runners",
            "storage": "runtime",
            "vmid_range": "runner"
          },
          "warm_pool": {
            "min_ready": 1,
            "max_ready": 1
          },
          "policy": {
            "lease_ttl_minutes": 120,
            "boot_timeout_minutes": 10,
            "health_timeout_minutes": 15,
            "gpu_exclusive": true,
            "release_on_failure": true,
            "destroy_after_job": true
          },
          "health_checks": [
            "guest-agent",
            "network-interfaces",
            "nvidia-smi",
            "vulkan-runtime",
            "workspace-ready",
            "git-client"
          ]
        }
      ],
      "janitor": {
        "backend": "proxmox",
        "pool": "runners",
        "vmid_range": "runner",
        "require_tags": [
          "runnerctl",
          "lifecycle-ephemeral"
        ],
        "stale_lease_after_minutes": 240
      }
    }
