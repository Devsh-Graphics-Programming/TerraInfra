apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-config
  namespace: jenkins
data:
  plugins.txt: |
    configuration-as-code
    job-dsl
    workflow-aggregator
    git
    credentials-binding
    matrix-auth
    plain-credentials
    ssh-credentials
    timestamper
    ws-cleanup
    pipeline-utility-steps
    pipeline-graph-view
    pipeline-stage-view
    file-parameters
    dark-theme
    lockable-resources
    github
    cloudbees-folder
    mailer
    prometheus
    http_request
  jenkins.yaml: |
    jenkins:
      systemMessage: "DevSH Jenkins controller managed by TerraInfra."
      numExecutors: 0
      mode: EXCLUSIVE
      labelString: "controller"
      scmCheckoutRetryCount: 2
      slaveAgentPort: -1
      securityRealm:
        local:
          allowsSignup: false
          users:
            - id: "$${JENKINS_ADMIN_ID}"
              password: "$${JENKINS_ADMIN_PASSWORD}"
            - id: "$${JENKINS_METRICS_ID}"
              password: "$${JENKINS_METRICS_PASSWORD}"
      authorizationStrategy:
        globalMatrix:
          entries:
            - user:
                name: "admin"
                permissions:
                  - Overall/Administer
            - user:
                name: "jenkins-prometheus"
                permissions:
                  - Overall/Read
                  - Metrics/View
            - user:
                name: "github-actions-ditt"
                permissions:
                  - Overall/Read
                  - Job/Read
                  - Job/Build
                  - Job/Cancel

    appearance:
      themeManager:
        disableUserThemes: true
        theme: "dark"

    unclassified:
      globalLibraries:
        libraries:
          - name: "devsh-ci"
            defaultVersion: "env/prod"
            implicit: true
            allowVersionOverride: true
            includeInChangesets: false
            retriever:
              modernSCM:
                scm:
                  git:
                    remote: "https://github.com/Devsh-Graphics-Programming/TerraInfra.git"
      location:
        url: "https://jenkins.devsh.eu/"
        adminAddress: "$${GF_SMTP_FROM_ADDRESS}"
      prometheusConfiguration:
        collectDiskUsage: false
        collectingMetricsPeriodInSeconds: 120
        defaultNamespace: "jenkins"
        path: "prometheus"
        useAuthenticatedEndpoint: true
      mailer:
        charset: "UTF-8"
        replyToAddress: "$${GF_SMTP_FROM_ADDRESS}"
        smtpHost: "$${JENKINS_SMTP_HOST}"
        smtpPort: "$${JENKINS_SMTP_PORT}"
        useSsl: false
        useTls: true
        authentication:
          username: "$${GF_SMTP_USER}"
          password: "$${GF_SMTP_PASSWORD}"

    jobs:
      - script: |
          folder('system') {
            displayName('System')
            description('Controller health checks managed by configuration as code.')
          }

          folder('ci') {
            displayName('CI')
            description('Prepared CI jobs managed by configuration as code.')
          }

          folder('ci/ditt') {
            displayName('DITT')
            description('Static report publish and validation jobs.')
          }

          folder('ci/ditt/real') {
            displayName('Real')
            description('Full DITT scene validation jobs backed by runner-farm Git object caches.')
          }

          folder('ci/ditt/compare') {
            displayName('Compare')
            description('DITT diagnostic comparison jobs backed by runner-farm Git object caches.')
          }

          folder('ci/runners') {
            displayName('Runners')
            description('Generic runtime runner planning jobs managed by configuration as code.')
          }

          folder('ci/runners/smoke') {
            displayName('Smoke')
            description('Live Proxmox runner smoke pipelines managed by configuration as code.')
          }

          folder('ci/runners/examples') {
            displayName('Examples')
            description('Minimal consumer pipelines for ephemeral runtime runners.')
          }

          folder('ci/runners/status') {
            displayName('Status')
            description('Read-only runner platform status and diagnostics.')
          }

          pipelineJob('system/smoke') {
            description('Verifies the controller can load configuration and run a lightweight pipeline.')
            definition {
              cps {
                sandbox()
                script('''pipeline {
                  agent none
                  options {
                    timestamps()
                    buildDiscarder(logRotator(daysToKeepStr: '31', numToKeepStr: '100', artifactDaysToKeepStr: '31', artifactNumToKeepStr: '100'))
                  }
                  stages {
                    stage('Smoke') {
                      steps {
                        echo 'Jenkins configuration loaded.'
                      }
                    }
                  }
                }''')
              }
            }
          }

          pipelineJob('ci/runners/proxmox-plan') {
            description('Validates the generic Proxmox runner class request contract and renders the runtime lifecycle plan in dry-run mode.')
            parameters {
              stringParam('RUNNER_CLASS', 'win-gpu-nvidia', 'Runner class requested by the consumer job.')
              stringParam('REQUIRED_LABELS', 'windows,gpu,nvidia,vulkan,runtime-only,gpu-class-rtx-2070', 'Comma-separated runner capability labels.')
              choiceParam('BACKEND', ['proxmox'], 'Runner backend to plan against.')
              stringParam('TEMPLATE_CHANNEL', 'windows-gpu-nvidia/stable', 'Promoted template channel the allocator should resolve.')
              stringParam('LEASE_TTL_MINUTES', '120', 'Requested lease TTL in minutes.')
              choiceParam('WARM_POOL_MODE', ['preferred', 'required', 'disabled'], 'Whether the allocator should require a warm clone or allow cold clone fallback.')
              booleanParam('DRY_RUN', true, 'Keep execution disabled until Proxmox credentials and inventory are connected.')
            }
            definition {
              cps {
                sandbox()
                script('''pipeline {
                  agent none
                  options {
                    timestamps()
                    buildDiscarder(logRotator(daysToKeepStr: '31', numToKeepStr: '100', artifactDaysToKeepStr: '31', artifactNumToKeepStr: '100'))
                  }
                  stages {
                    stage('Validate runner request') {
                      steps {
                        script {
                          def runnerClass = params.RUNNER_CLASS?.trim()
                          if (!(runnerClass ==~ /[a-z0-9][a-z0-9-]*/)) {
                            error 'RUNNER_CLASS must match [a-z0-9][a-z0-9-]*.'
                          }
                          def rawLabels = params.REQUIRED_LABELS?.trim()
                          if (!rawLabels) {
                            error 'REQUIRED_LABELS is required.'
                          }
                          def labels = rawLabels.split(',').collect { it.trim() }.findAll { it }
                          if (labels.isEmpty()) {
                            error 'At least one runner label is required.'
                          }
                          labels.each { label ->
                            if (!(label ==~ /[a-z0-9][a-z0-9_.-]*/)) {
                              error 'Invalid runner label: ' + label
                            }
                          }
                          if (labels.unique(false).size() != labels.size()) {
                            error 'Runner labels must be unique.'
                          }
                          if (params.BACKEND != 'proxmox') {
                            error 'Unsupported runner backend: ' + params.BACKEND
                          }
                          def channel = params.TEMPLATE_CHANNEL?.trim()
                          if (!(channel ==~ '^[a-z0-9][a-z0-9/._-]*$')) {
                            error 'TEMPLATE_CHANNEL must be a normalized channel name.'
                          }
                          def ttlText = params.LEASE_TTL_MINUTES?.trim()
                          if (!(ttlText ==~ /[0-9]+/)) {
                            error 'LEASE_TTL_MINUTES must be an integer.'
                          }
                          def ttl = ttlText.toInteger()
                          if (ttl < 5 || ttl > 720) {
                            error 'LEASE_TTL_MINUTES must be between 5 and 720.'
                          }
                          if (!(params.WARM_POOL_MODE in ['preferred', 'required', 'disabled'])) {
                            error 'Unsupported WARM_POOL_MODE: ' + params.WARM_POOL_MODE
                          }
                          env.RUNNER_PLAN_CLASS = runnerClass
                          env.RUNNER_PLAN_LABELS = labels.join(',')
                          env.RUNNER_PLAN_TEMPLATE_CHANNEL = channel
                          env.RUNNER_PLAN_TTL = ttl.toString()
                          echo('Runner request validated for class ' + env.RUNNER_PLAN_CLASS + ' and labels ' + env.RUNNER_PLAN_LABELS + '.')
                        }
                      }
                    }
                    stage('Render runtime plan') {
                      steps {
                        script {
                          def labelsJson = env.RUNNER_PLAN_LABELS.split(',').collect { '"' + it + '"' }.join(', ')
                          echo('{ "backend": "' + params.BACKEND + '", "runner_class": "' + env.RUNNER_PLAN_CLASS + '", "labels": [' + labelsJson + '], "template_channel": "' + env.RUNNER_PLAN_TEMPLATE_CHANNEL + '", "lease_ttl_minutes": ' + env.RUNNER_PLAN_TTL + ', "warm_pool_mode": "' + params.WARM_POOL_MODE + '", "hot_path": ["lease", "acquire-warm-clone", "boot", "health", "execute", "destroy"], "cold_path": ["lease", "resolve-template", "clone-template", "boot", "health", "execute", "destroy"], "dry_run": ' + params.DRY_RUN + ' }')
                          if (!params.DRY_RUN) {
                            error 'Real Proxmox execution is not connected yet.'
                          }
                        }
                      }
                    }
                  }
                }''')
              }
            }
          }

          pipelineJob('ci/runners/packer-plan') {
            description('Validates the Packer image build and promotion contract in dry-run mode.')
            parameters {
              choiceParam('IMAGE_FAMILY', ['windows-base', 'windows-gpu-nvidia'], 'Template family to build or promote.')
              choiceParam('BUILDER', ['proxmox-iso', 'proxmox-clone'], 'Packer builder expected for this image family.')
              stringParam('CHANNEL', 'stable', 'Promotion channel to update after a successful build.')
              booleanParam('PROMOTE', false, 'Render the promotion step in the build plan.')
              booleanParam('DRY_RUN', true, 'Keep execution disabled until real Proxmox API credentials are connected.')
            }
            definition {
              cps {
                sandbox()
                script('''pipeline {
                  agent none
                  options {
                    timestamps()
                    buildDiscarder(logRotator(daysToKeepStr: '31', numToKeepStr: '100', artifactDaysToKeepStr: '31', artifactNumToKeepStr: '100'))
                  }
                  stages {
                    stage('Validate image request') {
                      steps {
                        script {
                          def imageFamily = params.IMAGE_FAMILY?.trim()
                          if (!(imageFamily in ['windows-base', 'windows-gpu-nvidia'])) {
                            error 'Unsupported IMAGE_FAMILY: ' + imageFamily
                          }
                          def builder = params.BUILDER?.trim()
                          if (!(builder in ['proxmox-iso', 'proxmox-clone'])) {
                            error 'Unsupported BUILDER: ' + builder
                          }
                          if (imageFamily == 'windows-base' && builder != 'proxmox-iso') {
                            error 'windows-base must use the proxmox-iso builder.'
                          }
                          if (imageFamily == 'windows-gpu-nvidia' && builder != 'proxmox-clone') {
                            error 'windows-gpu-nvidia must use the proxmox-clone builder.'
                          }
                          def channel = params.CHANNEL?.trim()
                          if (!(channel ==~ /[a-z0-9][a-z0-9._-]*/)) {
                            error 'CHANNEL must match [a-z0-9][a-z0-9._-]*.'
                          }
                          env.PACKER_PLAN_IMAGE_FAMILY = imageFamily
                          env.PACKER_PLAN_BUILDER = builder
                          env.PACKER_PLAN_CHANNEL = channel
                          echo('Image request validated for ' + env.PACKER_PLAN_IMAGE_FAMILY + ' on channel ' + env.PACKER_PLAN_CHANNEL + '.')
                        }
                      }
                    }
                    stage('Render build plan') {
                      steps {
                        script {
                          echo('{ "image_family": "' + env.PACKER_PLAN_IMAGE_FAMILY + '", "builder": "' + env.PACKER_PLAN_BUILDER + '", "channel": "' + env.PACKER_PLAN_CHANNEL + '", "phases": ["resolve-source", "build-image", "provision", "sysprep", "convert-template", "smoke-check", "promote-channel"], "promote": ' + params.PROMOTE + ', "dry_run": ' + params.DRY_RUN + ' }')
                          if (!params.DRY_RUN) {
                            error 'Real Packer execution is not connected yet.'
                          }
                        }
                      }
                    }
                  }
                }''')
              }
            }
          }

          pipelineJob('ci/runners/smoke/proxmox-api') {
            description('Runs a read-only Proxmox API smoke check for the configured Proxmox runner inventory.')
            parameters {
              stringParam('HOST_ID', '', 'Optional inventory host id to validate. Empty validates all configured hosts.')
            }
            definition {
              cps {
                sandbox()
                script('''pipeline {
                  agent none
                  options {
                    timestamps()
                    buildDiscarder(logRotator(daysToKeepStr: '31', numToKeepStr: '100', artifactDaysToKeepStr: '31', artifactNumToKeepStr: '100'))
                  }
                  stages {
                    stage('Validate request') {
                      steps {
                        script {
                          def hostId = params.HOST_ID?.trim()
                          if (hostId && !(hostId ==~ /[a-z0-9][a-z0-9-]*/)) {
                            error('HOST_ID must match [a-z0-9][a-z0-9-]* when set.')
                          }
                        }
                      }
                    }
                    stage('Check Proxmox API') {
                      steps {
                        script {
                          def request = [:]
                          def hostId = params.HOST_ID?.trim()
                          if (hostId) {
                            request.host_id = hostId
                          }
                          def response = httpRequest(
                            consoleLogResponseBody: false,
                            contentType: 'APPLICATION_JSON',
                            httpMode: 'POST',
                            requestBody: writeJSON(
                              returnText: true,
                              json: request
                            ),
                            url: 'http://127.0.0.1:18080/api/v1/proxmox/smoke',
                            validResponseCodes: '100:599'
                          )
                          def result = readJSON(text: response.content, returnPojo: true)
                          if (response.status != 200 || result.status != 'ok') {
                            error('Runnerctl API smoke failed: ' + (result.message ?: 'unexpected error'))
                          }
                          echo('Runnerctl Proxmox API smoke passed for hosts: ' + result.hosts.collect { it.host_id }.join(', ') + '.')
                          echo(writeJSON(returnText: true, json: result))
                        }
                      }
                    }
                  }
                }''')
              }
            }
          }

          pipelineJob('ci/runners/smoke/proxmox-warm-clone') {
            description('Creates a scratch template and linked clone through the inventory-selected Proxmox runner host, boots it, stops it, and destroys both resources.')
            parameters {
              stringParam('RUNNER_CLASS', 'win-gpu-nvidia', 'Runner class used to select the Proxmox host and scratch settings.')
              stringParam('REQUIRED_LABELS', 'windows,gpu,nvidia,vulkan,runtime-only,gpu-class-rtx-2070', 'Comma-separated capability labels required by the smoke check.')
            }
            definition {
              cps {
                sandbox()
                script('''pipeline {
                  agent none
                  options {
                    timestamps()
                    disableConcurrentBuilds()
                    buildDiscarder(logRotator(daysToKeepStr: '31', numToKeepStr: '100', artifactDaysToKeepStr: '31', artifactNumToKeepStr: '100'))
                  }
                  stages {
                    stage('Validate request') {
                      steps {
                        script {
                          def runnerClass = params.RUNNER_CLASS?.trim()
                          if (!(runnerClass ==~ /[a-z0-9][a-z0-9-]*/)) {
                            error 'RUNNER_CLASS must match [a-z0-9][a-z0-9-]*.'
                          }
                          def rawLabels = params.REQUIRED_LABELS?.trim()
                          if (!rawLabels) {
                            error 'REQUIRED_LABELS is required.'
                          }
                          def labels = rawLabels.split(',').collect { it.trim() }.findAll { it }
                          if (labels.isEmpty()) {
                            error 'At least one runner label is required.'
                          }
                          labels.each { label ->
                            if (!(label ==~ /[a-z0-9][a-z0-9_.-]*/)) {
                              error 'Invalid runner label: ' + label
                            }
                          }
                          if (labels.unique(false).size() != labels.size()) {
                            error 'Runner labels must be unique.'
                          }
                          env.RUNNER_SMOKE_CLASS = runnerClass
                          env.RUNNER_SMOKE_LABELS = labels.join(',')
                        }
                      }
                    }
                    stage('Run warm smoke') {
                      steps {
                        script {
                          def labels = env.RUNNER_SMOKE_LABELS.split(',').collect { it.trim() }.findAll { it }
                          def response = httpRequest(
                            consoleLogResponseBody: false,
                            contentType: 'APPLICATION_JSON',
                            httpMode: 'POST',
                            requestBody: writeJSON(
                              returnText: true,
                              json: [
                                runner_class: env.RUNNER_SMOKE_CLASS,
                                required_labels: labels
                              ]
                            ),
                            url: 'http://127.0.0.1:18080/api/v1/proxmox/smoke/warm',
                            validResponseCodes: '100:599'
                          )
                          def result = readJSON(text: response.content, returnPojo: true)
                          if (response.status != 200 || result.status != 'ok') {
                            error('Runnerctl warm smoke failed: ' + (result.message ?: 'unexpected error'))
                          }
                          echo('Runnerctl warm smoke passed for host ' + result.host_id + '.')
                          echo(writeJSON(returnText: true, json: result))
                        }
                      }
                    }
                  }
                }''')
              }
            }
          }

          pipelineJob('ci/runners/smoke/proxmox-hot-pool-lifecycle') {
            description('Refills the hot pool, leases an already healthy Windows GPU runner, verifies it, and releases it.')
            parameters {
              stringParam('RUNNER_CLASS', 'win-gpu-nvidia', 'Runner class requested by the consumer job.')
              stringParam('REQUIRED_LABELS', 'windows,gpu,nvidia,vulkan,runtime-only,gpu-class-rtx-2070', 'Comma-separated runner capability labels.')
              stringParam('LEASE_TTL_MINUTES', '30', 'Lease TTL for the hot pool smoke clone.')
            }
            definition {
              cps {
                sandbox()
                script('''pipeline {
                  agent none
                  options {
                    timestamps()
                    disableConcurrentBuilds()
                    buildDiscarder(logRotator(daysToKeepStr: '31', numToKeepStr: '100', artifactDaysToKeepStr: '31', artifactNumToKeepStr: '100'))
                  }
                  stages {
                    stage('Validate runner request') {
                      steps {
                        script {
                          def runnerClass = params.RUNNER_CLASS?.trim()
                          if (!(runnerClass ==~ /[a-z0-9][a-z0-9-]*/)) {
                            error 'RUNNER_CLASS must match [a-z0-9][a-z0-9-]*.'
                          }
                          def rawLabels = params.REQUIRED_LABELS?.trim()
                          if (!rawLabels) {
                            error 'REQUIRED_LABELS is required.'
                          }
                          def labels = rawLabels.split(',').collect { it.trim() }.findAll { it }
                          if (labels.isEmpty()) {
                            error 'At least one runner label is required.'
                          }
                          labels.each { label ->
                            if (!(label ==~ /[a-z0-9][a-z0-9_.-]*/)) {
                              error 'Invalid runner label: ' + label
                            }
                          }
                          if (labels.unique(false).size() != labels.size()) {
                            error 'Runner labels must be unique.'
                          }
                          def ttlText = params.LEASE_TTL_MINUTES?.trim()
                          if (!(ttlText ==~ /[0-9]+/)) {
                            error 'LEASE_TTL_MINUTES must be an integer.'
                          }
                          def ttl = ttlText.toInteger()
                          if (ttl < 5 || ttl > 720) {
                            error 'LEASE_TTL_MINUTES must be between 5 and 720.'
                          }
                          env.HOT_POOL_CLASS = runnerClass
                          env.HOT_POOL_LABELS = labels.join(',')
                          env.HOT_POOL_TTL = ttl.toString()
                          echo('Hot pool request: class=' + env.HOT_POOL_CLASS + ', labels=' + env.HOT_POOL_LABELS + ', lease_ttl_minutes=' + env.HOT_POOL_TTL + '.')
                        }
                      }
                    }
                    stage('Refill hot pool') {
                      steps {
                        script {
                          def response = httpRequest(
                            consoleLogResponseBody: false,
                            contentType: 'APPLICATION_JSON',
                            httpMode: 'POST',
                            requestBody: writeJSON(
                              returnText: true,
                              json: [
                                runner_class: env.HOT_POOL_CLASS,
                                required_labels: env.HOT_POOL_LABELS.split(',').collect { it.trim() }.findAll { it }
                              ]
                            ),
                            url: 'http://127.0.0.1:18080/api/v1/pool/refill',
                            validResponseCodes: '100:599'
                          )
                          def result = readJSON(text: response.content, returnPojo: true)
                          if (response.status != 200 || result.status != 'ok') {
                            error('Hot pool refill failed: ' + (result.message ?: 'unexpected error'))
                          }
                          result.pools.each { pool ->
                            def created = pool.created ?: []
                            echo('Hot pool refill: class=' + pool.runner_class + ', created=' + created.size() + '.')
                            created.each { member ->
                              echo('Hot pool ready: host=' + member.host_id + ', node=' + member.node + ', vmid=' + member.vmid + ', clone=' + member.clone_name + '.')
                            }
                          }
                        }
                      }
                    }
                    stage('Pool status') {
                      steps {
                        script {
                          def response = httpRequest(
                            consoleLogResponseBody: false,
                            httpMode: 'GET',
                            url: 'http://127.0.0.1:18080/api/v1/pool',
                            validResponseCodes: '100:599'
                          )
                          def result = readJSON(text: response.content, returnPojo: true)
                          if (response.status != 200 || result.status != 'ok') {
                            error('Hot pool status failed: ' + (result.message ?: 'unexpected error'))
                          }
                          def pool = result.pools.find { it.runner_class == env.HOT_POOL_CLASS }
                          if (!pool) {
                            error('Hot pool status did not include class ' + env.HOT_POOL_CLASS + '.')
                          }
                          echo('Hot pool counts: ' + writeJSON(returnText: true, json: pool.counts))
                          pool.members.each { member ->
                            echo('Hot pool member: state=' + member.state + ', host=' + member.host_id + ', node=' + member.node + ', vmid=' + member.vmid + ', allocation_mode=' + member.allocation_mode + '.')
                          }
                        }
                      }
                    }
                    stage('Lease hot runner') {
                      steps {
                        script {
                          def response = httpRequest(
                            consoleLogResponseBody: false,
                            contentType: 'APPLICATION_JSON',
                            httpMode: 'POST',
                            requestBody: writeJSON(
                              returnText: true,
                              json: [
                                runner_class: env.HOT_POOL_CLASS,
                                required_labels: env.HOT_POOL_LABELS.split(',').collect { it.trim() }.findAll { it },
                                lease_ttl_minutes: env.HOT_POOL_TTL
                              ]
                            ),
                            url: 'http://127.0.0.1:18080/api/v1/lease',
                            validResponseCodes: '100:599'
                          )
                          def result = readJSON(text: response.content, returnPojo: true)
                          if (response.status != 200 || result.status != 'ok') {
                            error('Hot runner lease failed: ' + (result.message ?: 'unexpected error'))
                          }
                          if (result.allocation_mode != 'hot-pool') {
                            error('Expected hot-pool allocation but got ' + result.allocation_mode + '.')
                          }
                          env.RUNNER_LEASE_ID = result.lease_id
                          echo('Hot lease acquired: host=' + result.host_id + ', node=' + result.node + ', vmid=' + result.vmid + ', clone=' + result.clone_name + ', ready=' + result.ready + '.')
                        }
                      }
                    }
                    stage('Prepare') {
                      steps {
                        script {
                          def response = httpRequest(
                            consoleLogResponseBody: false,
                            contentType: 'APPLICATION_JSON',
                            httpMode: 'POST',
                            requestBody: writeJSON(returnText: true, json: [lease_id: env.RUNNER_LEASE_ID]),
                            url: 'http://127.0.0.1:18080/api/v1/prepare',
                            validResponseCodes: '100:599'
                          )
                          def result = readJSON(text: response.content, returnPojo: true)
                          if (response.status != 200 || result.status != 'ok') {
                            error('Hot runner prepare failed: ' + (result.message ?: 'unexpected error'))
                          }
                          echo('Hot runner prepared: allocation_mode=' + result.allocation_mode + ', host=' + result.host_id + ', node=' + result.node + ', vmid=' + result.vmid + '.')
                          if (result.health_cached) {
                            echo('Prepare used cached hot-pool health, age=' + result.health_cache_age_seconds + 's.')
                          }
                          result.health.each { name, value ->
                            echo('Prepare health ' + name + ': ' + value)
                          }
                        }
                      }
                    }
                    stage('Health') {
                      steps {
                        script {
                          def response = httpRequest(
                            consoleLogResponseBody: false,
                            contentType: 'APPLICATION_JSON',
                            httpMode: 'POST',
                            requestBody: writeJSON(returnText: true, json: [lease_id: env.RUNNER_LEASE_ID]),
                            url: 'http://127.0.0.1:18080/api/v1/health',
                            validResponseCodes: '100:599'
                          )
                          def result = readJSON(text: response.content, returnPojo: true)
                          if (response.status != 200 || result.status != 'ok' || result.overall != 'passed') {
                            error('Hot runner health failed: ' + writeJSON(returnText: true, json: result))
                          }
                          echo('Hot runner health overall: ' + result.overall + '.')
                          if (result.cached) {
                            echo('Health used cached hot-pool result, age=' + result.health_cache_age_seconds + 's.')
                          }
                          result.checks.each { name, value ->
                            echo('Health ' + name + ': ' + value)
                          }
                        }
                      }
                    }
                  }
                  post {
                    always {
                      script {
                        if (env.RUNNER_LEASE_ID) {
                          def response = httpRequest(
                            consoleLogResponseBody: false,
                            contentType: 'APPLICATION_JSON',
                            httpMode: 'POST',
                            requestBody: writeJSON(returnText: true, json: [lease_id: env.RUNNER_LEASE_ID]),
                            url: 'http://127.0.0.1:18080/api/v1/release',
                            validResponseCodes: '100:599'
                          )
                          def result = readJSON(text: response.content, returnPojo: true)
                          echo('Release response HTTP ' + response.status + ': result=' + result.result + ', vmid=' + (result.vmid ?: 'n/a') + ', destroyed_vm=' + (result.destroyed_vm ?: false) + '.')
                        }
                      }
                    }
                  }
                }''')
              }
            }
          }

          pipelineJob('ci/runners/smoke/proxmox-pool-ready') {
            description('Runs the safe janitor, refills the hot pool, and waits until the requested runner class has a ready preconnected runner.')
            parameters {
              stringParam('RUNNER_CLASS', 'win-gpu-nvidia', 'Runner class to keep warm.')
              stringParam('REQUIRED_LABELS', 'windows,gpu,nvidia,vulkan,runtime-only,gpu-class-rtx-2070', 'Comma-separated runner capability labels.')
              stringParam('MIN_READY', '1', 'Minimum ready hot-pool members required before success.')
              stringParam('TIMEOUT_SECONDS', '300', 'Maximum time to wait for pool readiness.')
            }
            definition {
              cps {
                sandbox()
                script('''pipeline {
                  agent none
                  options {
                    timestamps()
                    disableConcurrentBuilds()
                    buildDiscarder(logRotator(daysToKeepStr: '31', numToKeepStr: '100', artifactDaysToKeepStr: '31', artifactNumToKeepStr: '100'))
                  }
                  stages {
                    stage('Validate request') {
                      steps {
                        script {
                          def runnerClass = params.RUNNER_CLASS?.trim()
                          if (!(runnerClass ==~ /[a-z0-9][a-z0-9-]*/)) {
                            error 'RUNNER_CLASS must match [a-z0-9][a-z0-9-]*.'
                          }
                          def rawLabels = params.REQUIRED_LABELS?.trim()
                          if (!rawLabels) {
                            error 'REQUIRED_LABELS is required.'
                          }
                          def labels = rawLabels.split(',').collect { it.trim() }.findAll { it }
                          if (labels.isEmpty()) {
                            error 'At least one runner label is required.'
                          }
                          labels.each { label ->
                            if (!(label ==~ /[a-z0-9][a-z0-9_.-]*/)) {
                              error 'Invalid runner label: ' + label
                            }
                          }
                          if (labels.unique(false).size() != labels.size()) {
                            error 'Runner labels must be unique.'
                          }
                          def minReadyText = params.MIN_READY?.trim()
                          if (!(minReadyText ==~ /[0-9]+/)) {
                            error 'MIN_READY must be an integer.'
                          }
                          def timeoutText = params.TIMEOUT_SECONDS?.trim()
                          if (!(timeoutText ==~ /[0-9]+/)) {
                            error 'TIMEOUT_SECONDS must be an integer.'
                          }
                          env.POOL_READY_CLASS = runnerClass
                          env.POOL_READY_LABELS = labels.join(',')
                          env.POOL_READY_MIN = minReadyText
                          env.POOL_READY_TIMEOUT = timeoutText
                          echo('Pool readiness request: class=' + env.POOL_READY_CLASS + ', labels=' + env.POOL_READY_LABELS + ', min_ready=' + env.POOL_READY_MIN + ', timeout_seconds=' + env.POOL_READY_TIMEOUT + '.')
                        }
                      }
                    }
                    stage('Janitor') {
                      steps {
                        script {
                          runnerJanitor()
                        }
                      }
                    }
                    stage('Refill hot pool') {
                      steps {
                        script {
                          def labels = env.POOL_READY_LABELS.split(',').collect { it.trim() }.findAll { it }
                          runnerPoolRefill(runnerClass: env.POOL_READY_CLASS, labels: labels)
                        }
                      }
                    }
                    stage('Wait ready') {
                      steps {
                        script {
                          def pool = runnerWaitForPoolReady(
                            runnerClass: env.POOL_READY_CLASS,
                            minReady: env.POOL_READY_MIN.toInteger(),
                            timeoutSeconds: env.POOL_READY_TIMEOUT.toInteger(),
                            pollSeconds: 5
                          )
                          echo('Pool is ready: class=' + pool.runner_class + ', counts=' + writeJSON(returnText: true, json: pool.counts ?: [:]) + '.')
                        }
                      }
                    }
                  }
                }''')
              }
            }
          }

          pipelineJob('ci/runners/status/proxmox-pool-status') {
            description('Read-only status view for runner hot pools, active leases, health cache age, Jenkins agent preconnect state, and build provenance timings.')
            parameters {
              stringParam('RUNNER_CLASS_FILTER', '', 'Optional runner class filter. Empty means all runner classes.')
            }
            definition {
              cps {
                sandbox()
                script('''properties([
                  buildDiscarder(logRotator(daysToKeepStr: '31', numToKeepStr: '100', artifactDaysToKeepStr: '31', artifactNumToKeepStr: '100'))
                ])

                timestamps {
                  stage('Read pool') {
                    def filter = params.RUNNER_CLASS_FILTER?.trim()
                    def status = runnerPoolStatus()
                    echo('Runner pool API response time: ' + status.runnerctl_http_ms + ' ms.')
                    def pools = status.pools ?: []
                    if (filter) {
                      pools = pools.findAll { it.runner_class == filter }
                    }
                    if (pools.isEmpty()) {
                      error('No runner pool matched filter ' + (filter ?: '<all>') + '.')
                    }
                    pools.each { pool ->
                      echo('Runner pool: class=' + pool.runner_class + ', warm_pool=' + writeJSON(returnText: true, json: pool.warm_pool ?: [:]) + ', counts=' + writeJSON(returnText: true, json: pool.counts ?: [:]) + '.')
                      (pool.members ?: []).each { member ->
                        def timingText = runnerDescribeTimings(member.timings ?: [:], [mode: 'pool'])
                        echo(
                          'Runner pool member: state=' + member.state +
                          ', pool_member=' + member.pool_member +
                          ', allocation_mode=' + member.allocation_mode +
                          ', host=' + member.host_id +
                          ', node=' + member.node +
                          ', vmid=' + member.vmid +
                          ', has_agent=' + member.has_jenkins_agent +
                          ', age=' + member.age_seconds + 's' +
                          ', expires_in=' + member.expires_in_seconds + 's' +
                          ', health_cache_age=' + member.health_cache_age_seconds + 's' +
                          (timingText ? ', timings: ' + timingText : '') +
                          '.'
                        )
                      }
                    }
                    echo(writeJSON(returnText: true, json: status))
                  }
                }''')
              }
            }
          }

          pipelineJob('ci/runners/smoke/proxmox-consumer-preflight') {
            description('Runs the final consumer-facing preflight: hot-pool readiness, label-based lease, Windows runtime probe, GPU/Vulkan sanity, artifacts, release, and readiness budget.')
            parameters {
              stringParam('RUNNER_CLASS', 'win-gpu-nvidia', 'Runner class to keep warm before the lease.')
              stringParam('REQUIRED_LABELS', 'windows,gpu,nvidia,vulkan,runtime-only,gpu-class-rtx-2070', 'Comma-separated runner capability labels.')
              stringParam('LEASE_TTL_MINUTES', '30', 'Lease TTL for the preflight runner.')
              stringParam('MIN_READY', '1', 'Minimum ready hot-pool members required before leasing.')
              stringParam('MAX_READY_SECONDS', '10', 'Maximum allowed wall time from lease request start to workspace entry.')
            }
            definition {
              cps {
                sandbox()
                script('''properties([
                  disableConcurrentBuilds(),
                  buildDiscarder(logRotator(daysToKeepStr: '31', numToKeepStr: '100', artifactDaysToKeepStr: '31', artifactNumToKeepStr: '100'))
                ])

                def labels = []
                def runnerClass = ''
                def leaseTtlMinutes = 0
                def minReady = 0
                def maxReadySeconds = 0
                def observedReadyMs = null

                timestamps {
                  stage('Validate request') {
                    runnerClass = params.RUNNER_CLASS?.trim()
                    if (!(runnerClass ==~ /[a-z0-9][a-z0-9-]*/)) {
                      error 'RUNNER_CLASS must match [a-z0-9][a-z0-9-]*.'
                    }
                    def rawLabels = params.REQUIRED_LABELS?.trim()
                    if (!rawLabels) {
                      error 'REQUIRED_LABELS is required.'
                    }
                    labels = rawLabels.split(',').collect { it.trim() }.findAll { it }
                    if (labels.isEmpty()) {
                      error 'At least one runner label is required.'
                    }
                    labels.each { label ->
                      if (!(label ==~ /[a-z0-9][a-z0-9_.-]*/)) {
                        error 'Invalid runner label: ' + label
                      }
                    }
                    if (labels.unique(false).size() != labels.size()) {
                      error 'Runner labels must be unique.'
                    }
                    if (!(params.LEASE_TTL_MINUTES?.trim() ==~ /[0-9]+/)) {
                      error 'LEASE_TTL_MINUTES must be an integer.'
                    }
                    leaseTtlMinutes = params.LEASE_TTL_MINUTES.trim().toInteger()
                    if (leaseTtlMinutes < 5 || leaseTtlMinutes > 720) {
                      error 'LEASE_TTL_MINUTES must be between 5 and 720.'
                    }
                    if (!(params.MIN_READY?.trim() ==~ /[0-9]+/)) {
                      error 'MIN_READY must be an integer.'
                    }
                    minReady = params.MIN_READY.trim().toInteger()
                    if (minReady < 1) {
                      error 'MIN_READY must be at least 1.'
                    }
                    if (!(params.MAX_READY_SECONDS?.trim() ==~ /[0-9]+/)) {
                      error 'MAX_READY_SECONDS must be an integer.'
                    }
                    maxReadySeconds = params.MAX_READY_SECONDS.trim().toInteger()
                    if (maxReadySeconds < 1 || maxReadySeconds > 300) {
                      error 'MAX_READY_SECONDS must be between 1 and 300.'
                    }
                    echo('Consumer preflight request: class=' + runnerClass + ', labels=' + labels.join(',') + ', lease_ttl_minutes=' + leaseTtlMinutes + ', max_ready_seconds=' + maxReadySeconds + '.')
                  }

                  stage('Pool ready') {
                    runnerJanitor()
                    runnerPoolRefill(runnerClass: runnerClass, labels: labels)
                    runnerWaitForPoolReady(runnerClass: runnerClass, minReady: minReady, timeoutSeconds: 300, pollSeconds: 5)
                  }

                  withRunner(labels: labels, leaseTtlMinutes: leaseTtlMinutes, maxReadySeconds: maxReadySeconds) { runner ->
                    observedReadyMs = runner.ready_wall_ms
                    stage('Runtime probe') {
                      powershell(
                        '$ErrorActionPreference = "Stop"\\n' +
                        '$java = Get-Command java.exe -ErrorAction SilentlyContinue\\n' +
                        'if (-not $java) { throw "java.exe was not found." }\\n' +
                        '$summary = [pscustomobject]@{\\n' +
                        '  hostname = $env:COMPUTERNAME\\n' +
                        '  user = $env:USERNAME\\n' +
                        '  os = (Get-CimInstance Win32_OperatingSystem).Caption\\n' +
                        '  workspace = (Get-Location).Path\\n' +
                        '  java = $java.Source\\n' +
                        '  vulkan = Test-Path "$env:WINDIR/System32/vulkan-1.dll"\\n' +
                        '  vcRuntime = Test-Path "$env:WINDIR/System32/vcruntime140.dll"\\n' +
                        '}\\n' +
                        '$summary | ConvertTo-Json -Depth 4 | Set-Content -Path runner-preflight.json -Encoding UTF8\\n' +
                        'if (-not $summary.vulkan) { throw "Vulkan runtime is missing." }\\n' +
                        'if (-not $summary.vcRuntime) { throw "VC runtime is missing." }\\n' +
                        'Write-Host "Runtime probe passed."\\n'
                      )
                    }
                    stage('GPU sanity') {
                      powershell(
                        '$ErrorActionPreference = "Stop"\\n' +
                        '$nvidiaSmi = Get-Command nvidia-smi.exe -ErrorAction SilentlyContinue\\n' +
                        'if (-not $nvidiaSmi) {\\n' +
                        '  $nvidiaSmi = Get-ChildItem -Path (Join-Path $env:ProgramFiles "NVIDIA Corporation/NVSMI") -Filter nvidia-smi.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1\\n' +
                        '}\\n' +
                        'if (-not $nvidiaSmi) { throw "nvidia-smi.exe was not found." }\\n' +
                        '$nvidiaSmiPath = if ($nvidiaSmi.Source) { $nvidiaSmi.Source } else { $nvidiaSmi.FullName }\\n' +
                        '& $nvidiaSmiPath | Tee-Object -FilePath gpu.txt\\n' +
                        'if ($LASTEXITCODE -ne 0) { throw "nvidia-smi failed with exit code $LASTEXITCODE." }\\n'
                      )
                    }
                    stage('Artifacts') {
                      archiveArtifacts artifacts: 'runner-preflight.json,gpu.txt', fingerprint: true
                    }
                  }

                  stage('Readiness budget') {
                    if (observedReadyMs == null) {
                      error 'Preflight did not record runner ready wall time.'
                    }
                    def maxReadyMs = maxReadySeconds * 1000
                    echo('Runner ready wall time: ' + observedReadyMs + ' ms; budget: ' + maxReadyMs + ' ms.')
                    if (observedReadyMs > maxReadyMs) {
                      error('Runner ready wall time exceeded budget.')
                    }
                  }
                }''')
              }
            }
          }

          pipelineJob('ci/runners/smoke/proxmox-runtime-lifecycle') {
            description('Exercises the real runtime lifecycle: resolve by labels, lease, boot, guest-agent and GPU health, and release for an inventory-selected runner template.')
            parameters {
              stringParam('RUNNER_CLASS', 'win-gpu-nvidia', 'Runner class requested by the consumer job.')
              stringParam('REQUIRED_LABELS', 'windows,gpu,nvidia,vulkan,runtime-only,gpu-class-rtx-2070', 'Comma-separated runner capability labels.')
              stringParam('LEASE_TTL_MINUTES', '30', 'Lease TTL for the runtime smoke clone.')
            }
            definition {
              cps {
                sandbox()
                script('''pipeline {
                  agent none
                  options {
                    timestamps()
                    disableConcurrentBuilds()
                    buildDiscarder(logRotator(daysToKeepStr: '31', numToKeepStr: '100', artifactDaysToKeepStr: '31', artifactNumToKeepStr: '100'))
                  }
                  stages {
                    stage('Validate runner request') {
                      steps {
                        script {
                          def runnerClass = params.RUNNER_CLASS?.trim()
                          if (!(runnerClass ==~ /[a-z0-9][a-z0-9-]*/)) {
                            error 'RUNNER_CLASS must match [a-z0-9][a-z0-9-]*.'
                          }
                          def rawLabels = params.REQUIRED_LABELS?.trim()
                          if (!rawLabels) {
                            error 'REQUIRED_LABELS is required.'
                          }
                          def labels = rawLabels.split(',').collect { it.trim() }.findAll { it }
                          if (labels.isEmpty()) {
                            error 'At least one runner label is required.'
                          }
                          labels.each { label ->
                            if (!(label ==~ /[a-z0-9][a-z0-9_.-]*/)) {
                              error 'Invalid runner label: ' + label
                            }
                          }
                          if (labels.unique(false).size() != labels.size()) {
                            error 'Runner labels must be unique.'
                          }
                          def ttlText = params.LEASE_TTL_MINUTES?.trim()
                          if (!(ttlText ==~ /[0-9]+/)) {
                            error 'LEASE_TTL_MINUTES must be an integer.'
                          }
                          def ttl = ttlText.toInteger()
                          if (ttl < 5 || ttl > 720) {
                            error 'LEASE_TTL_MINUTES must be between 5 and 720.'
                          }
                          env.RUNTIME_SMOKE_CLASS = runnerClass
                          env.RUNTIME_SMOKE_LABELS = labels.join(',')
                          env.RUNTIME_SMOKE_TTL = ttl.toString()
                          echo('Runner request: class=' + env.RUNTIME_SMOKE_CLASS + ', labels=' + env.RUNTIME_SMOKE_LABELS + ', lease_ttl_minutes=' + env.RUNTIME_SMOKE_TTL + '.')
                        }
                      }
                    }
                    stage('Resolve allocation') {
                      steps {
                        script {
                          def response = httpRequest(
                            consoleLogResponseBody: false,
                            contentType: 'APPLICATION_JSON',
                            httpMode: 'POST',
                            requestBody: writeJSON(
                              returnText: true,
                              json: [
                                runner_class: env.RUNTIME_SMOKE_CLASS,
                                required_labels: env.RUNTIME_SMOKE_LABELS.split(',').collect { it.trim() }.findAll { it },
                                lease_ttl_minutes: env.RUNTIME_SMOKE_TTL
                              ]
                            ),
                            url: 'http://127.0.0.1:18080/api/v1/resolve',
                            validResponseCodes: '100:599'
                          )
                          def result = readJSON(text: response.content, returnPojo: true)
                          if (response.status != 200 || result.status != 'ok') {
                            error('Runner resolve failed: ' + (result.message ?: 'unexpected error'))
                          }
                          def backend = result.backend
                          def range = backend.vmid_range
                          echo('Allocator selected host=' + backend.host_id + ', node=' + backend.node + ', template=' + result.template.channel + ', template_vmid=' + backend.template_vmid + ', storage=' + backend.storage + ', pool=' + backend.pool + ', vmid_range=' + range.start + '-' + range.end + '.')
                          echo('Health checks requested: ' + result.health_checks.join(', ') + '.')
                        }
                      }
                    }
                    stage('Lease') {
                      steps {
                        script {
                          def response = httpRequest(
                            consoleLogResponseBody: false,
                            contentType: 'APPLICATION_JSON',
                            httpMode: 'POST',
                            requestBody: writeJSON(
                              returnText: true,
                              json: [
                                runner_class: env.RUNTIME_SMOKE_CLASS,
                                required_labels: env.RUNTIME_SMOKE_LABELS.split(',').collect { it.trim() }.findAll { it },
                                lease_ttl_minutes: env.RUNTIME_SMOKE_TTL
                              ]
                            ),
                            url: 'http://127.0.0.1:18080/api/v1/lease',
                            validResponseCodes: '100:599'
                          )
                          def result = readJSON(text: response.content, returnPojo: true)
                          if (response.status != 200 || result.status != 'ok') {
                            error('Runner lease failed: ' + (result.message ?: 'unexpected error'))
                          }
                          env.RUNNER_LEASE_ID = result.lease_id
                          echo('Lease acquired: allocation_mode=' + result.allocation_mode + ', host=' + result.host_id + ', node=' + result.node + ', vmid=' + result.vmid + ', clone=' + result.clone_name + ', ready=' + result.ready + '.')
                        }
                      }
                    }
                    stage('Prepare') {
                      steps {
                        script {
                          def response = httpRequest(
                            consoleLogResponseBody: false,
                            contentType: 'APPLICATION_JSON',
                            httpMode: 'POST',
                            requestBody: writeJSON(returnText: true, json: [lease_id: env.RUNNER_LEASE_ID]),
                            url: 'http://127.0.0.1:18080/api/v1/prepare',
                            validResponseCodes: '100:599'
                          )
                          def result = readJSON(text: response.content, returnPojo: true)
                          if (response.status != 200 || result.status != 'ok') {
                            error('Runner prepare failed: ' + (result.message ?: 'unexpected error'))
                          }
                          echo('Runner prepared: allocation_mode=' + result.allocation_mode + ', host=' + result.host_id + ', node=' + result.node + ', vmid=' + result.vmid + '.')
                          result.health.each { name, value ->
                            echo('Prepare health ' + name + ': ' + value)
                          }
                          echo(writeJSON(returnText: true, json: result))
                        }
                      }
                    }
                    stage('Health') {
                      steps {
                        script {
                          def response = httpRequest(
                            consoleLogResponseBody: false,
                            contentType: 'APPLICATION_JSON',
                            httpMode: 'POST',
                            requestBody: writeJSON(returnText: true, json: [lease_id: env.RUNNER_LEASE_ID]),
                            url: 'http://127.0.0.1:18080/api/v1/health',
                            validResponseCodes: '100:599'
                          )
                          def result = readJSON(text: response.content, returnPojo: true)
                          if (response.status != 200 || result.status != 'ok' || result.overall != 'passed') {
                            error('Runner health failed: ' + writeJSON(returnText: true, json: result))
                          }
                          echo('Runner health overall: ' + result.overall + '.')
                          result.checks.each { name, value ->
                            echo('Health ' + name + ': ' + value)
                          }
                          echo(writeJSON(returnText: true, json: result))
                        }
                      }
                    }
                  }
                  post {
                    always {
                      script {
                        if (env.RUNNER_LEASE_ID) {
                          def response = httpRequest(
                            consoleLogResponseBody: false,
                            contentType: 'APPLICATION_JSON',
                            httpMode: 'POST',
                            requestBody: writeJSON(returnText: true, json: [lease_id: env.RUNNER_LEASE_ID]),
                            url: 'http://127.0.0.1:18080/api/v1/release',
                            validResponseCodes: '100:599'
                          )
                          def result = readJSON(text: response.content, returnPojo: true)
                          echo('Release response HTTP ' + response.status + ': result=' + result.result + ', vmid=' + (result.vmid ?: 'n/a') + ', destroyed_vm=' + (result.destroyed_vm ?: false) + '.')
                        }
                      }
                    }
                  }
                }''')
              }
            }
          }

          pipelineJob('ci/runners/examples/windows-gpu-hello') {
