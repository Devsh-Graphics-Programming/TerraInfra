apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-config
  namespace: jenkins
data:
  plugins.txt: |
    configuration-as-code
    job-dsl
    workflow-aggregator
    git
    credentials-binding
    matrix-auth
    plain-credentials
    ssh-credentials
    timestamper
    ws-cleanup
    pipeline-utility-steps
    lockable-resources
    github
    cloudbees-folder
    mailer
    prometheus
    http_request
  jenkins.yaml: |
    jenkins:
      systemMessage: "DevSH Jenkins controller managed by TerraInfra."
      numExecutors: 0
      mode: EXCLUSIVE
      labelString: "controller"
      scmCheckoutRetryCount: 2
      slaveAgentPort: -1
      securityRealm:
        local:
          allowsSignup: false
          users:
            - id: "$${JENKINS_ADMIN_ID}"
              password: "$${JENKINS_ADMIN_PASSWORD}"
            - id: "$${JENKINS_METRICS_ID}"
              password: "$${JENKINS_METRICS_PASSWORD}"
      authorizationStrategy:
        globalMatrix:
          entries:
            - user:
                name: "admin"
                permissions:
                  - Overall/Administer
            - user:
                name: "jenkins-prometheus"
                permissions:
                  - Overall/Read
                  - Metrics/View

    unclassified:
      location:
        url: "https://jenkins.devsh.eu/"
        adminAddress: "$${GF_SMTP_FROM_ADDRESS}"
      prometheusConfiguration:
        collectDiskUsage: false
        collectingMetricsPeriodInSeconds: 120
        defaultNamespace: "jenkins"
        path: "prometheus"
        useAuthenticatedEndpoint: true
      mailer:
        charset: "UTF-8"
        replyToAddress: "$${GF_SMTP_FROM_ADDRESS}"
        smtpHost: "$${JENKINS_SMTP_HOST}"
        smtpPort: "$${JENKINS_SMTP_PORT}"
        useSsl: false
        useTls: true
        authentication:
          username: "$${GF_SMTP_USER}"
          password: "$${GF_SMTP_PASSWORD}"

    jobs:
      - script: |
          folder('system') {
            displayName('System')
            description('Controller health checks managed by configuration as code.')
          }

          folder('ci') {
            displayName('CI')
            description('Prepared CI jobs managed by configuration as code.')
          }

          folder('ci/ditt') {
            displayName('DITT')
            description('Static report publish and validation jobs.')
          }

          folder('ci/runners') {
            displayName('Runners')
            description('Generic runtime runner planning jobs managed by configuration as code.')
          }

          pipelineJob('system/smoke') {
            description('Verifies the controller can load configuration and run a lightweight pipeline.')
            definition {
              cps {
                sandbox()
                script('''pipeline {
                  agent none
                  options {
                    timestamps()
                    buildDiscarder(logRotator(numToKeepStr: '20'))
                  }
                  stages {
                    stage('Smoke') {
                      steps {
                        echo 'Jenkins configuration loaded.'
                      }
                    }
                  }
                }''')
              }
            }
          }

          pipelineJob('ci/runners/proxmox-plan') {
            description('Validates the generic Proxmox runner request contract in dry-run mode.')
            parameters {
              stringParam('REQUIRED_LABELS', 'windows,gpu,nvidia,vulkan', 'Comma-separated runner capability labels.')
              choiceParam('BACKEND', ['proxmox'], 'Runner backend to plan against.')
              stringParam('LEASE_TTL_MINUTES', '120', 'Requested lease TTL in minutes.')
              booleanParam('DRY_RUN', true, 'Keep execution disabled until Proxmox credentials and inventory are connected.')
            }
            definition {
              cps {
                sandbox()
                script('''pipeline {
                  agent none
                  options {
                    timestamps()
                    buildDiscarder(logRotator(numToKeepStr: '20'))
                  }
                  stages {
                    stage('Validate runner request') {
                      steps {
                        script {
                          def rawLabels = params.REQUIRED_LABELS?.trim()
                          if (!rawLabels) {
                            error 'REQUIRED_LABELS is required.'
                          }
                          def labels = rawLabels.split(',').collect { it.trim() }.findAll { it }
                          if (labels.isEmpty()) {
                            error 'At least one runner label is required.'
                          }
                          labels.each { label ->
                            if (!(label ==~ /[a-z0-9][a-z0-9_.-]*/)) {
                              error 'Invalid runner label: ' + label
                            }
                          }
                          if (labels.unique(false).size() != labels.size()) {
                            error 'Runner labels must be unique.'
                          }
                          if (params.BACKEND != 'proxmox') {
                            error 'Unsupported runner backend: ' + params.BACKEND
                          }
                          def ttlText = params.LEASE_TTL_MINUTES?.trim()
                          if (!(ttlText ==~ /[0-9]+/)) {
                            error 'LEASE_TTL_MINUTES must be an integer.'
                          }
                          def ttl = ttlText.toInteger()
                          if (ttl < 5 || ttl > 720) {
                            error 'LEASE_TTL_MINUTES must be between 5 and 720.'
                          }
                          env.RUNNER_PLAN_LABELS = labels.join(',')
                          env.RUNNER_PLAN_TTL = ttl.toString()
                          echo('Runner request validated for labels ' + env.RUNNER_PLAN_LABELS + '.')
                        }
                      }
                    }
                    stage('Render dry-run plan') {
                      steps {
                        script {
                          def labelsJson = env.RUNNER_PLAN_LABELS.split(',').collect { '"' + it + '"' }.join(', ')
                          echo('{ "backend": "' + params.BACKEND + '", "labels": [' + labelsJson + '], "lease_ttl_minutes": ' + env.RUNNER_PLAN_TTL + ', "phases": ["lease", "prepare", "health", "execute", "release"], "dry_run": ' + params.DRY_RUN + ' }')
                          if (!params.DRY_RUN) {
                            error 'Real Proxmox execution is not connected yet.'
                          }
                        }
                      }
                    }
                  }
                }''')
              }
            }
          }

          pipelineJob('ci/ditt/store-smoke') {
            description('Checks the static report store endpoints without requiring Proxmox credentials.')
            parameters {
              stringParam('REPORT_PREFIX', 'ditt/public/', 'Store object prefix to validate.')
              booleanParam('CHECK_PRIVATE_GATE', true, 'Validate that the private report path requires authentication.')
            }
            definition {
              cps {
                sandbox()
                script('''pipeline {
                  agent none
                  options {
                    timestamps()
                    buildDiscarder(logRotator(numToKeepStr: '20'))
                  }
                  stages {
                    stage('Validate parameters') {
                      steps {
                        script {
                          def prefix = params.REPORT_PREFIX?.trim()
                          if (!prefix) {
                            error 'REPORT_PREFIX is required.'
                          }
                          if (prefix.startsWith('/') || prefix.contains('..') || prefix.contains('//')) {
                            error 'REPORT_PREFIX must be a relative object prefix without traversal.'
                          }
                          if (!(prefix.startsWith('ditt/public/') || prefix.startsWith('ditt/private/'))) {
                            error 'REPORT_PREFIX must stay under ditt/public/ or ditt/private/.'
                          }
                          echo('Validated store prefix ' + prefix + '.')
                        }
                      }
                    }
                    stage('Check public store') {
                      steps {
                        script {
                          def response = httpRequest httpMode: 'HEAD', url: 'https://store.devsh.eu/ditt/public/', validResponseCodes: '200:399'
                          echo('Public store responded with HTTP ' + response.status + '.')
                        }
                      }
                    }
                    stage('Check private store gate') {
                      when {
                        expression { return params.CHECK_PRIVATE_GATE }
                      }
                      steps {
                        script {
                          def response = httpRequest httpMode: 'GET', url: 'https://store.devsh.eu/ditt/private/', validResponseCodes: '401'
                          echo('Private store requires authentication. HTTP ' + response.status + '.')
                        }
                      }
                    }
                  }
                }''')
              }
            }
          }

          pipelineJob('ci/ditt/ex40-report-plan') {
            description('Validates EX40 report publish parameters before GPU execution is enabled.')
            parameters {
              stringParam('EX40_ARTIFACT_URL', '', 'HTTPS URL of an EX40 package produced by upstream CI.')
              choiceParam('SCENE_SET', ['public', 'private', 'both'], 'Scene set to run when execution is enabled.')
              stringParam('STORE_PREFIX', 'ditt/public/', 'Destination prefix under store.devsh.eu.')
              booleanParam('PUBLISH_DRY_RUN', true, 'Keep publishing disabled until the runtime backend is connected.')
            }
            definition {
              cps {
                sandbox()
                script('''pipeline {
                  agent none
                  options {
                    timestamps()
                    buildDiscarder(logRotator(numToKeepStr: '20'))
                  }
                  stages {
                    stage('Validate plan') {
                      steps {
                        script {
                          def artifactUrl = params.EX40_ARTIFACT_URL?.trim()
                          if (artifactUrl && !artifactUrl.startsWith('https://')) {
                            error 'EX40_ARTIFACT_URL must be an HTTPS URL.'
                          }
                          def prefix = params.STORE_PREFIX?.trim()
                          if (!prefix) {
                            error 'STORE_PREFIX is required.'
                          }
                          if (prefix.startsWith('/') || prefix.contains('..') || prefix.contains('//')) {
                            error 'STORE_PREFIX must be a relative object prefix without traversal.'
                          }
                          if (!(prefix.startsWith('ditt/public/') || prefix.startsWith('ditt/private/'))) {
                            error 'STORE_PREFIX must stay under ditt/public/ or ditt/private/.'
                          }
                          echo('Report plan validated for ' + params.SCENE_SET + ' scenes and ' + prefix + '.')
                          if (!artifactUrl) {
                            echo 'No EX40 artifact URL was supplied. This run validates configuration only.'
                          }
                          if (params.PUBLISH_DRY_RUN) {
                            echo 'Publishing is in dry-run mode.'
                          }
                        }
                      }
                    }
                  }
                }''')
              }
            }
          }
  sync-admin-user.groovy: |
    import hudson.model.User
    import hudson.security.HudsonPrivateSecurityRealm
    import jenkins.model.Jenkins

    def instance = Jenkins.get()
    def realm = instance.getSecurityRealm()
    if (!(realm instanceof HudsonPrivateSecurityRealm)) {
        throw new IllegalStateException("Expected local Jenkins security realm")
    }

    def syncLocalUser = { String idEnv, String passwordEnv ->
        def userId = System.getenv(idEnv)
        def userPassword = System.getenv(passwordEnv)
        if (!userId?.trim() || !userPassword) {
            throw new IllegalStateException("Jenkins local user environment is missing: " + idEnv)
        }

        def user = User.getById(userId, false)
        if (user == null) {
            user = realm.createAccount(userId, userPassword)
        } else {
            user.addProperty(HudsonPrivateSecurityRealm.Details.fromPlainPassword(userPassword))
        }
        user.save()
    }

    syncLocalUser("JENKINS_ADMIN_ID", "JENKINS_ADMIN_PASSWORD")
    syncLocalUser("JENKINS_METRICS_ID", "JENKINS_METRICS_PASSWORD")
    instance.save()
