apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-config
  namespace: jenkins
data:
  plugins.txt: |
    configuration-as-code
    job-dsl
    workflow-aggregator
    git
    credentials-binding
    matrix-auth
    plain-credentials
    ssh-credentials
    timestamper
    ws-cleanup
    pipeline-utility-steps
    lockable-resources
    github
    cloudbees-folder
    mailer
    prometheus
  jenkins.yaml: |
    jenkins:
      systemMessage: "DevSH Jenkins controller managed by TerraInfra."
      numExecutors: 0
      mode: EXCLUSIVE
      labelString: "controller"
      scmCheckoutRetryCount: 2
      slaveAgentPort: -1
      securityRealm:
        local:
          allowsSignup: false
          users:
            - id: "$${JENKINS_ADMIN_ID}"
              password: "$${JENKINS_ADMIN_PASSWORD}"
            - id: "$${JENKINS_METRICS_ID}"
              password: "$${JENKINS_METRICS_PASSWORD}"
      authorizationStrategy:
        globalMatrix:
          entries:
            - user:
                name: "$${JENKINS_ADMIN_ID}"
                permissions:
                  - Overall/Administer
            - user:
                name: "$${JENKINS_METRICS_ID}"
                permissions:
                  - Overall/Read
                  - Metrics/View

    unclassified:
      location:
        url: "https://jenkins.devsh.eu/"
        adminAddress: "$${GF_SMTP_FROM_ADDRESS}"
      prometheusConfiguration:
        collectDiskUsage: false
        collectingMetricsPeriodInSeconds: 120
        defaultNamespace: "jenkins"
        path: "prometheus"
        useAuthenticatedEndpoint: true
      mailer:
        charset: "UTF-8"
        replyToAddress: "$${GF_SMTP_FROM_ADDRESS}"
        smtpHost: "$${JENKINS_SMTP_HOST}"
        smtpPort: "$${JENKINS_SMTP_PORT}"
        useSsl: false
        useTls: true
        authentication:
          username: "$${GF_SMTP_USER}"
          password: "$${GF_SMTP_PASSWORD}"

    jobs:
      - script: |
          folder('system') {
            displayName('System')
            description('Controller health checks managed by configuration as code.')
          }

          pipelineJob('system/smoke') {
            description('Verifies the controller can load configuration and run a lightweight pipeline.')
            definition {
              cps {
                sandbox()
                script('''pipeline {
                  agent none
                  options {
                    timestamps()
                    buildDiscarder(logRotator(numToKeepStr: '20'))
                  }
                  stages {
                    stage('Smoke') {
                      steps {
                        echo 'Jenkins configuration loaded.'
                      }
                    }
                  }
                }''')
              }
            }
          }
  sync-admin-user.groovy: |
    import hudson.model.User
    import hudson.security.HudsonPrivateSecurityRealm
    import jenkins.model.Jenkins

    def instance = Jenkins.get()
    def realm = instance.getSecurityRealm()
    if (!(realm instanceof HudsonPrivateSecurityRealm)) {
        throw new IllegalStateException("Expected local Jenkins security realm")
    }

    def syncLocalUser = { String idEnv, String passwordEnv ->
        def userId = System.getenv(idEnv)
        def userPassword = System.getenv(passwordEnv)
        if (!userId?.trim() || !userPassword) {
            throw new IllegalStateException("Jenkins local user environment is missing: " + idEnv)
        }

        def user = User.getById(userId, false)
        if (user == null) {
            user = realm.createAccount(userId, userPassword)
        } else {
            user.addProperty(HudsonPrivateSecurityRealm.Details.fromPlainPassword(userPassword))
        }
        user.save()
    }

    syncLocalUser("JENKINS_ADMIN_ID", "JENKINS_ADMIN_PASSWORD")
    syncLocalUser("JENKINS_METRICS_ID", "JENKINS_METRICS_PASSWORD")
    instance.save()
