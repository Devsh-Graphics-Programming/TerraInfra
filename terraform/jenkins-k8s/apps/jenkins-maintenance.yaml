apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-maintenance
  namespace: jenkins
data:
  server.py: |
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer


    PAGE = """<!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Jenkins is restarting</title>
        <style>
          :root { color-scheme: dark; }
          body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #0f141b;
            color: #e8edf3;
            font: 16px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          }
          main {
            width: min(560px, calc(100vw - 32px));
          }
          h1 {
            margin: 0 0 12px;
            font-size: clamp(28px, 5vw, 42px);
            line-height: 1.1;
          }
          p {
            margin: 0 0 16px;
            color: #b8c2cc;
          }
          .status {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
            color: #8bd7a5;
            font-weight: 650;
          }
          .dot {
            width: 10px;
            height: 10px;
            border-radius: 999px;
            background: #2fd36f;
            box-shadow: 0 0 0 6px rgba(47, 211, 111, 0.16);
          }
        </style>
      </head>
      <body>
        <main>
          <h1>Jenkins is restarting</h1>
          <p>The controller is applying configuration or restarting. Refresh in a moment.</p>
          <div class="status"><span class="dot"></span><span>Maintenance window in progress</span></div>
        </main>
      </body>
    </html>
    """


    class Handler(BaseHTTPRequestHandler):
        def do_HEAD(self):
            self.respond(include_body=False)

        def do_GET(self):
            self.respond(include_body=True)

        def respond(self, include_body):
            if self.path == "/healthz":
                body = b"ok\n"
                self.send_response(200)
                self.send_header("Content-Type", "text/plain; charset=utf-8")
                self.send_header("Cache-Control", "no-store")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                if include_body:
                    self.wfile.write(body)
                return
            try:
                status = int(self.headers.get("X-Code", "503"))
            except ValueError:
                status = 503
            status = status if status in {502, 503, 504} else 503
            body = PAGE.encode("utf-8")
            self.send_response(status)
            self.send_header("Content-Type", "text/html; charset=utf-8")
            self.send_header("Cache-Control", "no-store")
            self.send_header("Retry-After", "30")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            if include_body:
                self.wfile.write(body)


    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins-maintenance
  namespace: jenkins
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jenkins-maintenance
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jenkins-maintenance
    spec:
      enableServiceLinks: false
      containers:
        - name: maintenance
          image: docker.io/python:3.12-alpine3.22
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - /opt/maintenance/server.py
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: maintenance
              mountPath: /opt/maintenance
              readOnly: true
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 96Mi
      volumes:
        - name: maintenance
          configMap:
            name: jenkins-maintenance
---
apiVersion: v1
kind: Service
metadata:
  name: jenkins-maintenance
  namespace: jenkins
spec:
  selector:
    app.kubernetes.io/name: jenkins-maintenance
  ports:
    - name: http
      port: 8080
      targetPort: http
