apiVersion: v1
kind: Service
metadata:
  name: jenkins
  namespace: jenkins
spec:
  selector:
    app.kubernetes.io/name: jenkins
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: jenkins
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jenkins
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jenkins
      annotations:
        devsh.eu/config-revision: "2026-04-24-ephemeral-jenkins-runners-v25"
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: prepare-home
          image: docker.io/busybox:1.37
          command:
            - sh
            - -c
            - |
              mkdir -p /var/jenkins_home/init.groovy.d /var/jenkins_home/plugins
              chown -R 1000:1000 /var/jenkins_home
              mkdir -p /var/lib/runnerctl
              chown -R 65532:65532 /var/lib/runnerctl
          volumeMounts:
            - name: home
              mountPath: /var/jenkins_home
            - name: runnerctl-state
              mountPath: /var/lib/runnerctl
          securityContext:
            runAsUser: 0
            runAsGroup: 0
      containers:
        - name: jenkins
          image: docker.io/jenkins/jenkins:lts-jdk21
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: jenkins-admin
            - secretRef:
                name: notification-smtp
          env:
            - name: JAVA_OPTS
              value: -Djenkins.install.runSetupWizard=false
            - name: CASC_JENKINS_CONFIG
              value: /var/jenkins_config/jenkins.yaml
            - name: JENKINS_OPTS
              value: --httpPort=8080
            - name: PROMETHEUS_NAMESPACE
              value: jenkins
            - name: COLLECT_DISK_USAGE
              value: "false"
            - name: COLLECTING_METRICS_PERIOD_IN_SECONDS
              value: "120"
          command:
            - bash
            - -c
          args:
            - |
              set -euo pipefail
              if [[ "${GF_SMTP_HOST:-}" == *:* ]]; then
                export JENKINS_SMTP_HOST="${GF_SMTP_HOST%:*}"
                export JENKINS_SMTP_PORT="${GF_SMTP_HOST##*:}"
              else
                export JENKINS_SMTP_HOST="${GF_SMTP_HOST:-mail.devsh.eu}"
                export JENKINS_SMTP_PORT="587"
              fi
              jenkins-plugin-cli --plugin-file /var/jenkins_config/plugins.txt --plugin-download-directory /var/jenkins_home/plugins
              exec /usr/local/bin/jenkins.sh
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: home
              mountPath: /var/jenkins_home
            - name: config
              mountPath: /var/jenkins_config
              readOnly: true
            - name: runner-platform
              mountPath: /var/jenkins_runner
              readOnly: true
            - name: config
              mountPath: /var/jenkins_home/init.groovy.d/10-sync-admin-user.groovy
              subPath: sync-admin-user.groovy
              readOnly: true
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 2Gi
        - name: proxmox-runnerctl
          image: docker.io/python:3.12-alpine3.22
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: proxmox-runner-api
            - secretRef:
                name: jenkins-admin
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: RUNNERCTL_INVENTORY_PATH
              value: /var/jenkins_runner/inventory.json
            - name: RUNNERCTL_LEASE_STORE_PATH
              value: /var/lib/runnerctl/leases.json
            - name: RUNNERCTL_LISTEN_HOST
              value: 127.0.0.1
            - name: RUNNERCTL_LISTEN_PORT
              value: "18080"
            - name: RUNNERCTL_HOT_POOL_ENABLED
              value: "true"
            - name: RUNNERCTL_HOT_POOL_RECONCILE_INTERVAL_SECONDS
              value: "60"
            - name: RUNNERCTL_HOT_POOL_INITIAL_DELAY_SECONDS
              value: "10"
            - name: RUNNERCTL_HOT_POOL_HEALTH_CACHE_TTL_SECONDS
              value: "7200"
            - name: RUNNERCTL_HOT_POOL_PRECONNECT_AGENTS
              value: "true"
            - name: RUNNERCTL_PRECONNECTED_AGENT_WAIT_SECONDS
              value: "8"
            - name: RUNNERCTL_JENKINS_INTERNAL_URL
              value: http://127.0.0.1:8080
            - name: RUNNERCTL_JENKINS_PUBLIC_URL
              value: https://jenkins.devsh.eu
            - name: RUNNERCTL_JENKINS_AGENT_WORK_DIR
              value: 'C:\runner\jenkins-agent'
            - name: RUNNERCTL_JENKINS_AGENT_TIMEOUT_SECONDS
              value: "120"
          command:
            - python3
            - /opt/runnerctl/runnerctl_api.py
          readinessProbe:
            exec:
              command:
                - python3
                - -c
                - |
                  import urllib.request
                  urllib.request.urlopen("http://127.0.0.1:18080/healthz", timeout=5).read()
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - |
                  import urllib.request
                  urllib.request.urlopen("http://127.0.0.1:18080/healthz", timeout=5).read()
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: runner-platform
              mountPath: /var/jenkins_runner
              readOnly: true
            - name: proxmox-runnerctl
              mountPath: /opt/runnerctl
              readOnly: true
            - name: runnerctl-state
              mountPath: /var/lib/runnerctl
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
        - name: proxmox-tunnel-server
          image: quay.io/panubo/sshd:1.9.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
          args:
            - |
              id -u tunnel >/dev/null 2>&1 || adduser -D -H -u 10001 tunnel
              echo "tunnel:$(dd if=/dev/urandom bs=18 count=1 2>/dev/null | base64)" | chpasswd
              chmod 0755 /var/run/proxmox-tunnel-runtime
              install -d -m 0755 /run/sshd /var/run/proxmox-tunnel-runtime/keys
              install -d -m 0755 /var/run/proxmox-tunnel-runtime/auth
              cp /var/run/proxmox-tunnel-secrets/ssh_host_ed25519_key /var/run/proxmox-tunnel-runtime/keys/ssh_host_ed25519_key
              cp /var/run/proxmox-tunnel-secrets/ssh_host_ed25519_key.pub /var/run/proxmox-tunnel-runtime/keys/ssh_host_ed25519_key.pub
              cp /var/run/proxmox-tunnel-secrets/authorized_keys /var/run/proxmox-tunnel-runtime/auth/tunnel
              chmod 0600 /var/run/proxmox-tunnel-runtime/keys/ssh_host_ed25519_key
              chmod 0644 /var/run/proxmox-tunnel-runtime/auth/tunnel
              exec /usr/sbin/sshd -D -e -f /var/run/proxmox-tunnel-config/sshd_config
          ports:
            - name: proxmox-tunnel
              containerPort: 2222
              hostPort: 30222
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: proxmox-tunnel
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: proxmox-tunnel
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: proxmox-tunnel-config
              mountPath: /var/run/proxmox-tunnel-config
              readOnly: true
            - name: proxmox-tunnel-ssh
              mountPath: /var/run/proxmox-tunnel-secrets
              readOnly: true
            - name: proxmox-tunnel-runtime
              mountPath: /var/run/proxmox-tunnel-runtime
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - SETGID
                - SETUID
                - SYS_CHROOT
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: home
          hostPath:
            path: /mnt/data/jenkins/home
            type: DirectoryOrCreate
        - name: config
          configMap:
            name: jenkins-config
        - name: runner-platform
          configMap:
            name: proxmox-runner-platform
        - name: proxmox-tunnel-config
          configMap:
            name: proxmox-tunnel-server
        - name: proxmox-tunnel-ssh
          secret:
            secretName: proxmox-tunnel-ssh
            defaultMode: 0400
        - name: proxmox-tunnel-runtime
          emptyDir: {}
        - name: runnerctl-state
          hostPath:
            path: /mnt/data/jenkins/runnerctl
            type: DirectoryOrCreate
        - name: proxmox-runnerctl
          configMap:
            name: proxmox-runnerctl
