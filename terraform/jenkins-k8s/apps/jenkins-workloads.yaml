apiVersion: v1
kind: Service
metadata:
  name: jenkins
  namespace: jenkins
spec:
  selector:
    app.kubernetes.io/name: jenkins
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: jenkins
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jenkins
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jenkins
      annotations:
        devsh.eu/config-revision: "2026-04-22-jenkins-metrics-auth-v2"
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: prepare-home
          image: docker.io/busybox:1.37
          command:
            - sh
            - -c
            - |
              mkdir -p /var/jenkins_home/init.groovy.d /var/jenkins_home/plugins
              chown -R 1000:1000 /var/jenkins_home
          volumeMounts:
            - name: home
              mountPath: /var/jenkins_home
          securityContext:
            runAsUser: 0
            runAsGroup: 0
      containers:
        - name: jenkins
          image: docker.io/jenkins/jenkins:lts-jdk21
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: jenkins-admin
            - secretRef:
                name: notification-smtp
          env:
            - name: JAVA_OPTS
              value: -Djenkins.install.runSetupWizard=false
            - name: CASC_JENKINS_CONFIG
              value: /var/jenkins_config/jenkins.yaml
            - name: JENKINS_OPTS
              value: --httpPort=8080
            - name: PROMETHEUS_NAMESPACE
              value: jenkins
            - name: COLLECT_DISK_USAGE
              value: "false"
            - name: COLLECTING_METRICS_PERIOD_IN_SECONDS
              value: "120"
          command:
            - bash
            - -c
          args:
            - |
              set -euo pipefail
              if [[ "${GF_SMTP_HOST:-}" == *:* ]]; then
                export JENKINS_SMTP_HOST="${GF_SMTP_HOST%:*}"
                export JENKINS_SMTP_PORT="${GF_SMTP_HOST##*:}"
              else
                export JENKINS_SMTP_HOST="${GF_SMTP_HOST:-mail.devsh.eu}"
                export JENKINS_SMTP_PORT="587"
              fi
              jenkins-plugin-cli --plugin-file /var/jenkins_config/plugins.txt --plugin-download-directory /var/jenkins_home/plugins
              exec /usr/local/bin/jenkins.sh
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: home
              mountPath: /var/jenkins_home
            - name: config
              mountPath: /var/jenkins_config
              readOnly: true
            - name: config
              mountPath: /var/jenkins_home/init.groovy.d/10-sync-admin-user.groovy
              subPath: sync-admin-user.groovy
              readOnly: true
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: home
          hostPath:
            path: /mnt/data/jenkins/home
            type: DirectoryOrCreate
        - name: config
          configMap:
            name: jenkins-config
