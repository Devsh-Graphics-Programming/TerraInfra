apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mongodb-community-operator
  namespace: rocket
spec:
  interval: 10m
  chart:
    spec:
      chart: community-operator
      version: 0.13.0
      sourceRef:
        kind: HelmRepository
        name: mongodb
        namespace: flux-system
      interval: 1h
  releaseName: mongodb-community-operator
  targetNamespace: rocket
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    community-operator-crds:
      enabled: false
    operator:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
    registry:
      pullPolicy: IfNotPresent
