apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../k8s/infra/jetstack-repo.yaml
  - ../../k8s/infra/ingress-repo.yaml
  - mongodb-repo.yaml
  - rocketchat-repo.yaml
  - mongodbcommunity-crd.yaml
  - ../../k8s/infra/cert-manager-helmrelease.yaml
  - ../../k8s/infra/ingress-helmrelease.yaml
  - mongodb-operator-helmrelease.yaml
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: ingress-nginx
      namespace: infra
    patch: |-
      - op: add
        path: /spec/values/controller/service
        value:
          externalTrafficPolicy: Local
