apiVersion: v1
kind: ConfigMap
metadata:
  name: rocket-healthcheck-scripts
  namespace: rocket
data:
  rocket-health-exporter.py: |
    #!/usr/bin/env python3
    import json
    import os
    import threading
    import time
    import urllib.error
    import urllib.parse
    import urllib.request
    import uuid
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer


    LAST_SUCCESS = 0
    CACHE = {"deadline": 0.0, "body": ""}
    LOCK = threading.Lock()


    class CheckError(RuntimeError):
        pass


    def env(name: str, default: str = "") -> str:
        return os.environ.get(name, default).strip()


    def required_env(name: str) -> str:
        value = env(name)
        if not value:
            raise CheckError(f"missing environment variable: {name}")
        return value


    def parse_body(response) -> dict:
        raw = response.read().decode("utf-8", errors="replace")
        if not raw:
            return {}
        try:
            return json.loads(raw)
        except json.JSONDecodeError:
            return {"raw": raw}


    def request(method: str, path_or_url: str, data=None, headers=None, timeout=30):
        base_url = required_env("ROCKET_URL").rstrip("/")
        url = path_or_url if path_or_url.startswith("http") else f"{base_url}{path_or_url}"
        body = None
        request_headers = dict(headers or {})
        if isinstance(data, dict):
            body = json.dumps(data).encode("utf-8")
            request_headers.setdefault("Content-Type", "application/json")
        elif data is not None:
            body = data

        req = urllib.request.Request(url, data=body, headers=request_headers, method=method)
        try:
            with urllib.request.urlopen(req, timeout=timeout) as response:
                return response.status, parse_body(response), response.headers
        except urllib.error.HTTPError as exc:
            try:
                payload = parse_body(exc)
            except Exception:
                payload = {"error": str(exc)}
            return exc.code, payload, exc.headers


    def api(headers: dict, method: str, path: str, data=None, ok=(200,)):
        status, payload, _ = request(method, path, data=data, headers=headers)
        if status in ok and payload.get("success", True) is not False:
            return payload
        error = payload.get("error") or payload.get("errorType") or payload.get("message") or str(payload)
        raise CheckError(f"{method} {path} failed: {error}")


    def login(metrics: dict) -> dict:
        status, payload, _ = request(
            "POST",
            "/api/v1/login",
            data={"user": required_env("ADMIN_USERNAME"), "password": required_env("ADMIN_PASS")},
        )
        if status != 200 or payload.get("status") != "success":
            error = payload.get("error") or payload.get("message") or str(payload)
            raise CheckError(f"login failed: {error}")
        metrics["rocket_synthetic_login_success"] = 1
        data = payload["data"]
        return {"X-User-Id": data["userId"], "X-Auth-Token": data["authToken"]}


    def bool_metric(value) -> int:
        if value is True:
            return 1
        if value is False:
            return 0
        if isinstance(value, str):
            return 1 if value.lower() == "true" else 0
        return 0


    def number_metric(value, fallback=-1) -> float:
        try:
            return float(value)
        except (TypeError, ValueError):
            return float(fallback)


    def setting(headers: dict, setting_id: str):
        payload = api(headers, "GET", f"/api/v1/settings/{urllib.parse.quote(setting_id)}")
        return payload.get("value")


    def check_workspace(headers: dict, metrics: dict) -> None:
        setup_completed = setting(headers, "Show_Setup_Wizard") == "completed"
        cloud_terms = bool_metric(setting(headers, "Cloud_Service_Agree_PrivacyTerms"))
        fingerprint = bool_metric(setting(headers, "Deployment_FingerPrint_Verified"))
        remaining_days = number_metric(setting(headers, "Cloud_Workspace_AirGapped_Restrictions_Remaining_Days"), -1)

        stats = api(headers, "GET", "/api/v1/statistics")
        stats_token = stats.get("statsToken")
        stats_token_present = isinstance(stats_token, str) and len(stats_token) > 0

        license_info = api(headers, "GET", "/api/v1/licenses.info")
        prevented = ((license_info.get("license") or {}).get("preventedActions") or {})
        free_path_allowed = all(
            prevented.get(name) is False
            for name in ("activeUsers", "guestUsers", "roomsPerGuest", "marketplaceApps", "monthlyActiveContacts")
        )

        read_only_risk = remaining_days >= 0 and remaining_days <= 7
        metrics["rocket_workspace_setup_completed"] = 1 if setup_completed else 0
        metrics["rocket_workspace_cloud_terms_agreed"] = cloud_terms
        metrics["rocket_workspace_fingerprint_verified"] = fingerprint
        metrics["rocket_workspace_stats_token_present"] = 1 if stats_token_present else 0
        metrics["rocket_workspace_airgapped_remaining_days"] = remaining_days
        metrics["rocket_workspace_read_only_risk"] = 1 if read_only_risk else 0
        metrics["rocket_workspace_free_path_allowed"] = 1 if free_path_allowed else 0
        metrics["rocket_workspace_health_success"] = 1 if (
            setup_completed
            and cloud_terms == 1
            and fingerprint == 1
            and stats_token_present
            and free_path_allowed
            and not read_only_risk
        ) else 0


    def get_or_create_room(headers: dict) -> str:
        query = urllib.parse.urlencode({"roomName": "rocket-health"})
        status, payload, _ = request("GET", f"/api/v1/groups.info?{query}", headers=headers)
        if status == 200 and payload.get("success") is True:
            return payload["group"]["_id"]
        try:
            payload = api(headers, "POST", "/api/v1/groups.create", {"name": "rocket-health"})
            return payload["group"]["_id"]
        except CheckError:
            status, payload, _ = request("GET", f"/api/v1/groups.info?{query}", headers=headers)
            if status == 200 and payload.get("success") is True:
                return payload["group"]["_id"]
            raise


    def delete_message(headers: dict, room_id: str, msg_id: str) -> None:
        api(headers, "POST", "/api/v1/chat.delete", {"roomId": room_id, "msgId": msg_id, "asUser": False})


    def post_message(headers: dict, room_id: str, metrics: dict) -> str:
        payload = api(
            headers,
            "POST",
            "/api/v1/chat.postMessage",
            {"roomId": room_id, "text": f"rocket synthetic check {int(time.time())}"},
        )
        metrics["rocket_synthetic_message_success"] = 1
        return payload["message"]["_id"]


    def internal_file_url(file_url: str) -> str:
        base_url = required_env("ROCKET_URL").rstrip("/")
        if file_url.startswith("/"):
            return f"{base_url}{file_url}"
        parsed = urllib.parse.urlparse(file_url)
        suffix = parsed.path
        if parsed.query:
            suffix = f"{suffix}?{parsed.query}"
        return f"{base_url}{suffix}"


    def multipart_upload(headers: dict, room_id: str, metrics: dict):
        boundary = f"----devsh-rocket-{uuid.uuid4().hex}"
        file_content = b"rocket synthetic attachment check\n"
        chunks = []
        chunks.append(f"--{boundary}\r\n".encode("utf-8"))
        chunks.append(
            b'Content-Disposition: form-data; name="file"; filename="rocket-health.txt"\r\n'
            b"Content-Type: text/plain\r\n\r\n"
        )
        chunks.append(file_content + b"\r\n")
        chunks.append(f"--{boundary}--\r\n".encode("utf-8"))
        body = b"".join(chunks)
        upload_headers = dict(headers)
        upload_headers["Content-Type"] = f"multipart/form-data; boundary={boundary}"
        status, payload, _ = request(
            "POST",
            f"/api/v1/rooms.media/{room_id}",
            data=body,
            headers=upload_headers,
            timeout=60,
        )
        if status != 200 or payload.get("success") is False:
            error = payload.get("error") or payload.get("errorType") or payload.get("message") or str(payload)
            raise CheckError(f"attachment upload failed: {error}")
        metrics["rocket_synthetic_attachment_upload_success"] = 1
        file_info = payload.get("file") or {}
        file_id = file_info.get("_id")
        file_url = file_info.get("url")
        if not file_id:
            raise CheckError("attachment upload did not return a file ID")

        confirm = api(
            headers,
            "POST",
            f"/api/v1/rooms.mediaConfirm/{room_id}/{urllib.parse.quote(file_id)}",
            {
                "msg": "rocket synthetic attachment check",
                "description": "rocket synthetic attachment check",
                "groupable": False,
            },
        )
        message = confirm.get("message") or {}
        file_url = None
        for attachment in message.get("attachments", []) or []:
            file_url = attachment.get("title_link") or attachment.get("titleLink") or attachment.get("image_url")
            if file_url:
                break
        if not file_url:
            for file_info in message.get("files", []) or []:
                file_url = file_info.get("url")
                if file_url:
                    break
        if not file_url:
            file_url = (payload.get("file") or {}).get("url")
        if not file_url:
            raise CheckError("attachment confirm did not return a file URL")
        return message.get("_id"), internal_file_url(file_url)


    def check_attachment(headers: dict, file_url: str, metrics: dict) -> None:
        unauth_status, _, _ = request("GET", file_url, timeout=30)
        if unauth_status not in (401, 403, 404):
            raise CheckError(f"unauthenticated attachment read returned HTTP {unauth_status}")
        metrics["rocket_synthetic_attachment_unauth_denied"] = 1

        auth_status, _, _ = request("GET", file_url, headers=headers, timeout=30)
        if auth_status != 200:
            raise CheckError(f"authenticated attachment read returned HTTP {auth_status}")
        metrics["rocket_synthetic_attachment_auth_read_success"] = 1


    def check_synthetic(headers: dict, metrics: dict) -> None:
        room_id = get_or_create_room(headers)
        message_id = ""
        upload_id = ""
        try:
            message_id = post_message(headers, room_id, metrics)
            upload_id, file_url = multipart_upload(headers, room_id, metrics)
            check_attachment(headers, file_url, metrics)
            if message_id:
                delete_message(headers, room_id, message_id)
                metrics["rocket_synthetic_message_delete_success"] = 1
            if upload_id:
                delete_message(headers, room_id, upload_id)
                metrics["rocket_synthetic_attachment_delete_success"] = 1
        finally:
            for msg_id in (message_id, upload_id):
                if not msg_id:
                    continue
                try:
                    delete_message(headers, room_id, msg_id)
                except Exception:
                    pass


    def render_metrics(metrics: dict, error: str = "") -> str:
        global LAST_SUCCESS
        now = int(time.time())
        metrics["rocket_workspace_health_last_run_timestamp_seconds"] = now
        metrics["rocket_synthetic_last_run_timestamp_seconds"] = now
        metrics["rocket_healthcheck_error"] = 1 if error else 0
        if metrics.get("rocket_workspace_health_success") == 1 and metrics.get("rocket_synthetic_success") == 1:
            LAST_SUCCESS = now
        metrics["rocket_workspace_health_last_success_timestamp_seconds"] = LAST_SUCCESS
        metrics["rocket_synthetic_last_success_timestamp_seconds"] = LAST_SUCCESS

        lines = [
            "# HELP rocket_workspace_health_success Rocket.Chat workspace policy healthcheck success.",
            "# TYPE rocket_workspace_health_success gauge",
            "# HELP rocket_synthetic_success Rocket.Chat API and attachment synthetic check success.",
            "# TYPE rocket_synthetic_success gauge",
        ]
        if error:
            lines.append(f"# last_error {error[:180].replace(chr(10), ' ')}")
        for name in sorted(metrics):
            lines.append(f"{name} {metrics[name]}")
        return "\n".join(lines) + "\n"


    def run_checks() -> str:
        metrics = {
            "rocket_workspace_health_success": 0,
            "rocket_workspace_setup_completed": 0,
            "rocket_workspace_cloud_terms_agreed": 0,
            "rocket_workspace_fingerprint_verified": 0,
            "rocket_workspace_stats_token_present": 0,
            "rocket_workspace_airgapped_remaining_days": -1,
            "rocket_workspace_read_only_risk": 0,
            "rocket_workspace_free_path_allowed": 0,
            "rocket_synthetic_success": 0,
            "rocket_synthetic_login_success": 0,
            "rocket_synthetic_message_success": 0,
            "rocket_synthetic_message_delete_success": 0,
            "rocket_synthetic_attachment_upload_success": 0,
            "rocket_synthetic_attachment_unauth_denied": 0,
            "rocket_synthetic_attachment_auth_read_success": 0,
            "rocket_synthetic_attachment_delete_success": 0,
        }
        try:
            headers = login(metrics)
            check_workspace(headers, metrics)
            check_synthetic(headers, metrics)
            metrics["rocket_synthetic_success"] = 1
            return render_metrics(metrics)
        except Exception as exc:
            return render_metrics(metrics, str(exc))


    def cached_metrics() -> str:
        ttl = int(env("CHECK_TTL_SECONDS", "300"))
        now = time.time()
        with LOCK:
            if CACHE["body"] and CACHE["deadline"] > now:
                return CACHE["body"]
            body = run_checks()
            CACHE["body"] = body
            CACHE["deadline"] = now + ttl
            return body


    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/healthz":
                body = b"ok\n"
                self.send_response(200)
                self.send_header("Content-Type", "text/plain; charset=utf-8")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
                return
            if self.path.split("?", 1)[0] != "/metrics":
                self.send_response(404)
                self.end_headers()
                return
            body = cached_metrics().encode("utf-8")
            self.send_response(200)
            self.send_header("Content-Type", "text/plain; version=0.0.4; charset=utf-8")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, fmt, *args):
            return


    if __name__ == "__main__":
        port = int(env("PORT", "9101"))
        server = ThreadingHTTPServer(("0.0.0.0", port), Handler)
        server.serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rocket-healthcheck
  namespace: rocket
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rocket-healthcheck
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rocket-healthcheck
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: exporter
          image: docker.io/python:3.13-slim
          command:
            - /usr/local/bin/python
            - /opt/rocket-health/rocket-health-exporter.py
          envFrom:
            - secretRef:
                name: rocket-bootstrap
          env:
            - name: ROCKET_URL
              value: http://rocketchat-rocketchat:80
            - name: PORT
              value: "9101"
            - name: CHECK_TTL_SECONDS
              value: "300"
          ports:
            - name: metrics
              containerPort: 9101
          volumeMounts:
            - name: scripts
              mountPath: /opt/rocket-health
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 30
      volumes:
        - name: scripts
          configMap:
            name: rocket-healthcheck-scripts
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: rocket-healthcheck
  namespace: rocket
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: rocket-healthcheck
  ports:
    - name: metrics
      port: 9101
      targetPort: metrics
      nodePort: 30101
