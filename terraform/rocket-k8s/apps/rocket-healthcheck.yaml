apiVersion: v1
kind: ConfigMap
metadata:
  name: rocket-healthcheck-scripts
  namespace: rocket
data:
  rocket-mongo-health.js: |
    const now = Math.floor(Date.now() / 1000);

    function setting(id) {
      const doc = db.rocketchat_settings.findOne({ _id: id });
      return doc ? doc.value : null;
    }

    function boolValue(value) {
      if (value === true) return true;
      if (value === false) return false;
      if (typeof value === "string") return value.toLowerCase() === "true";
      return false;
    }

    function numberValue(value, fallback) {
      const parsed = Number(value);
      return Number.isFinite(parsed) ? parsed : fallback;
    }

    function metric(name, value) {
      print(`${name} ${value}`);
    }

    function latestStatsTokenPresent() {
      const candidates = db.getCollectionNames().filter((name) => name.toLowerCase().includes("stat"));
      for (const name of candidates) {
        const cursor = db.getCollection(name)
          .find({ statsToken: { $exists: true, $ne: null } })
          .sort({ createdAt: -1 })
          .limit(1);
        const doc = cursor.hasNext() ? cursor.next() : null;
        if (doc && typeof doc.statsToken === "string" && doc.statsToken.length > 0) {
          return true;
        }
      }
      return false;
    }

    const setupCompleted = setting("Show_Setup_Wizard") === "completed";
    const statsReporting = boolValue(setting("Statistics_reporting"));
    const cloudTerms = boolValue(setting("Cloud_Service_Agree_PrivacyTerms"));
    const fingerprintVerified = boolValue(setting("Deployment_FingerPrint_Verified"));
    const statsTokenPresent = latestStatsTokenPresent();
    const remainingDays = numberValue(setting("Cloud_Workspace_AirGapped_Restrictions_Remaining_Days"), -1);
    const readOnlyRisk = remainingDays >= 0 && remainingDays <= 7;

    const success = setupCompleted
      && statsReporting
      && cloudTerms
      && fingerprintVerified
      && statsTokenPresent
      && !readOnlyRisk;

    print("# HELP rocket_workspace_health_success Rocket.Chat workspace policy healthcheck success.");
    print("# TYPE rocket_workspace_health_success gauge");
    metric("rocket_workspace_health_success", success ? 1 : 0);
    metric("rocket_workspace_health_last_run_timestamp_seconds", now);
    metric("rocket_workspace_health_last_success_timestamp_seconds", success ? now : 0);
    metric("rocket_workspace_setup_completed", setupCompleted ? 1 : 0);
    metric("rocket_workspace_statistics_reporting_enabled", statsReporting ? 1 : 0);
    metric("rocket_workspace_cloud_terms_agreed", cloudTerms ? 1 : 0);
    metric("rocket_workspace_fingerprint_verified", fingerprintVerified ? 1 : 0);
    metric("rocket_workspace_stats_token_present", statsTokenPresent ? 1 : 0);
    metric("rocket_workspace_airgapped_remaining_days", remainingDays);
    metric("rocket_workspace_read_only_risk", readOnlyRisk ? 1 : 0);

  rocket-api-synthetic.py: |
    #!/usr/bin/env python3
    import argparse
    import json
    import os
    import sys
    import time
    import urllib.error
    import urllib.parse
    import urllib.request
    import uuid


    METRICS = {
        "rocket_synthetic_success": 0,
        "rocket_synthetic_login_success": 0,
        "rocket_synthetic_message_success": 0,
        "rocket_synthetic_message_delete_success": 0,
        "rocket_synthetic_attachment_upload_success": 0,
        "rocket_synthetic_attachment_unauth_denied": 0,
        "rocket_synthetic_attachment_auth_read_success": 0,
        "rocket_synthetic_last_success_timestamp_seconds": 0,
    }


    class SyntheticError(RuntimeError):
        pass


    def env(name: str, default: str = "") -> str:
        return os.environ.get(name, default).strip()


    def required_env(name: str) -> str:
        value = env(name)
        if not value:
            raise SyntheticError(f"missing environment variable: {name}")
        return value


    def parse_body(response) -> dict:
        raw = response.read().decode("utf-8", errors="replace")
        if not raw:
            return {}
        try:
            return json.loads(raw)
        except json.JSONDecodeError:
            return {"raw": raw}


    def request(method: str, path_or_url: str, data=None, headers=None, timeout=30):
        base_url = required_env("ROCKET_URL").rstrip("/")
        url = path_or_url if path_or_url.startswith("http") else f"{base_url}{path_or_url}"
        body = None
        request_headers = dict(headers or {})
        if isinstance(data, dict):
            body = json.dumps(data).encode("utf-8")
            request_headers.setdefault("Content-Type", "application/json")
        elif data is not None:
            body = data

        req = urllib.request.Request(url, data=body, headers=request_headers, method=method)
        try:
            with urllib.request.urlopen(req, timeout=timeout) as response:
                return response.status, parse_body(response), response.headers
        except urllib.error.HTTPError as exc:
            try:
                payload = parse_body(exc)
            except Exception:
                payload = {"error": str(exc)}
            return exc.code, payload, exc.headers


    def api(headers: dict, method: str, path: str, data=None, ok=(200,)):
        status, payload, _ = request(method, path, data=data, headers=headers)
        if status in ok and payload.get("success", True) is not False:
            return payload
        error = payload.get("error") or payload.get("errorType") or payload.get("message") or str(payload)
        raise SyntheticError(f"{method} {path} failed: {error}")


    def login() -> dict:
        status, payload, _ = request(
            "POST",
            "/api/v1/login",
            data={"user": required_env("ADMIN_USERNAME"), "password": required_env("ADMIN_PASS")},
        )
        if status != 200 or payload.get("status") != "success":
            error = payload.get("error") or payload.get("message") or str(payload)
            raise SyntheticError(f"login failed: {error}")
        METRICS["rocket_synthetic_login_success"] = 1
        data = payload["data"]
        return {"X-User-Id": data["userId"], "X-Auth-Token": data["authToken"]}


    def get_or_create_room(headers: dict) -> str:
        query = urllib.parse.urlencode({"roomName": "rocket-health"})
        status, payload, _ = request("GET", f"/api/v1/groups.info?{query}", headers=headers)
        if status == 200 and payload.get("success") is True:
            return payload["group"]["_id"]
        try:
            payload = api(headers, "POST", "/api/v1/groups.create", {"name": "rocket-health"})
            return payload["group"]["_id"]
        except SyntheticError:
            status, payload, _ = request("GET", f"/api/v1/groups.info?{query}", headers=headers)
            if status == 200 and payload.get("success") is True:
                return payload["group"]["_id"]
            raise


    def delete_message(headers: dict, room_id: str, msg_id: str) -> None:
        api(headers, "POST", "/api/v1/chat.delete", {"roomId": room_id, "msgId": msg_id, "asUser": False})
        METRICS["rocket_synthetic_message_delete_success"] = 1


    def post_message(headers: dict, room_id: str) -> str:
        payload = api(
            headers,
            "POST",
            "/api/v1/chat.postMessage",
            {"roomId": room_id, "text": f"rocket synthetic check {int(time.time())}"},
        )
        METRICS["rocket_synthetic_message_success"] = 1
        return payload["message"]["_id"]


    def multipart_upload(headers: dict, room_id: str):
        boundary = f"----devsh-rocket-{uuid.uuid4().hex}"
        fields = [
            ("msg", "rocket synthetic attachment check"),
            ("description", "rocket synthetic attachment check"),
        ]
        file_content = b"rocket synthetic attachment check\n"
        chunks = []
        for name, value in fields:
            chunks.append(f"--{boundary}\r\n".encode("utf-8"))
            chunks.append(f'Content-Disposition: form-data; name="{name}"\r\n\r\n'.encode("utf-8"))
            chunks.append(value.encode("utf-8") + b"\r\n")
        chunks.append(f"--{boundary}\r\n".encode("utf-8"))
        chunks.append(
            b'Content-Disposition: form-data; name="file"; filename="rocket-health.txt"\r\n'
            b"Content-Type: text/plain\r\n\r\n"
        )
        chunks.append(file_content + b"\r\n")
        chunks.append(f"--{boundary}--\r\n".encode("utf-8"))
        body = b"".join(chunks)
        upload_headers = dict(headers)
        upload_headers["Content-Type"] = f"multipart/form-data; boundary={boundary}"
        status, payload, _ = request(
            "POST",
            f"/api/v1/rooms.upload/{room_id}",
            data=body,
            headers=upload_headers,
            timeout=60,
        )
        if status != 200 or payload.get("success") is False:
            error = payload.get("error") or payload.get("errorType") or payload.get("message") or str(payload)
            raise SyntheticError(f"attachment upload failed: {error}")
        METRICS["rocket_synthetic_attachment_upload_success"] = 1
        message = payload.get("message") or {}
        file_url = None
        for attachment in message.get("attachments", []) or []:
            file_url = attachment.get("title_link") or attachment.get("titleLink") or attachment.get("image_url")
            if file_url:
                break
        if not file_url:
            for file_info in message.get("files", []) or []:
                file_url = file_info.get("url")
                if file_url:
                    break
        if not file_url:
            raise SyntheticError("attachment upload did not return a file URL")
        return message.get("_id"), internal_file_url(file_url)


    def internal_file_url(file_url: str) -> str:
        base_url = required_env("ROCKET_URL").rstrip("/")
        if file_url.startswith("/"):
            return f"{base_url}{file_url}"
        parsed = urllib.parse.urlparse(file_url)
        suffix = parsed.path
        if parsed.query:
            suffix = f"{suffix}?{parsed.query}"
        return f"{base_url}{suffix}"


    def check_attachment(headers: dict, file_url: str) -> None:
        unauth_status, _, _ = request("GET", file_url, timeout=30)
        if unauth_status not in (401, 403, 404):
            raise SyntheticError(f"unauthenticated attachment read returned HTTP {unauth_status}")
        METRICS["rocket_synthetic_attachment_unauth_denied"] = 1

        auth_status, _, _ = request("GET", file_url, headers=headers, timeout=30)
        if auth_status != 200:
            raise SyntheticError(f"authenticated attachment read returned HTTP {auth_status}")
        METRICS["rocket_synthetic_attachment_auth_read_success"] = 1


    def write_metrics(path: str) -> None:
        now = int(time.time())
        METRICS["rocket_synthetic_last_run_timestamp_seconds"] = now
        if METRICS["rocket_synthetic_success"]:
            METRICS["rocket_synthetic_last_success_timestamp_seconds"] = now

        tmp = f"{path}.{os.getpid()}.tmp"
        with open(tmp, "w", encoding="utf-8") as handle:
            handle.write("# HELP rocket_synthetic_success Rocket.Chat API and attachment synthetic check success.\n")
            handle.write("# TYPE rocket_synthetic_success gauge\n")
            for name in sorted(METRICS):
                handle.write(f"{name} {METRICS[name]}\n")
        os.replace(tmp, path)


    def main() -> int:
        parser = argparse.ArgumentParser()
        parser.add_argument("--output", required=True)
        args = parser.parse_args()
        uploaded_msg_id = None
        message_msg_id = None
        room_id = ""
        headers = {}
        try:
            headers = login()
            room_id = get_or_create_room(headers)
            message_msg_id = post_message(headers, room_id)
            uploaded_msg_id, file_url = multipart_upload(headers, room_id)
            check_attachment(headers, file_url)
            if message_msg_id:
                delete_message(headers, room_id, message_msg_id)
            if uploaded_msg_id:
                delete_message(headers, room_id, uploaded_msg_id)
            METRICS["rocket_synthetic_success"] = 1
            return 0
        except Exception as exc:
            print(f"rocket synthetic check failed: {exc}", file=sys.stderr)
            return 1
        finally:
            try:
                if headers and room_id and message_msg_id and not METRICS["rocket_synthetic_message_delete_success"]:
                    delete_message(headers, room_id, message_msg_id)
            except Exception:
                pass
            try:
                write_metrics(args.output)
            except Exception as exc:
                print(f"failed to write synthetic metrics: {exc}", file=sys.stderr)


    if __name__ == "__main__":
        raise SystemExit(main())
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rocket-mongo-healthcheck
  namespace: rocket
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 600
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          containers:
            - name: healthcheck
              image: docker.io/mongodb/mongodb-community-server:8.0.6-ubi8
              command:
                - /bin/sh
                - -lc
                - |
                  OUT=/textfile-collector/rocket_workspace_health.prom
                  TMP="${OUT}.$$"
                  if mongosh "$MONGO_URI" --quiet /scripts/rocket-mongo-health.js > "$TMP"; then
                    mv "$TMP" "$OUT"
                  else
                    NOW="$(date +%s)"
                    {
                      echo "rocket_workspace_health_success 0"
                      echo "rocket_workspace_health_last_run_timestamp_seconds $NOW"
                      echo "rocket_workspace_health_last_success_timestamp_seconds 0"
                    } > "$TMP"
                    mv "$TMP" "$OUT"
                    exit 1
                  fi
              env:
                - name: MONGO_URI
                  valueFrom:
                    secretKeyRef:
                      name: rocket-mongodb-uri
                      key: mongo-uri
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: textfile-collector
                  mountPath: /textfile-collector
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
          volumes:
            - name: scripts
              configMap:
                name: rocket-healthcheck-scripts
                defaultMode: 0555
            - name: textfile-collector
              hostPath:
                path: /var/lib/node_exporter/textfile_collector
                type: DirectoryOrCreate
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rocket-api-synthetic-check
  namespace: rocket
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 600
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          containers:
            - name: synthetic
              image: docker.io/python:3.13-slim
              command:
                - /usr/local/bin/python
                - /scripts/rocket-api-synthetic.py
                - --output
                - /textfile-collector/rocket_synthetic.prom
              envFrom:
                - secretRef:
                    name: rocket-bootstrap
              env:
                - name: ROCKET_URL
                  value: http://rocketchat-rocketchat:80
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: textfile-collector
                  mountPath: /textfile-collector
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
          volumes:
            - name: scripts
              configMap:
                name: rocket-healthcheck-scripts
                defaultMode: 0555
            - name: textfile-collector
              hostPath:
                path: /var/lib/node_exporter/textfile_collector
                type: DirectoryOrCreate
