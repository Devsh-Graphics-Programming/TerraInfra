apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: rocketchat-foss
  namespace: flux-system
spec:
  image: ghcr.io/devsh-graphics-programming/rocketchat-foss
  interval: 1m
---
apiVersion: v1
kind: Secret
metadata:
  name: github-webhook-token
  namespace: flux-system
type: Opaque
stringData:
  token: "${GITHUB_WEBHOOK_SECRET}"
---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Receiver
metadata:
  name: rocketchat-foss-image
  namespace: flux-system
spec:
  type: github
  events:
    - ping
    - package
    - registry_package
  secretRef:
    name: github-webhook-token
  resources:
    - apiVersion: image.toolkit.fluxcd.io/v1
      kind: ImageRepository
      name: rocketchat-foss
      namespace: flux-system
  suspend: false
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rocket-flux-receiver
  namespace: flux-system
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  ingressClassName: nginx
  rules:
    - host: rocket-flux-hook.devsh.eu
      http:
        paths:
          - path: /hook
            pathType: Prefix
            backend:
              service:
                name: notification-controller
                port:
                  number: 80
