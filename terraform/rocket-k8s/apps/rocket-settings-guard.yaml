apiVersion: batch/v1
kind: CronJob
metadata:
  name: rocket-settings-guard
  namespace: rocket
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 600
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: guard
              image: docker.io/mongodb/mongodb-community-server:8.0.6-ubi8
              command:
                - /bin/sh
                - -lc
                - |
                  mongosh "$MONGO_URI" --quiet <<'JS'
                  const settings = db.rocketchat_settings;
                  const now = new Date();
                  const desired = {
                    Show_Setup_Wizard: "completed",
                    Cloud_Service_Agree_PrivacyTerms: true,
                    Statistics_reporting: true,
                    Site_Name: "DevSH Rocket.Chat",
                    Site_Url: "https://rocketchat.devsh.eu",
                    Organization_Name: "Devsh Graphics Programming",
                    Industry: "technologyServices",
                    Size: "0",
                    Country: "poland",
                    Website: "https://www.devsh.eu",
                    Accounts_RegistrationForm: "Disabled",
                    Accounts_PasswordReset: true,
                    Accounts_TwoFactorAuthentication_Enabled: true,
                    Accounts_TwoFactorAuthentication_By_TOTP_Enabled: true,
                    Accounts_TwoFactorAuthentication_By_Email_Enabled: true,
                    Accounts_TwoFactorAuthentication_By_Email_Auto_Opt_In: false,
                    SMTP_Protocol: "smtp",
                    SMTP_Host: "mail.devsh.eu",
                    SMTP_Port: "587",
                    SMTP_IgnoreTLS: false,
                    SMTP_Pool: true,
                    FileUpload_ProtectFiles: true,
                    FileUpload_Restrict_to_room_members: true,
                    FileUpload_Restrict_to_users_who_can_access_room: false,
                    FileUpload_Enable_json_web_token_for_files: false,
                    Push_enable: false,
                    Push_enable_gateway: false,
                    Deployment_FingerPrint_Verified: true
                  };

                  for (const [id, value] of Object.entries(desired)) {
                    settings.updateOne({ _id: id }, { $set: { value, updatedAt: now } });
                  }

                  db.users.updateOne(
                    { username: "rocket.ops" },
                    { $unset: { "services.email2fa": "", "services.totp": "", "services.emailCode": "" } }
                  );

                  db.rocketchat_permissions.updateOne(
                    { _id: "api-bypass-rate-limit" },
                    { $addToSet: { roles: "user" }, $set: { updatedAt: now } }
                  );
                  print("rocket settings guard applied");
                  JS
              env:
                - name: MONGO_URI
                  valueFrom:
                    secretKeyRef:
                      name: rocket-mongodb-uri
                      key: mongo-uri
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
