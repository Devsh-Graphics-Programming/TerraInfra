apiVersion: v1
kind: Secret
metadata:
  name: rocket-image-webhook-token
  namespace: rocket
type: Opaque
stringData:
  token: "${GITHUB_WEBHOOK_SECRET}"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rocket-image-rollout
  namespace: rocket
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rocket-image-rollout
  namespace: rocket
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["rocketchat-rocketchat"]
    verbs: ["get", "patch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    resourceNames: ["rocket-image-digest-rollout"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rocket-image-rollout
  namespace: rocket
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rocket-image-rollout
subjects:
  - kind: ServiceAccount
    name: rocket-image-rollout
    namespace: rocket
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rocket-image-rollout
  namespace: rocket
data:
  rollout.sh: |
    #!/bin/sh
    set -euo pipefail

    namespace="${NAMESPACE:-rocket}"
    deployment="${DEPLOYMENT:-rocketchat-rocketchat}"
    container="${CONTAINER:-rocketchat}"
    selector="${POD_SELECTOR:-app.kubernetes.io/instance=rocketchat,app.kubernetes.io/name=rocketchat}"
    image="${IMAGE:-ghcr.io/devsh-graphics-programming/rocketchat-foss:devsh}"

    desired="$(skopeo inspect --override-os linux "docker://${image}" | jq -r '.Digest')"
    if [ -z "${desired}" ] || [ "${desired}" = "null" ]; then
      echo "could not resolve digest for ${image}" >&2
      exit 1
    fi

    needs_rollout="$(
      kubectl -n "${namespace}" get pods -l "${selector}" -o json \
        | jq -r --arg container "${container}" --arg desired "${desired}" '
            [
              .items[]
              | select((.metadata.deletionTimestamp // "") == "")
              | .status.containerStatuses[]?
              | select(.name == $container)
              | ((.imageID | split("@")[1]) // "")
            ] as $digests
            | if ($digests | length) == 0 then
                "true"
              else
                (any($digests[]; . != $desired) | tostring)
              end
          '
    )"

    if [ "${needs_rollout}" = "true" ]; then
      ts="$(date -u +%Y%m%dT%H%M%SZ)"
      patch="$(
        jq -n \
          --arg key "rollout.devsh.eu/rocketchat-foss" \
          --arg value "${desired}-${ts}" \
          '{spec:{template:{metadata:{annotations:{($key):$value}}}}}'
      )"
      kubectl -n "${namespace}" patch deployment "${deployment}" --type merge -p "${patch}"
      echo "patched ${deployment} to digest ${desired}"
    else
      echo "no change for ${deployment} (digest ${desired})"
    fi
  webhook.py: |
    import hashlib
    import hmac
    import http.server
    import json
    import secrets
    import subprocess
    import time


    TOKEN_PATH = "/var/run/devsh-webhook/token"
    NAMESPACE = "rocket"
    CRONJOB = "rocket-image-digest-rollout"


    def token() -> bytes:
        with open(TOKEN_PATH, "rb") as fh:
            return fh.read().strip()


    def verified(body: bytes, signature: str) -> bool:
        if not signature.startswith("sha256="):
            return False
        expected = "sha256=" + hmac.new(token(), body, hashlib.sha256).hexdigest()
        return hmac.compare_digest(expected, signature)


    def create_rollout_job() -> str:
        suffix = f"{int(time.time())}-{secrets.token_hex(3)}"
        name = f"rocket-image-digest-rollout-webhook-{suffix}"
        subprocess.run(
            [
                "kubectl",
                "-n",
                NAMESPACE,
                "create",
                "job",
                f"--from=cronjob/{CRONJOB}",
                name,
            ],
            check=True,
            capture_output=True,
            text=True,
            timeout=20,
        )
        return name


    class Handler(http.server.BaseHTTPRequestHandler):
        def log_message(self, fmt, *args):
            print(f"{self.address_string()} - {fmt % args}", flush=True)

        def send_json(self, status, payload):
            body = json.dumps(payload).encode()
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path == "/healthz":
                self.send_json(200, {"ok": True})
                return
            self.send_json(404, {"error": "not found"})

        def do_POST(self):
            if self.path != "/rollout/github":
                self.send_json(404, {"error": "not found"})
                return

            length = int(self.headers.get("Content-Length", "0"))
            body = self.rfile.read(length)
            signature = self.headers.get("X-Hub-Signature-256", "")
            if not verified(body, signature):
                self.send_json(403, {"error": "invalid signature"})
                return

            event = self.headers.get("X-GitHub-Event", "")
            if event == "ping":
                self.send_json(200, {"ok": True, "event": event})
                return
            if event not in ("package", "registry_package"):
                self.send_json(202, {"ok": True, "event": event, "ignored": True})
                return

            try:
                job = create_rollout_job()
            except subprocess.CalledProcessError as exc:
                self.send_json(500, {"error": "job create failed", "stderr": exc.stderr})
                return
            except Exception as exc:
                self.send_json(500, {"error": str(exc)})
                return

            self.send_json(202, {"ok": True, "event": event, "job": job})


    http.server.ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rocket-image-digest-rollout
  namespace: rocket
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 600
      activeDeadlineSeconds: 300
      template:
        spec:
          serviceAccountName: rocket-image-rollout
          restartPolicy: Never
          containers:
            - name: rollout
              image: alpine:3.20
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 300m
                  memory: 256Mi
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  apk add --no-cache jq skopeo kubectl >/dev/null
                  /bin/sh /app/rollout.sh
              volumeMounts:
                - name: rollout
                  mountPath: /app
                  readOnly: true
          volumes:
            - name: rollout
              configMap:
                name: rocket-image-rollout
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rocket-image-rollout-hook
  namespace: rocket
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rocket-image-rollout-hook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rocket-image-rollout-hook
    spec:
      serviceAccountName: rocket-image-rollout
      containers:
        - name: webhook
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          ports:
            - name: http
              containerPort: 8080
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              apk add --no-cache kubectl >/dev/null
              python /app/webhook.py
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: rollout
              mountPath: /app
              readOnly: true
            - name: webhook-token
              mountPath: /var/run/devsh-webhook
              readOnly: true
      volumes:
        - name: rollout
          configMap:
            name: rocket-image-rollout
        - name: webhook-token
          secret:
            secretName: rocket-image-webhook-token
---
apiVersion: v1
kind: Service
metadata:
  name: rocket-image-rollout-hook
  namespace: rocket
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rocket-image-rollout-hook
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rocket-image-rollout-hook
  namespace: rocket
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  ingressClassName: nginx
  rules:
    - host: rocket-flux-hook.devsh.eu
      http:
        paths:
          - path: /rollout
            pathType: Prefix
            backend:
              service:
                name: rocket-image-rollout-hook
                port:
                  number: 80
